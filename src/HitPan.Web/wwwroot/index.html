<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>히트판 ERP</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/hitpan.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HitPan.Web.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/storage.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <!-- 카카오 우편번호 API -->
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <!-- 히트판 우편번호 찾기 interop -->
    <script>
        // 카카오 우편번호 팝업을 열고 선택 결과를 Blazor로 전달한다.
        function openDaumPostcode(dotNetRef) {
            new daum.Postcode({
                oncomplete: function (data) {
                    // 선택한 우편번호와 기본주소를 Blazor 콜백으로 전달한다.
                    dotNetRef.invokeMethodAsync('OnAddressSelected', data.zonecode, data.roadAddress || data.jibunAddress);
                }
            }).open();
        }
    </script>

    <!-- 툴바 마우스 휠 → 가로 스크롤 변환 -->
    <script>
        document.addEventListener('wheel', function (e) {
            var toolbar = e.target.closest('.mud-toolbar');
            if (toolbar && toolbar.scrollWidth > toolbar.clientWidth) {
                e.preventDefault();
                toolbar.scrollLeft += e.deltaY;
            }
        }, { passive: false });
    </script>
</body>

</html>
