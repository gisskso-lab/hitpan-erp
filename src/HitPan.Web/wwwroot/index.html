<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>히트판 ERP</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/hitpan.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HitPan.Web.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/storage.js"></script>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        // 카카오 우편번호 팝업을 열고 결과를 Blazor 컴포넌트로 전달한다.
        window.openDaumPostcode = function (dotnetRef) {
            new daum.Postcode({
                oncomplete: function (data) {
                    // 도로명 주소를 우선 사용하고, 없으면 지번 주소를 사용한다.
                    var fullAddress = data.roadAddress || data.jibunAddress;
                    var zonecode = data.zonecode;
                    // Blazor 컴포넌트의 JSInvokable 메서드로 선택 결과를 전달한다.
                    dotnetRef.invokeMethodAsync("OnAddressSelected", zonecode, fullAddress);
                }
            }).open();
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
