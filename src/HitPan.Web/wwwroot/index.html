    <!-- ── 모바일 홈화면 아이콘 (20260811작1 D-2, 사장님 오더 2026-08-11) ──
         "Y 터치시 모바일 홈화면에 히트판ERP 아이콘 생성" / "아이콘 이쁘게좀 만들어주고"

         ■ 종전 상태 (실측)
           apple-touch-icon 선언이 아예 없었다 ⇒ 아이폰이 홈화면에 추가할 때 볼 아이콘이 없어
           화면을 축소한 이미지나 빈 아이콘이 됐다. icon-192.png 는 Blazor 기본 아이콘(보라 @)이라
           히트판 것도 아니었고 어디서도 불리지 않았다.

         ■ manifest 가 필요한 이유
           이게 없으면 홈화면 아이콘으로 열어도 사파리 주소창이 그대로 보인다(앱처럼 안 뜬다).
           display:standalone 이 주소창을 없애 준다.

         ■ 아이콘 디자인
           사이드바 로고(hp-brand-mark)와 같은 언어 — 히트판 그린 #0F6E56→#0A5240 그라데이션 + 흰 'H'.
           모서리는 안 깎았다: iOS·안드로이드가 홈화면에서 알아서 마스킹하므로, 미리 깎으면 이중으로
           깎여 모서리가 얇아 보인다. -->

    <!-- 🔴 작(2026-08-14) — 팝업창(메신저)에 로그인 상태를 물려준다.
         사장님 지적: "히트판메신저 팝업은 여전히 안됨", "첫 로딩화면은 뜨는데, 빈 화면이 나옴"
         진범: 토큰이 sessionStorage 인데 **sessionStorage 는 창마다 따로다.**
               window.open 으로 연 창은 자기만의 빈 저장소를 갖는다 ⇒ 토큰을 못 찾아
               [Authorize] 에 걸려 아무것도 안 그렸다(로딩 화면까지만 뜨는 이유).
         🔴 **Blazor 시작 전에** 불러야 한다 — 늦으면 이미 로그인 화면으로 튕긴 뒤다.
            순수 JS 라 동기로 즉시 끝난다(부팅을 늦추지 않는다).
         ⚠️ 부모 창이 없으면(주소를 직접 친 경우) 아무 일도 안 한다. -->

    <!-- 카카오 우편번호 API -->
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <!-- 히트판 우편번호 찾기 interop -->
    <script>
        // 카카오 우편번호 팝업을 열고 선택 결과를 Blazor로 전달한다.
        function openDaumPostcode(dotNetRef) {
            new daum.Postcode({
                oncomplete: function (data) {
                    // 선택한 우편번호와 기본주소를 Blazor 콜백으로 전달한다.
                    dotNetRef.invokeMethodAsync('OnAddressSelected', data.zonecode, data.roadAddress || data.jibunAddress);
                }
            }).open();
        }
    </script>

    <!-- 히트판 공용 JS 헬퍼 -->
    <script>
        window.hitpan = window.hitpan || {};

        // PDF/Excel 열기 — iOS Safari 팝업 차단 우회 (<a> click trick) + 모바일 PDF 봉합
        // 모바일(iOS/Android)에서는 _blank 시 PDF가 빈 화면으로 뜨는 버그 봉합 →
        //   동일 창에서 location.href 로 강제 (Safari는 PDF 미리보기 인라인, Chrome은 다운로드)
        window.hitpan.openFile = function (url) {
            var ua = (navigator.userAgent || '').toLowerCase();
            var isMobile = /iphone|ipad|ipod|android/.test(ua);
            var isPdf = /\/pdf(\?|$)|\.pdf(\?|$)/i.test(url);

            // 모바일 + PDF = 동일 창 이동 (Safari 인라인 미리보기 정합)
            if (isMobile && isPdf) {
                window.location.href = url;
                return;
            }

            var a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            setTimeout(function () {
                if (a.parentNode) { a.parentNode.removeChild(a); }
            }, 1000);
        };

        // 네비게이션 앱 딥링크 + 웹 폴백
        window.hitpan.openNavi = function (deepLink, webUrl) {
            var iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            iframe.src = deepLink;
            setTimeout(function () {
                if (iframe.parentNode) { iframe.parentNode.removeChild(iframe); }
                if (!document.hidden) {
                    window.open(webUrl, '_blank', 'noopener');
                }
            }, 300);
        };
    </script>

    <!-- 툴바 마우스 휠 → 가로 스크롤 변환 -->
    <script>
        document.addEventListener('wheel', function (e) {
            var toolbar = e.target.closest('.mud-toolbar');
            if (toolbar && toolbar.scrollWidth > toolbar.clientWidth) {
                e.preventDefault();
                toolbar.scrollLeft += e.deltaY;
            }
        }, { passive: false });
    </script>
