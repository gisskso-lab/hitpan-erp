# HQA S4 관문 ① — GitHub 서버 실측 장치
# 근거: 작업지시서 20261116작_S4관문1_GitHub서버실측 · 설계서 20261116_S4관문1_GitHub서버실측 (§2 · §4-1 · §5 · §6)
# 판정자 = HQA. 이 워크플로가 남기는 글자는 「장치 판독」 뿐이다.
#
# - 트리거: 장치 가지 · 심은빨강 가지 push 만 (태그 · PR · 예약 · 수동 0)
# - 권한: 머리 permissions {} · measure = contents read · publish = contents write (이 잡 하나만)
# - 외부 액션: 전체 커밋 SHA 고정 (태그 고정 금지 · 2026-11-16 gh api 로 확인)
#     actions/checkout          v7 → 3d3c42e5aac5ba805825da76410c181273ba90b1
#     actions/upload-artifact   v5 → 330a01c490aca151604b8cf639adc76d48f6c5d4
#     actions/download-artifact v6 → 018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
# - 고침1: M0 가 고정 머리 값 · 장전 때 HQA 회신 칸 확정을 단언 · 리허설만 판정 무관 점검(probe) · publish 는 measure 시도 번호(raw_id)를 따른다
# - 2단 점화: tools/hqa-s4-measure/MODE = rehearsal (항목 측정 0) → 발행 → armed:<D 전체 SHA>:r<n> (M0 이 단언)
# - 고침4 G8(D-5 ① ⑤ ⑥ ⑦): 트리거 = push 하나 유지 · 재실행 0 — run_attempt > 1 · github.sha ≠ 체크아웃 HEAD ·
#   HEAD^ ≠ MODE 적힌 SHA · (장전) 원자료 가지가 이미 있음 → M0 빨강 = 측정 0 (설계서 §6-6 「재실행 1회」 대체됨)
#   M0 는 측정 잡 첫 단계(체크아웃 바로 뒤) · 원자료 run.json · m0-assert.json 에 github_sha · run_id · run_attempt · mode_line
name: HQA S4 관문1 GitHub 서버 실측

on:
  push:
    branches:
      - 'hqa/20261116-S4-gh실측-장치'
      - 'hqa/20261116-S4-gh실측-장치-심은빨강'

permissions: {}

concurrency:
  group: hqa-s4-measure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: '[장치] 측정'
    runs-on: ubuntu-24.04
    # ⚠️ 잠정값 — 리허설 실측 뒤 PM 이 정한다(작업지시서 A-1)
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.m0.outputs.mode }}
      raw_id: ${{ steps.dirs.outputs.raw_id }}
    steps:
      - name: '[장치] 작업 폴더'
        id: dirs
        run: |
          raw="$RUNNER_TEMP/hqa-raw/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          work="$RUNNER_TEMP/hqa-work"
          mkdir -p "$raw" "$work"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$work/started_utc.txt"
          echo "HQA_RAW=$raw" >> "$GITHUB_ENV"
          echo "HQA_WORK=$work" >> "$GITHUB_ENV"
          echo "raw_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: '[장치] 장치 커밋 받기'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: '[장치] M0 고정 단언'
        id: m0
        run: bash tools/hqa-s4-measure/m0-assert.sh "$HQA_RAW"

      - name: '[장치] 자체시험 — 누출 · 가림'
        id: stl
        run: node tools/hqa-s4-measure/selftest-leak.js --out "$HQA_WORK/selftest-leak.json"

      - name: '[장치] 자체시험 — 판독기'
        id: stj
        env:
          MODE: ${{ steps.m0.outputs.mode }}
        run: |
          f=tools/hqa-s4-measure/selftest-judge.js
          if [ -f "$f" ]; then
            rc=0; node "$f" || rc=$?
            echo "present rc=$rc" > "$HQA_WORK/selftest-judge.status.txt"
            exit $rc
          fi
          echo "absent" > "$HQA_WORK/selftest-judge.status.txt"
          if [ "$MODE" = "armed" ]; then echo "판독기 자체시험 파일 없음 — 장전 런은 빨강" >&2; exit 1; fi
          echo "판독기 자체시험 파일 없음 — 리허설이라 계속"

      - name: '[장치] M1 묶음 지문'
        id: m1
        timeout-minutes: 20
        run: bash tools/hqa-s4-measure/boot.sh m1 "$HQA_RAW" "$HQA_WORK"

      - name: '[장치] M2 꾸러미'
        id: m2
        timeout-minutes: 30
        run: bash tools/hqa-s4-measure/boot.sh m2 "$HQA_RAW" "$HQA_WORK"

      - name: '[장치] M3 브라우저'
        id: m3
        timeout-minutes: 20
        run: bash tools/hqa-s4-measure/boot.sh m3 "$HQA_RAW" "$HQA_WORK"

      - name: '[장치] M4 앱 기동'
        id: m4
        timeout-minutes: 5
        run: bash tools/hqa-s4-measure/boot.sh m4 "$HQA_RAW" "$HQA_WORK"

      # ---- 리허설만: 판정 무관 점검(probe) — 고침1 F10 · 고침2 N1-a · 선택자 존재 · 시간 · NODE_PATH · /before 구분 점검(R1~R3 · 지연 0)만 · 항목 판독 0 ----
      - name: '[장치] 리허설 점검(probe · 판정 무관)'
        id: probe
        if: steps.m0.outputs.mode == 'rehearsal' && steps.m4.outcome == 'success'
        timeout-minutes: 5
        run: |
          HQA_OUT_DIR="$HQA_RAW" HQA_CHROME_PATH="$HQA_CHROME" \
          NODE_PATH="$(dirname "$HQA_PW_DIR")" \
            node tools/hqa-s4-measure/probe.js

      # ---- 여기부터 장전(armed) 때만. 리허설은 항목 측정 0 ----
      - name: '[측정] M5~M6 항목'
        id: items
        if: steps.m0.outputs.mode == 'armed'
        run: |
          f=tools/hqa-s4-measure/run-items.js
          if [ ! -f "$f" ]; then echo "측정 스크립트 없음 — 표본 0 = 빨강" >&2; exit 1; fi
          # 합류 맞춤(PM): 갈래 B 계약 = 환경 변수(HQA_OUT_DIR · HQA_CHROME_PATH · HQA_FIXTURE_DIR) · playwright 는 require 로 푼다
          HQA_OUT_DIR="$HQA_RAW" HQA_CHROME_PATH="$HQA_CHROME" \
          HQA_FIXTURE_DIR="$GITHUB_WORKSPACE/tools/hqa-s4-fixture" \
          NODE_PATH="$(dirname "$HQA_PW_DIR")" \
            node "$f"

      - name: '[판독] M7 장치 판독'
        id: judge
        if: always() && steps.m0.outputs.mode == 'armed' && steps.m0.outcome == 'success' && steps.items.outcome != 'skipped'
        run: |
          f=tools/hqa-s4-measure/judge.js
          if [ ! -f "$f" ]; then echo "판독기 없음 — 빨강" >&2; exit 1; fi
          node "$f" --rules "$GITHUB_WORKSPACE/tools/hqa-s4-measure/rules.json" \
            --samples "$HQA_RAW/samples.jsonl" --out "$HQA_RAW/verdict-device.json"

      # ---- 어느 단계가 죽어도 원자료는 남긴다(M0 실패면 m0-assert.json 만) ----
      - name: '[장치] run.json 조립 · 고정 머리 2회차'
        if: always() && steps.m0.outcome == 'success'
        env:
          OUT_M0: ${{ steps.m0.outcome }}
          OUT_SELFTEST_LEAK: ${{ steps.stl.outcome }}
          OUT_SELFTEST_JUDGE: ${{ steps.stj.outcome }}
          OUT_M1: ${{ steps.m1.outcome }}
          OUT_M2: ${{ steps.m2.outcome }}
          OUT_M3: ${{ steps.m3.outcome }}
          OUT_M4: ${{ steps.m4.outcome }}
          OUT_ITEMS: ${{ steps.items.outcome }}
          OUT_JUDGE: ${{ steps.judge.outcome }}
          OUT_PROBE: ${{ steps.probe.outcome }}
        run: bash tools/hqa-s4-measure/boot.sh runjson "$HQA_RAW" "$HQA_WORK"

      - name: '[장치] M8 가림'
        id: mask
        if: always() && (steps.m0.outcome == 'success' || steps.m0.outcome == 'failure')
        run: node tools/hqa-s4-measure/mask.js "$HQA_RAW"

      - name: '[장치] M9 누출 검사'
        id: leak
        if: always() && (steps.m0.outcome == 'success' || steps.m0.outcome == 'failure')
        env:
          M0_OUTCOME: ${{ steps.m0.outcome }}
        run: |
          extra=""
          if [ "$M0_OUTCOME" = "success" ]; then extra="--withheld-write"; fi
          node tools/hqa-s4-measure/leak-scan.js "$HQA_RAW" --stage measure --remove $extra

      - name: '[장치] M10 해시 목록'
        if: always() && (steps.m0.outcome == 'success' || steps.m0.outcome == 'failure')
        run: bash tools/hqa-s4-measure/publish.sh sums "$HQA_RAW"

      - name: '[장치] 원자료 운반'
        if: always() && (steps.m0.outcome == 'success' || steps.m0.outcome == 'failure')
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hqa-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hqa-raw
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: false

  publish:
    name: '[장치] 원자료 커밋'
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    # ⚠️ 잠정값 — 리허설 실측 뒤 PM
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: '[장치] 장치 커밋 받기'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: '[장치] 원자료 받기'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          # 고침1 F11: 실패한 잡만 다시 돌려도 measure 가 올린 이름을 받는다
          name: hqa-raw-${{ needs.measure.outputs.raw_id }}
          path: ${{ runner.temp }}/hqa-in

      - name: '[장치] 누출 재검 · check-ignore · 원자료 가지 커밋'
        env:
          HQA_IN: ${{ runner.temp }}/hqa-in
          HQA_PUSH_TOKEN: ${{ github.token }}
          HQA_MEASURE_RESULT: ${{ needs.measure.result }}
          HQA_RAW_ID: ${{ needs.measure.outputs.raw_id }}
        run: bash tools/hqa-s4-measure/publish.sh commit
