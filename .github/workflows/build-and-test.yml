# 빌드·시험 CI (사장님 결재 Plan 2026-06-09 — cicd-velvety-reef)
#
# 트리거: develop/main push + PR
# 검증: errors 0 + warnings 0 (헌법 #19 정합)
# 실패 시 머지 금지
name: Build & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Build (errors 0 + warnings 0)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/HitPan.sln

      - name: Build (Release + warnings as errors)
        # 헌법 #19: errors 0 + warnings 0이 정합성·무결성
        run: dotnet build src/HitPan.sln --configuration Release --no-restore --nologo /p:TreatWarningsAsErrors=true /warnaserror

      - name: Test (Unit + Integration)
        run: dotnet test src/HitPan.sln --configuration Release --no-build --nologo --verbosity normal --logger "trx;LogFileName=test-results.trx"
        continue-on-error: false

      # 게이트 (2026-07-16, 작1 W-0 — 설계팀·검증팀 SoD 확증한 P0 재발 차단):
      #   마이그 SQL(DB-*.sql)이 publish 산출물에서 통째로 누락되는 사고를 원천 차단한다.
      #   .sql 은 .NET SDK 기본 Content 가 아니라, csproj 복사 지시가 빠지면 publish 에 0개가 실린다.
      #   개수만 비교하면 못 잡는다(0바이트 복사, 소스 추가 시 하드코딩 개수 통과) → 파일명 '집합' 동일성 +
      #   각 파일 비어있지 않음을 검사한다(CTO 부분수정 4). 다르면 빌드 실패.
      - name: Publish ERP API (마이그 SQL 편입 확인용)
        run: dotnet publish src/HitPan.API/HitPan.API.csproj -c Release -r win-x64 --self-contained false -o publish-migsmoke --nologo

      - name: Gate — 마이그 SQL 집합 동일 + 비어있지 않음
        shell: pwsh
        run: |
          $srcDir = 'src/HitPan.API/Migrations/SQL'
          $outDir = 'publish-migsmoke/Migrations/SQL'
          $src = @(Get-ChildItem -Path $srcDir -Filter 'DB-*.sql' -File | ForEach-Object { $_.Name } | Sort-Object)
          if (-not (Test-Path $outDir)) {
            Write-Error "::error::publish 산출물에 Migrations/SQL 폴더가 없습니다 — 마이그 SQL 이 배포에서 통째로 누락됩니다(csproj 복사 지시 확인). P0."
            exit 1
          }
          $out = @(Get-ChildItem -Path $outDir -Filter 'DB-*.sql' -File | ForEach-Object { $_.Name } | Sort-Object)
          $missing = $src | Where-Object { $_ -notin $out }
          $extra   = $out | Where-Object { $_ -notin $src }
          if ($missing.Count -gt 0 -or $extra.Count -gt 0) {
            Write-Error "::error::마이그 SQL 집합 불일치 — 산출물 누락:[$($missing -join ', ')] 초과:[$($extra -join ', ')]. 소스 $($src.Count)개 vs 산출물 $($out.Count)개."
            exit 1
          }
          $empty = @(Get-ChildItem -Path $outDir -Filter 'DB-*.sql' -File | Where-Object { $_.Length -eq 0 } | ForEach-Object { $_.Name })
          if ($empty.Count -gt 0) {
            Write-Error "::error::마이그 SQL 0바이트 복사 — [$($empty -join ', ')]. 내용이 실리지 않았습니다."
            exit 1
          }
          Write-Host "[MigSmoke] 마이그 SQL $($out.Count)개 집합 동일 + 전부 비어있지 않음. OK."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: '**/test-results.trx'
          retention-days: 14

  # 🔴 20260828작14 W1 — DB 게이트 CI 실행 (5축 전수조사 최대 발견 봉합).
  #   사고: build 잡(시험 1100개 전부)엔 DB 가 없고, DB 를 띄우는 ddl-smoke 잡은 스모크 1개만 돌렸다.
  #        DB 게이트는 서버 미가용 시 `return` 으로 빠져나오는데 xUnit 에게 그건 PASS 다.
  #        ⇒ 진짜 게이트마저 한 번도 안 돌았고 "1100개 통과" 는 글자검사만의 통과였다.
  #        8/28 P0 4건(명세서 중복·반품 무제한·취소가 반품 증발·업체별 원장)이 그걸 뚫고 나왔다.
  #   봉합: DB 를 물린 잡에서 Integrity 게이트를 실제로 돌린다.
  #        DbGateEnvironment.IsCi 가 CI 에서 SKIP 자체를 막으므로, 못 붙으면 초록불이 안 나온다.
  #   build 잡과 독립 병렬(needs 없음) — 컴파일이 아니라 "게이트가 실제로 도는가" 축이다.
  db-gate:
    name: DB 게이트 (Integrity — 실제 DB 실행)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: dbgate_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install MariaDB client
        # 게이트가 MysqlExe() 로 클라이언트 실행파일 존재를 확인한다 — 없으면 못 붙은 것으로 본다.
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3306 -u root -pdbgate_ci -e "SELECT 1" >/dev/null 2>&1; then
              echo "MariaDB ready"; exit 0
            fi
            echo "waiting for mariadb ($i)"; sleep 2
          done
          echo "::error::MariaDB 서비스 컨테이너 기동 실패"; exit 1

      - name: Start STATEMENT MariaDB (위험 서버 재현 — RcSafePathGate 전용)
        # 🔴 20260920작1 갈래 S2 (작지 §5-1 · 설계 §6-1).
        #   서비스 컨테이너(`services:`)로는 못 한다 — `options` 는 docker run 옵션이지 CMD 인자가 아니라
        #   `--log-bin --binlog-format=STATEMENT` 같은 **기동 인자**를 줄 수 없다. 그래서 스텝에서 직접 띄운다.
        #
        #   왜 필요한가: 수금·지급 등록은 binlog_format=STATEMENT 서버에서 READ COMMITTED 쓰기가 1665 로 거절된다.
        #   그래서 그런 서버에서는 REPEATABLE READ + 잠금 읽기 경로로 간다. 그 경로는 **이 인스턴스에서만** 돈다 —
        #   위의 3306(기본 MIXED)은 RC 경로라 RR 분기에 아예 안 들어간다. 즉 이 스텝이 없으면
        #   RR 봉합 전체가 CI 에서 한 번도 안 돌고, 그건 이 잡이 처음부터 막으려던 「안 돈 게이트를 통과로 세기」다.
        run: |
          docker run -d --name mariadb-stmt -p 3307:3306 \
            -e MARIADB_ROOT_PASSWORD=dbgate_ci \
            mariadb:11.4 --log-bin=stmt --binlog-format=STATEMENT --server-id=9920
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3307 -u root -pdbgate_ci -e "SELECT 1" >/dev/null 2>&1; then
              echo "STATEMENT MariaDB ready"
              # 🔴 「떴다」로 만족하지 않는다 — 위험 서버인지 값으로 확인한다(게이트 fixture 도 같은 것을 다시 잰다).
              mysql -h 127.0.0.1 -P 3307 -u root -pdbgate_ci -N \
                -e "SELECT CONCAT('log_bin=', @@log_bin, ' binlog_format=', @@binlog_format, ' ', VERSION());"
              exit 0
            fi
            echo "waiting for statement mariadb ($i)"; sleep 2
          done
          echo "::error::STATEMENT MariaDB 기동 실패 — RcSafePathGate 가 못 돈다. 건너뛴 게이트는 통과가 아니다."
          docker logs mariadb-stmt || true
          exit 1

      - name: Create gate database (출하 DDL 적재)
        # 일부 게이트는 자기 DB 를 스스로 만들지만(CREATE DATABASE),
        # TrialBalance 처럼 HITPAN_TEST_DB 가 이미 있다고 보고 붙는 게이트가 있다.
        # 🔴 빈 DB 로는 부족하다 — 게이트가 TEMPORARY 표로 가리지 않는 실제 표(collections 등)를 읽는다.
        #    출하 DDL(hitpan_db_clean.sql)이 신규설치 단일 진실원이므로(헌법 #36) 그대로 적재한다.
        #    ⚠️ --default-character-set=utf8mb4 필수 — 없으면 한글이 CP949 로 재져 길이가 틀리게 나온다.
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pdbgate_ci --default-character-set=utf8mb4 \
            -e "CREATE DATABASE IF NOT EXISTS hitpan_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -P 3306 -u root -pdbgate_ci --default-character-set=utf8mb4 \
            hitpan_e2e < installer/hitpan_db_clean.sql
          echo "적재된 표 개수:"
          mysql -h 127.0.0.1 -P 3306 -u root -pdbgate_ci --default-character-set=utf8mb4 \
            -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='hitpan_e2e';"

      - name: Restore & Build
        run: |
          dotnet restore src/HitPan.sln
          dotnet build src/HitPan.Tests/HitPan.Tests.csproj --configuration Release --no-restore --nologo

      - name: Run Integrity gates (실제 DB)
        # 🔴 이 잡의 존재 이유: 게이트가 "돌았는가" 를 잰다.
        #    DbGateEnvironment.IsCi 가 true 이므로 SKIP 경로가 막힌다 — 못 붙으면 실패로 드러난다.
        env:
          CI: 'true'
          HITPAN_REQUIRE_DB: 'true'
          HITPAN_MYSQL: 'mysql'
          HITPAN_DB_HOST: '127.0.0.1'
          HITPAN_DB_PORT: '3306'
          HITPAN_DB_USER: 'root'
          HITPAN_DB_PASS: 'dbgate_ci'
          HITPAN_TEST_DB: 'hitpan_e2e'
          # 🔴 20260920작1 S2 — 위험 서버(STATEMENT) 인스턴스. RcSafePathGate 는 **이 변수로만** 그 서버를 찾는다.
          #   없거나 못 붙으면 게이트가 실패한다(SKIP 을 통과로 세지 않는다 · fixture 가 log_bin/binlog_format 까지 확인).
          HITPAN_DB_STMT_PORT: '3307'
        #
        # 🔴 범위를 밝힌다 (조용한 축소 금지) — 이번에 무는 것은 **업무 로직 게이트 12종**이다.
        #    기기·승인 계열(DeviceAndKey·DeviceSlotSeed·ApproverCandidate 등)은 시험마다
        #    `CREATE DATABASE` 로 임시 DB 를 만들어 쓴다. 그 권한 축은 이번 봉합 범위 밖이라
        #    여기 안 넣는다. **안 넣었다는 사실을 로그에 남긴다** — 넣은 척하면 이번에 봉합한
        #    "안 돈 게이트를 통과로 세는" 사고를 형태만 바꿔 반복하는 것이다.
        run: |
          set -o pipefail
          GATES="SalesRemainingQtyGate|TrialBalanceGate|MoneyFlowJournalGate|ChainIntegrityCheckGate"
          GATES="$GATES|SalesChainNoDuplicateGate|SalesChainDupGuardGate|SalesChainLinkGate"
          GATES="$GATES|StockAlertIdempotencyGate|PurchaseReturnListParityGate"
          GATES="$GATES|PurchaseReturnLinkDisplayGate|AutoChainPolicyGate|BomLevelProducibleGate"
          GATES="$GATES|SalesStatusVocabularyGate"
          # 20260903작18 — 재고 정합성 검사식 창고축. 봉합 완료분이라 지금 문다.
          GATES="$GATES|StockWarehouseIntegrityGate"
          # 🔴 20260903작19 WarehousePickingGate — 20260904작1 에서 등록했다.
          #    종전 주석: "G-P1 이 의도적으로 빨간불(배분 로직 W4 미착수 — 배분규칙 결재 대기).
          #                W4 완료 시 주석을 풀어 등록한다. 등록이 곧 완료 판정이다."
          #
          #    🔴 그 조건은 **다른 방식으로** 해소됐다 — 배분(C안)을 만든 게 아니라 **폐기**됐다.
          #    사장님 지시 2번: "분산은 재고이송으로 수동변경" ⇒ 자동배분은 만들지 않는다.
          #    출고는 한 창고에서 나가고, 시스템은 "어느 창고냐" 만 정한다(WarehouseResolver 3단).
          #    ⇒ G-P1 이 재는 대상이 "배분"이 아니라 "창고결정"으로 바뀌었고, 작19 로 봉합됐다.
          #
          #    🔴 등록 근거는 "초록불이라서" 가 아니라 **무력화 시험**이다 (20260904 실측):
          #      WarehouseResolver 의 ②단(상품마스터 기본창고)을 죽이면
          #      → G-P1 이 'WH-MAIN' 을 뱉으며 FAIL (= 테스트1창고 −15 를 만든 그 경로 재현).
          #      → 봉합을 되돌리면 빨간불이 된다는 것을 실제로 확인한 뒤 등록한다.
          GATES="$GATES|WarehousePickingGate"
          # 🔴 20260904작20 BomWarehouseResolutionGate — BOM 생산·해체의 창고결정.
          #    매출(작19)·매입은 상품마스터 기본창고를 보는데 BOM 만 안 봐서,
          #    A창고에 자재가 있어도 MAIN 에서 빼려다 생산이 통째로 막혔다(G-B1 실측).
          #    G-B4 는 별개 축이다 — 자재 조회가 창고별로 부풀어 2창고면 10개 생산에 20개가 빠졌다.
          #    등록 근거는 무력화 시험이다: 창고결정을 죽이면 G-B1·G-B2 가, 창고합산을 죽이면
          #    G-B4 가 각각 빨간불이 된다(두 축이 독립적으로 걸린다는 것까지 확인).
          GATES="$GATES|BomWarehouseResolutionGate"
          # 🔴 20260910작1 A1 MdbOverwriteReseedGate — 「모두 지우고 새로 가져오기」 + 회사 뼈대 재시드.
          #    초기화가 표준 계정과목 27·대표 사원·직급 6·근로기준 16·기본창고를 지우는데
          #    되살리는 코드가 0건이었다(선행검증 20260909검1 §2-1). 사장님 결재 2026-09-10 로 재시드를 넣었다.
          #
          #    등록 근거는 "초록불이라서" 가 아니라 **무력화 시험**이다 (20260910 실측):
          #      · 재시드에서 계정과목 시드를 빼면 → G-OW1(27→0)·G-OW2·G-OW3 이 빨간불
          #      · 확인문구·비번 검사를 죽이면 → G-OW5 가 "지우기가 불렸다" 로 빨간불
          #      · continue/동기 경로의 덮어쓰기 차단을 빼면 → G-OW6 빨간불
          #    G-OW4 는 **대조군**이다 — 재시드를 안 한 회사는 같은 자리가 0 이어야 한다.
          #    (재시드 없이도 27 이 나오면 이 게이트들은 다른 것을 재고 있는 것이다.)
          GATES="$GATES|MdbOverwriteReseedGate"
          # 🔴 20260911작5 BackupCredentialGate — 백업 비밀번호 결함 핫픽스(1.3.40).
          #    열린 연결의 ConnectionString 에서 비번이 빠져 덤프가 "-p" 빈 값으로 떠 숨은 콘솔에서 멈췄다
          #    (선행검증 20260911 격리재현). G-BK1 실제 덤프 · G-BK2 빈 비번 즉시 실패 · G-BK3 취소 시 덤프 종료+failed
          #    (+대조군) · G-BK4 기본 폴더 · G-BK5 덤프 실행파일 · G-BK6 복원 잠시 막기(C-11 사장님 결정).
          #
          #    등록 근거는 "초록불이라서" 가 아니라 **무력화 시험**이다 (20260911 Windows 격리 MariaDB 11.4 실측):
          #      · 수정 전 코드(2bee68f0)          → 7/7 FAIL (덤프 60초 멈춤 · 취소 뒤 mysqldump 생존 · 이력 running)
          #      · 자격증명을 다시 ConnectionString → G-BK1 빨간불 (1045 using password: NO)
          #      · 빈 비번 사전 차단 제거          → G-BK2 · 기본 폴더 결정 되돌림 → G-BK4 · 복원 차단 제거 → G-BK6 (나머지 초록)
          #      · 취소 시 프로세스 종료 제거      → G-BK3 만 빨간불 (덤프 생존)
          #      · 실패 UPDATE 를 다시 ct 로       → G-BK3 만 빨간불 (running)
          #      · 실행파일 순서 되돌림            → G-BK5 빨간불 (+ PATH 에 MySQL 8.4 가 있는 PC 는 G-BK1·3 도 COLUMN_STATISTICS 로)
          #    G-BK3 대조군 — 잠금을 걸지 않으면 같은 덤프가 끝나 success 여야 한다.
          #    9d389cc7 추가 (C-12 교차점·허용목록 · C-16 보관 0B) — 무력화는 **검증자 손으로** 분리 worktree 에서 재현:
          #      · 재분석 지점(교차점) 검사 제거   → G-BK4 만 빨간불 (Backup 교차점 · 상위 교차점 수락)
          #      · 보관 계산의 0바이트 제외 제거   → G-BK7 만 빨간불 (이전 성공 백업 삭제)
          #      · (구현자 추가) 실패 파일 삭제 끔 · 개별 사용자 허용 끔 · 실제 위치 확인 끔 → 해당 단언 빨간불
          #    G-BK7 대조 — 가장 오래된 성공 백업 1개는 지워진다(보관정책 자체는 돈다).
