          #
          #    등록 근거는 "초록불이라서" 가 아니라 **무력화 시험**이다
          #    (20260921 Windows 격리 MariaDB 11.4.10-log · 포트 33406 · log_bin=ON · binlog_format=STATEMENT ·
          #     매 건 치환 건수 확인 → 원복 → git diff 0):
          #      · 판정기 호출 제거(항상 RC) 1건        → G-RC1 · G-RC2 · G-RC5 (등록 첫 문장 1665)
          #      · RR 분기를 파생표로 되돌림 1건        → G-RC3 · G-RC4 (옛 R 로 판정 → 초과 통과)
          #      · RR 전용 상수 5개 꼬리 잠금절 제거 5건 → G-RC3 · G-RC4
          #      · 재시도 화이트리스트 비움 1건          → G-RC5 — **다른 거래처 동시 등록이 교착 1213 으로 터졌다.**
          #        🔴 20260921 S4 정정(작지 §19-3 S4-1 · §19-6-2): 「다른 거래처 동시는 교착이 안 난다」는 **기대값이 아니다.**
          #        DB-124 로 매칭 잠금을 좁힌 뒤에도 교착은 남는다 — 상대가 매칭 잠금이 아니라 수기 등록의
          #        `uq_*_source` 유니크 간극이기 때문이다(별건 · 작지 §19-4). 재시도는 예외 미화가 아니라
          #        RR 경로에서 정상 동시 등록의 성립 조건이고, 게이트가 재는 것은 「교착 0」이 아니라
          #        **① 교착 상대가 매칭 잠금 인덱스가 아닐 것 ② 재시도가 받아 사용자에겐 성공** 이다.
          #      · LockTailFor 를 항상 빈 문자열로 1건   → G-RC6 (전표 사용액을 옛 합으로 읽어 합계 초과 통과)
          #      · 판정 기본값(모르는 값)을 RC 로 1건    → G-RC7
          #      · RR 식의 source_type<>'migration' 제거 1건 → G-RC10 E3 (공용 M 40,000 ↔ RR M 90,000 으로 갈라짐)
          #      · 공용 식에 공백 1개 추가 1건           → G-RC11 앵커
          #    대조군 — G-RC8 은 **안전 서버(3306)에서 모드 = RC** 여야 한다. 이게 없으면 「항상 RR」과 구별이 안 된다.
          #
          #    🔴 20260921 갈래 S4 추가분 (G-RC12·13·14·15). 무력화 실측 5건(위험 33406 · 매 건 원복 후 git diff 0):
          #      · 반품 문장 잠금 꼬리절만 제거 1건        → G-RC6 빨간불
          #      · 고객 문구 `MsgReceiptOver` 한 글자 변경  → **G-RC15 빨간불** (G-RC6 은 못 잡는다 — 기대 문구를
          #        제품 상수에서 만들기 때문이다. 그래서 문구 본문을 앵커로 박았다 · 작지 §19-6-1)
          #      · DB-124 인덱스 4개 제거 1건              → G-RC12 · G-RC13 빨간불
          #        ⚠️ G-RC5 는 **안 걸린다**(먼저 부딪히는 상대가 유니크 간극) — 작지 §19-6-2 에 사실대로 적었다.
          #      · `DeliveryUsedSql` 에 `USE INDEX` 강제 1건 → G-RC13 빨간불
          #      · L3 에 `FORCE INDEX(idx_pay_type)` 강제 1건 → G-RC13 빨간불, **그 이유로**
          #        (「고른 인덱스 첫 칸이 tenant_id 도 아니고 단일칸 PK 도 아니다」 — 안전판정 규칙에 이빨이 있다는 증거)
          #    🔴 G-RC13 의 안전판정은 **이름 목록이 아니라 스키마에 물어서** 한다(작지 §19-1):
          #      ①첫 칸이 tenant_id ②아니면 그 칸이 어느 표의 단일칸 PK(한 값 = 한 회사) ③그 표에서 두 회사에 걸친 값 0건.
          #      손으로 적는 예외 목록은 이름만 더하면 조용히 초록이 되는 길이라 **두지 않는다.**
          #    출하 DDL 적재 스텝이 DB-124 인덱스 4개를 포함하는지 확인함 — S3 에서 `hitpan_db_clean.sql` 에 편입됨(헌법 #36).
          #    근거: docs/개발/erp/20260920작1_갈래S2_게이트_CI_개발명세서.md §4 · …갈래S4_게이트보강_개발명세서.md §4
          # 🔴 20260922 N-1 봉합 (CTO 래리 [5] 1차결재 · 사장님 「N-1 은 고치는 걸로」)
          #    사고: 20260921작2 갈래 A 가 만든 게이트 4개(G-RC16 이웃프로브 · G-RC17 쌍부등식 ·
          #          G-RC17 살아있음 A-3 · G-RC18-a)가 **CI 에서 한 번도 안 돌았다.**
          #          같은 **파일**(RcSafePathGateTests.cs)에 있지만 **클래스가 `RcLockRatioGateTests`** 이고,
          #          이 필터는 `FullyQualifiedName~` 매칭이라 **클래스 이름이 다르면 안 잡는다.**
          #    🔴 그리고 아래 「SKIP 이 한 건도 없어야 한다」 스텝이 **이것을 구조적으로 못 잡는다** —
          #       필터에서 빠진 시험은 **실행 자체가 안 돼 로그에 한 글자도 안 남는다.**
          #       `[SKIP]` 가드는 「돌았는데 건너뛴 것」만 본다. ⇒ 봉합의 유일한 감시자가 개발 PC 에만 있었다.
          #    ⇒ 🔴 **새 게이트 클래스를 만들면 이 줄에 등록하고, CI 로그에 그 이름이 뜨는지까지 확인한다.**
          #       (「게이트는 글자가 아니라 동작」 26번째 · 근거: docs/운영기록/20260922결1_…CTO1차결재.md N-1)
          GATES="$GATES|RcSafePathGate|RcLockRatioGate"
          # 🔴 20260922작3 — 메인PC 「왕복 증명」 봉인·기기줄 게이트(G-11a·G-14·G-15·G-16·G-18·G-19a).
          #    등록 근거는 **초록불이 아니라 무력화 시험**이다(#32) — 봉합을 빼고 실제로 FAIL 을 확인했다:
          #      C-10 옛 메인PC 내리기 UPDATE 제거 → G-15 · C-11 rows==0 검사 제거 → G-16b
          #      C-12 거래처/상품 한쪽만 세기 → G-18 · C-13 키없음→미등록 갈래 제거 → G-14
          #    표 전문: docs/개발/erp/20260922작3_메인PC게이트시험_개발명세서.md §4
          #    🔴 이 잡이 **유일한 계측 경로**다 — 개발 PC 의 `hitpan` 계정은 CREATE DATABASE 권한이 없어
          #       로컬에서는 건너뛰기 표시로만 남는다(개발명세서 §5). 로컬 초록을 통과로 읽지 마라.
          #       ⚠️ 이 주석에 건너뛰기 표시를 **글자 그대로 적지 않는다** — 아래 가드가 로그를 그 글자로
          #          훑으므로, 적어 두면 훗날 가드가 잡 로그를 훑게 바뀌는 날 애먼 빨간불이 된다.
          #    🟢 계측 완료 2026-09-22 (run 35740148757 · SHA 2cf53752): 5건 전부 Passed(각 700~790ms).
          #       같은 잡의 유일한 실패는 별건 A(G-RC13)이고 이 게이트와 무관하다.
          GATES="$GATES|MainPcSealRegistryGate"

          echo "▶ 이 잡이 무는 게이트: $GATES"
          # 🔴 20260913작2 정정 — 이제 기기 계열 중 **MainPcRestartMarkGate 는 문다**(임시 DB 권한 실측 · C-3).
          #    🔴 20260922작3 추가 — **MainPcSealRegistryGate 도 문다**(위 등록).
          #    나머지 기기·승인 계열은 여전히 안 문다. "안 넣었다는 사실을 로그에 남긴다" 는 원칙 그대로다.
          echo "▶ 이 잡이 물지 않는 것: 기기·승인 계열 중 DeviceAndKey·DeviceSlotSeed·ApproverCandidate 등(범위 밖)"
          echo "▶ 기기 계열 중 무는 것: MainPcRestartMarkGate (20260913작2) · MainPcSealRegistryGate (20260922작3)"
          # ⚠️ MainPcProofRoundTripGate(순수 게이트 13건)는 **여기에 넣지 않는다** — DB 를 안 쓴다.
          #    `build` 잡의 `dotnet test src/HitPan.sln` 이 필터 없이 이미 문다. DB 유무에 순수 게이트를 묶지 않는다.

          FILTER=$(echo "$GATES" | sed 's/|/|FullyQualifiedName~/g')
          dotnet test src/HitPan.Tests/HitPan.Tests.csproj \
            --configuration Release --no-build --nologo --verbosity normal \
            --filter "FullyQualifiedName~$FILTER" \
            --logger "trx;LogFileName=db-gate-results.trx" 2>&1 | tee "$RUNNER_TEMP/dbgate.log"

      - name: Gate — SKIP 이 한 건도 없어야 한다
        # 🔴 초록불이 어디서 왔는지 본다. [SKIP] 이 찍혔다면 그 게이트는 안 돈 것이고,
        #    안 돈 게이트를 통과로 세는 것이 이번에 봉합한 사고 그 자체다.
        if: always()
        run: |
          if grep -rq "\[SKIP\]" "$RUNNER_TEMP"/dbgate.log 2>/dev/null; then
            echo "::error::DB 게이트가 SKIP 됐다 — CI 에서 건너뛴 게이트는 통과가 아니다."
            exit 1
          fi
          echo "SKIP 없음 — 게이트가 실제로 돌았다."

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: db-gate-results
          path: '**/db-gate-results.trx'
          retention-days: 14

  # 20260723작1 G3 — 출하 DDL 스모크 CI화 (헌법 #36).
  #   clean DDL 이 빈 DB 단일 import 로 신규설치 완결되는지 실측한다(신규설치 DOA 차단).
  #   그동안 scripts/ddl-smoke-test.sh 는 로컬 수동 전용이라 CI 게이트가 아니었다.
  #   MariaDB 11.4 서비스 컨테이너에서 scripts/ddl-smoke-test.sh 를 env 주입해 돌린다.
  #   build 잡과 독립 병렬(needs 없음) — DDL 무결은 빌드와 별개 축이다.
  ddl-smoke:
    name: DDL Smoke (clean DDL 신규설치 무결)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ddlsmoke_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3306 -u root -pddlsmoke_ci -e "SELECT 1" >/dev/null 2>&1; then
              echo "MariaDB ready"; exit 0
            fi
            echo "waiting for mariadb ($i)"; sleep 2
          done
          echo "::error::MariaDB 서비스 컨테이너 기동 실패"; exit 1

      - name: Run DDL smoke (clean DDL 단일 import)
        # 하위호환: 스크립트는 env 미주입 시 로컬 윈도 경로·소켓·무비번으로 폴백.
        #   CI 는 아래 5개 주입. HITPAN_MYSQL 은 실행파일 경로 하나만(host/port 는 분리 주입).
        env:
          HITPAN_MYSQL: 'mysql'
          HITPAN_DB_USER: 'root'
          HITPAN_DB_PASS: 'ddlsmoke_ci'
          HITPAN_DB_HOST: '127.0.0.1'
          HITPAN_DB_PORT: '3306'
        run: bash scripts/ddl-smoke-test.sh

  # 20260809작4 ①번 — 권한 메뉴 코드 정합 (사장님 결재).
  #   프론트 ErpMenus 와 백엔드 MenuList 의 코드가 어긋나면
  #   화면은 "권한이 저장됐습니다" 라고 말하는데 직원은 계속 403 이다.
  #   빌드는 통과하고 화면도 정상으로 보이므로 사람 눈으로는 안 잡힌다 — CI 가 대신 기억한다.
  #   build 잡과 독립 병렬(needs 없음) — 컴파일과 무관한 데이터 계약 축이다.
  permission-menu-sync:
    name: 권한 메뉴 코드 정합 (프론트 ↔ 백엔드)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check permission menu code sync
        run: bash scripts/check-permission-menu-sync.sh

  migration-id-collision:
    name: 마이그레이션 번호 충돌 (DB-NN 유일성)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 왜 이 잡이 있나 (2026-08-24 P0): DB-100 이 급여·퇴직서 두 파일에 겹쳐,
      # 급여가 이미 적용된 고객 DB 에서 퇴직서 SQL 이 통째로 skip 됐다 → 그 화면만 500.
      # 빌드 0/0 과 로컬 빈 DB 실측은 이걸 못 잡는다(파일 이름 문제 + 빈 DB 엔 기록이 없음).
      - name: Check migration id collision
        run: bash scripts/check-migration-id-collision.sh

  verify-index-declaration:
    name: 인덱스 마이그 선언 (@verify-index 누락)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 왜 이 잡이 있나 (2026-09-21, 20260921작2 §14-4 · §15-1 P-21):
      #   인덱스 마이그는 실패해도 오류 0건·화면 정상이라 아무도 못 본다. 그래서 워치독 업데이트 검증이
      #   "선언된 인덱스가 실제로 있는가" 를 확인하는데, 그 목록을 코드에 하드코딩하지 않고
      #   마이그 파일 머리말의 '-- @verify-index:' 선언에서 읽는다.
      #   🔴 남는 구멍은 "다음 마이그가 선언을 안 적는 것" 하나다 — 그걸 여기서 닫는다.
      - name: Check @verify-index declaration
        run: bash scripts/check-verify-index-declaration.sh
