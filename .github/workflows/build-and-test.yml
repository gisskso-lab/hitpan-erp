# 빌드·시험 CI (사장님 결재 Plan 2026-06-09 — cicd-velvety-reef)
#
# 트리거: develop/main push + PR
# 검증: errors 0 + warnings 0 (헌법 #19 정합)
# 실패 시 머지 금지
name: Build & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Build (errors 0 + warnings 0)
    runs-on: windows-latest
    timeout-minutes: 30
    # 🔴 20261007작10 §2-7 교정④ — 이 잡은 **DB 를 안 띄운다**. 그 사실을 선언한다.
    #   작10 게이트는 선언 없이 DB 가 없으면 **실패**한다(조용한 초록 차단 · DbGateEnvironment.SkipOrFailStrict).
    #   ⇒ 여기서 선언하지 않으면 build 잡 전체가 빨간불이 된다. 그리고 **이 잡의 초록은 그 게이트의 증거가 아니다**
    #     (증거는 db-gate 잡뿐 — 9/22 「build 잡 초록은 증거 아님」과 같은 규칙).
    env:
      HITPAN_GATE_SKIP_OK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/HitPan.sln

      - name: Build (Release + warnings as errors)
        # 헌법 #19: errors 0 + warnings 0이 정합성·무결성
        run: dotnet build src/HitPan.sln --configuration Release --no-restore --nologo /p:TreatWarningsAsErrors=true /warnaserror

      # 🔴 20261007작12 2차수 T-6 봉합차수([4] N5) — G-T6-5(실물 Inno Pascal)는 이 전체 시험에서
      #   **스스로 빠진다**(HITPAN_REQUIRE_ISCC 가 1 이 아니면 iscc-optout.log 만 남기고 지나간다).
      #   왜: 러너에 Inno 가 기본 탑재돼 있어 전체 시험이 그걸 집어 컴파일했고, 그 게이트 하나가 깨지자
      #       required `build` 가 빨강이 되어 **모든 PR 의 머지가 막혔다**(run 37613228947 · Failed 1).
      #   계측은 아래 전용 단계에서만 하고, 그 단계는 ISCC 없으면 스킵이 아니라 FAIL 이다.
      - name: Test (Unit + Integration)
        run: dotnet test src/HitPan.sln --configuration Release --no-build --nologo --verbosity normal --logger "trx;LogFileName=test-results.trx"
        continue-on-error: false

      # 🔴 20260930작1 I-API 8 — 수동 업데이트·수동 되돌리기 게이트를 **이름으로** 문다(db-gate 잡의 GATES 방식 그대로).
      #   왜 이 잡인가: DB 불필요 · 교체 일꾼(local-swap.ps1)을 Windows PowerShell 로 실제로 돌리는 게이트가 있다(-TestRoot 대역 폴더)
      #     ⇒ ubuntu 인 db-gate 잡에는 못 넣는다. 위 전체 시험에도 들어 있지만, 전체 시험 초록은 「이 게이트가 돌았다」의 증거가 아니다
      #     (이름이 바뀌거나 클래스가 빠져도 초록). 그래서 목록으로 따로 돌리고, **클래스마다 한 건 이상 돌았는지** trx 로 센다.
      #   목록: 이벤트 번호(계약 §9) · 병렬이슈 03 한 번에 하나 · 병렬이슈 04 미들웨어 통과(익명 401·비메인PC 403·비관리자 403·양성)
      #         · ONSTART 부팅 안전망 삭제 · 수동 업데이트 자체 점검 · 화면 계약(F)
      #   대조 실측(9/30 로컬 · 개발명세서 I-API §8): LocalRollbackController [MainPcOnly] 한 줄 뺌 → G-IN3a 2건 FAIL
      #     · 목록에 없는 이름 한 개 추가 → 「0건」 FAIL(exit 1) · 원복 뒤 양성 65건(1·8·25·8·11·12) PASS
      - name: 작1 게이트 — 수동 업데이트·되돌리기 (목록으로 · 클래스별 실행 수 확인)
        shell: bash
        run: |
          set -o pipefail
          GATES="LocalSwapEventIdGateTests|LocalSwapOneAtATimeGateTests|LocalSwapPipelineGateTests|LocalSwapOnStartGateTests"
          GATES="$GATES|ManualUpdateSelfCheckTests|LocalSwapUiGateTests"
          # 20260930작1 봉합 차수(작업지시서 §12-1 M) — K1 원위치·조기종료·겹침 · K2 첨부 옮겨 싣기 · L 런처·재료 · M 연결(판 이력·사전 판정·예약)
          GATES="$GATES|LocalSwapRevertGateTests|LocalSwapWorkerSealGateTests|LocalSwapChatFilesGateTests|LocalSwapSealGateTests|LocalSwapWiringGateTests"
          # 20260930작1 봉합 2차(작업지시서 §13) — 남은 찌꺼기 처리(A 갈래) · 런처 쪽 찌꺼기 판정(B 갈래)
          GATES="$GATES|LocalSwapLeftoverGateTests|LocalSwapLeftoverLauncherGateTests"
          # 20260930작1 확대 1.3.50(작업지시서 §18 · 설계 §19-2) — 남기기(G-NK) · 세 번째 길(G-NP) · 일꾼 rollback+manual_zip(G-NW) · 완료 팝업 판정(G-ND)
          GATES="$GATES|LocalSwapManifestKeepGateTests|LocalSwapPrevFetchGateTests|LocalSwapPrevFetchWorkerGateTests|LocalSwapDonePopupGateTests|RollbackWatchGateTests"
          # 🔴 20261007작12 2차수 T-6 — 설치 실패 문구 도달(G-T6-1·2·3). windows-latest 전용이라 이 잡에 합류한다.
          #    .iss 에서 PS 블록을 복원해 powershell.exe 로 **실제 실행** + 로컬 HttpListener 가 423/401/500 한글 JSON 반환.
          #    대조군·FAIL 실측: docs/개발/백오피스/20261007작12_2차수_T6_설치실패문구_도달_개발명세서.md §4
          GATES="$GATES|InstallerBootstrapMessageGateTests"
          echo "▶ 이 단계가 무는 게이트: $GATES"
          FILTER=$(echo "$GATES" | sed 's/|/|FullyQualifiedName~/g')
          dotnet test src/HitPan.Tests/HitPan.Tests.csproj \
            --configuration Release --no-build --nologo --verbosity normal \
            --filter "FullyQualifiedName~$FILTER" \
            --logger "trx;LogFileName=swap-gate-results.trx" 2>&1 | tee "$RUNNER_TEMP/swapgate.log"
          TRX=$(find . -name 'swap-gate-results.trx' -print | head -n 1)
          if [ -z "$TRX" ]; then echo "::error::swap-gate-results.trx 가 없다 — 게이트가 안 돌았다"; exit 1; fi
          MISSING=""
          for g in $(echo "$GATES" | tr '|' ' '); do
            n=$(grep -o "className=\"[^\"]*\.$g\"" "$TRX" | wc -l)
            echo "  $g : $n 건"
            if [ "$n" -eq 0 ]; then MISSING="$MISSING $g"; fi
          done
          if [ -n "$MISSING" ]; then echo "::error::목록에 있는데 한 건도 안 돈 게이트:$MISSING"; exit 1; fi
          echo "작1 게이트 전부 실제로 돌았다."

      # 🔴 20261007작12 2차수 T-6 — **실물 Inno Pascal** 게이트(G-T6-5 · 갈래 ⓑ1).
      #   왜 별 단계인가: Inno 의 LoadStringsFromFile 이 **UTF-8 BOM 파일을 어떤 인코딩으로 읽는지**
      #   아무도 모른다(U1). 틀리면 42자 한글이 고객 설치 화면에서 깨지고 「문구가 닿았다」가 통째로 무너진다.
      #   복제본으로는 못 잰다 — ISCC 말고는 잴 길이 없다.
      #   ISCC 설치는 build-installer.yml:179 · deploy-update.yml:572 가 쓰는 방식을 그대로 베꼈다.
      #   🔴 HITPAN_REQUIRE_ISCC=1 이라 ISCC 가 없으면 **스킵이 아니라 FAIL** 이다.
      #   ⚠️ 개발 PC 에는 ISCC 를 깔지 않는다(#29 사전승인) ⇒ **이 단계가 유일한 계측 경로**다
      #      (로컬에서는 iscc-skips.log 표식만 남는다).
      #   🔴 봉합차수([4] N4) — 앞선 차수는 이 설치 단계가 **전체 시험 뒤**에 있어 전체 시험이 먼저 터지며
      #      아예 안 돌았고, 게이트는 **러너 기본 탑재 Inno** 로 컴파일됐다(시험본·출하본 판 갈림).
      #      ⇒ 설치를 전용 단계 **바로 앞**에 두고, HITPAN_ISCC_EXPECT_VERSION 으로 게이트가 **판을 직접 단언**한다.
      - name: ISCC 설치 (실물 Inno Pascal 게이트용 · 출하와 같은 6.7.1)
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: 작12 T-6 게이트 — 실물 Inno Pascal (G-T6-5 · 전용 단계)
        env:
          HITPAN_REQUIRE_ISCC: "1"
          # 🔴 출하가 굽는 판(build-installer.yml:179 · deploy-update.yml:583)과 같아야 한다.
          #    다르면 게이트가 FAIL 한다 — 재는 것이 출하물이 아니게 되는 걸 막는다.
          HITPAN_ISCC_EXPECT_VERSION: "6.7.1"
        shell: bash
        run: |
          set -o pipefail
          # 🔴 앞선 단계(전체 시험·작1 게이트)가 남긴 표식을 먼저 지운다 — 안 지우면 아래 조용한초록 판별이
          #    남의 표식을 보고 늘 터진다. 이 단계가 **자기 실행**만 보도록 만든다.
          find . -name 'iscc-optout.log' -delete || true
          find . -name 'iscc-version-unmeasured.log' -delete || true
          # 🔴 [4] V-6 봉합(10/7 밤) — 앞선 필터 `~…G_T6_5` 는 **`G_T6_5e`(판정식 단위시험)까지 삼켰다**.
          #    그래서 「실물 계측 건수」가 4→5 로 늘어 비실물 1건이 실물 숫자에 섞였다.
          #    끝에 `_` 를 붙여 실물 본체(`G_T6_5_실물_…`)만 집는다. b·c·d·e 는 전체 시험이 이미 돌린다.
          dotnet test src/HitPan.Tests/HitPan.Tests.csproj \
            --configuration Release --no-build --nologo --verbosity normal \
            --filter "FullyQualifiedName~InstallerBootstrapMessageGateTests.G_T6_5_" \
            --logger "trx;LogFileName=t6-iscc-results.trx" 2>&1 | tee "$RUNNER_TEMP/t6iscc.log"
          TRX=$(find . -name 't6-iscc-results.trx' -print | head -n 1)
          if [ -z "$TRX" ]; then echo "::error::t6-iscc-results.trx 가 없다 — 게이트가 안 돌았다"; exit 1; fi
          # 🔴 [4] N6 — 앞선 식 `grep -o 'G_T6_5[^"]*'` 은 **시험 수가 아니다**(한 시험이 여러 번 매친다).
          #    trx 의 결과 레코드(testName 속성)만 세서 사람이 읽는 「N 건」을 진짜 건수로 만든다.
          N=$(grep -o 'testName="[^"]*G_T6_5[^"]*"' "$TRX" | wc -l)
          echo "  G-T6-5* : $N 건 (결과 레코드 수)"
          if [ "$N" -eq 0 ]; then echo "::error::G-T6-5 가 한 건도 안 돌았다"; exit 1; fi
          # 🔴 ISCC 가 있는데도 전용 단계가 아니라며 빠져나갔으면(= env 가 안 먹었으면) 조용한 초록이다.
          if find . -name 'iscc-optout.log' -print -quit | grep -q .; then
            echo "::error::전용 단계인데 iscc-optout.log 가 생겼다 — HITPAN_REQUIRE_ISCC 가 시험에 안 닿았다"
            find . -name 'iscc-optout.log' -exec cat {} \;
            exit 1
          fi
          # 🔴 2차 봉합(10/7 밤) — 판을 **아무 출처도 모를 때**는 과녁 본체를 막지 않고 통과시키되
          #    조용한 초록이 되지 않게 표식을 띄운다. 실측값은 위 `[G-T6-5 판출처]` 줄에 전부 찍혀 있다.
          #    ⚠️ 이 경고가 떠 있는 동안 N4(시험본==출하본)는 **안 재지고 있다** — 별건 트랙에서 닫는다.
          if find . -name 'iscc-version-unmeasured.log' -print -quit | grep -q .; then
            echo "::warning::N4 미계측 — Inno 판을 아는 출처가 하나도 없다. 아래 판출처 실측값으로 다음 단언식을 고른다."
            find . -name 'iscc-version-unmeasured.log' -exec cat {} \;
          fi

      - name: 안 잰 축 표식 (ISCC 없는 러너)
        if: always()
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path . -Filter 'iscc-skips.log' -Recurse -File -ErrorAction SilentlyContinue
          if ($f) {
            Write-Host "::warning::ISCC 없는 러너 — 실물 Inno Pascal 축은 이 판에서 재지 않았다"
            $f | ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName }
          } else {
            Write-Host "[ISCC축] iscc-skips.log 없음 — 실물 Inno Pascal 로 실측한 판이다"
          }
          # 🔴 전체 시험에서 G-T6-5 가 의도대로 빠졌다는 표식(N5). 없어도 실패는 아니지만 로그에 남긴다.
          $o = Get-ChildItem -Path . -Filter 'iscc-optout.log' -Recurse -File -ErrorAction SilentlyContinue
          if ($o) { $o | ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName } }

      # 🔴 20260928작2 개정3 W-3 — storage.js 의 「비교 후 지움」·「옮겨 오기 표식」을 node 로 **실제로** 돌려 잰다
      #   (글자 검사 아님 · 파일을 vm 에서 올려 window.hitpanStorage_* 를 부른다). 러너(windows-latest)에 node 가 있다.
      #   ⚠️ 디렉터리가 아니라 파일을 준다 — node 22 는 `--test <디렉터리>` 를 파일로 읽어 실패한다(로컬 실측).
      - name: W-3 storage.js (node)
        run: node --test tests/node/storage_w3.test.js

      # 🔴 20260924작1 §5 — **안 잰 축을 로그에 드러낸다** (PM 결재 · 헌법 #32)
      #   메인PC 봉인 게이트 일부는 TPM(Platform KSP)이 있어야만 성립한다.
      #   TPM 없는 러너에서 그 축을 건너뛰는 것은 정당하지만,
      #   🚨 **건너뛴 사실이 안 보이면 「막는 척만 하는 게이트」와 구별되지 않는다**(가짜게이트 8건 전례).
      #   VSTest 는 통과 시험의 콘솔 출력을 CI 로그에 싣지 않고(실측 확인),
      #   xUnit 2.9.3 에는 Assert.Skip 이 없어 Skipped 집계로도 못 띄운다.
      #   ⇒ 시험이 남긴 표식 파일을 여기서 **그대로 출력**한다. 파일이 없으면 모든 축을 실측한 판이다.
      #   ⚠️ 판정을 바꾸지 않는다 — 보여주기만 한다(always 라 실패해도 찍힌다).
      - name: 안 잰 축 표식 (TPM 없는 러너)
        if: always()
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path . -Filter 'tpm-skips.log' -Recurse -File -ErrorAction SilentlyContinue
          if ($f) {
            Write-Host "::warning::TPM(Platform KSP) 없는 러너 — 아래 축은 이 판에서 재지 않았다"
            $f | ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName }
          } else {
            Write-Host "[TPM축] tpm-skips.log 없음 — 모든 축을 실측한 판이다"
          }

      # 게이트 (2026-07-16, 작1 W-0 — 설계팀·검증팀 SoD 확증한 P0 재발 차단):
      #   마이그 SQL(DB-*.sql)이 publish 산출물에서 통째로 누락되는 사고를 원천 차단한다.
      #   .sql 은 .NET SDK 기본 Content 가 아니라, csproj 복사 지시가 빠지면 publish 에 0개가 실린다.
      #   개수만 비교하면 못 잡는다(0바이트 복사, 소스 추가 시 하드코딩 개수 통과) → 파일명 '집합' 동일성 +
      #   각 파일 비어있지 않음을 검사한다(CTO 부분수정 4). 다르면 빌드 실패.
      - name: Publish ERP API (마이그 SQL 편입 확인용)
        run: dotnet publish src/HitPan.API/HitPan.API.csproj -c Release -r win-x64 --self-contained false -o publish-migsmoke --nologo

      - name: Gate — 마이그 SQL 집합 동일 + 비어있지 않음
        shell: pwsh
        run: |
          $srcDir = 'src/HitPan.API/Migrations/SQL'
          $outDir = 'publish-migsmoke/Migrations/SQL'
          $src = @(Get-ChildItem -Path $srcDir -Filter 'DB-*.sql' -File | ForEach-Object { $_.Name } | Sort-Object)
          if (-not (Test-Path $outDir)) {
            Write-Error "::error::publish 산출물에 Migrations/SQL 폴더가 없습니다 — 마이그 SQL 이 배포에서 통째로 누락됩니다(csproj 복사 지시 확인). P0."
            exit 1
          }
          $out = @(Get-ChildItem -Path $outDir -Filter 'DB-*.sql' -File | ForEach-Object { $_.Name } | Sort-Object)
          $missing = $src | Where-Object { $_ -notin $out }
          $extra   = $out | Where-Object { $_ -notin $src }
          if ($missing.Count -gt 0 -or $extra.Count -gt 0) {
            Write-Error "::error::마이그 SQL 집합 불일치 — 산출물 누락:[$($missing -join ', ')] 초과:[$($extra -join ', ')]. 소스 $($src.Count)개 vs 산출물 $($out.Count)개."
            exit 1
          }
          $empty = @(Get-ChildItem -Path $outDir -Filter 'DB-*.sql' -File | Where-Object { $_.Length -eq 0 } | ForEach-Object { $_.Name })
          if ($empty.Count -gt 0) {
            Write-Error "::error::마이그 SQL 0바이트 복사 — [$($empty -join ', ')]. 내용이 실리지 않았습니다."
            exit 1
          }
          Write-Host "[MigSmoke] 마이그 SQL $($out.Count)개 집합 동일 + 전부 비어있지 않음. OK."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: '**/test-results.trx'
          retention-days: 14

  # 🔴 20260828작14 W1 — DB 게이트 CI 실행 (5축 전수조사 최대 발견 봉합).
  #   사고: build 잡(시험 1100개 전부)엔 DB 가 없고, DB 를 띄우는 ddl-smoke 잡은 스모크 1개만 돌렸다.
  #        DB 게이트는 서버 미가용 시 `return` 으로 빠져나오는데 xUnit 에게 그건 PASS 다.
  #        ⇒ 진짜 게이트마저 한 번도 안 돌았고 "1100개 통과" 는 글자검사만의 통과였다.
  #        8/28 P0 4건(명세서 중복·반품 무제한·취소가 반품 증발·업체별 원장)이 그걸 뚫고 나왔다.
  #   봉합: DB 를 물린 잡에서 Integrity 게이트를 실제로 돌린다.
  #        DbGateEnvironment.IsCi 가 CI 에서 SKIP 자체를 막으므로, 못 붙으면 초록불이 안 나온다.
  #   build 잡과 독립 병렬(needs 없음) — 컴파일이 아니라 "게이트가 실제로 도는가" 축이다.
  db-gate:
    name: DB 게이트 (Integrity — 실제 DB 실행)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: dbgate_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install MariaDB client
        # 게이트가 MysqlExe() 로 클라이언트 실행파일 존재를 확인한다 — 없으면 못 붙은 것으로 본다.
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3306 -u root -pdbgate_ci -e "SELECT 1" >/dev/null 2>&1; then
              echo "MariaDB ready"; exit 0
            fi
            echo "waiting for mariadb ($i)"; sleep 2
          done
          echo "::error::MariaDB 서비스 컨테이너 기동 실패"; exit 1

      - name: Raise max_connections (작6 — CI DB 연결 한도)
        # 작6(20261006) 실측: 병렬 DB 게이트만으로 Threads_connected 151/151 · Max_used 152 · 1040 Too many connections
        #   → 무관 시험이 접속 시간초과로 깜빡였다(G3-D3·G10-D2·WG-D3·BK). 게이트 47 클래스 중 42 가 격리 DB 마다 연결 풀.
        #   CI 시험용 DB 만의 설정 — 고객 PC·운영 DB 무관. 재시도로 감싸지 않는다(값 단언을 숨기지 않기).
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pdbgate_ci -e "SET GLOBAL max_connections = 500; SHOW GLOBAL VARIABLES LIKE 'max_connections';"

      - name: Create gate database (출하 DDL 적재)
        # 일부 게이트는 자기 DB 를 스스로 만들지만(CREATE DATABASE),
        # TrialBalance 처럼 HITPAN_TEST_DB 가 이미 있다고 보고 붙는 게이트가 있다.
        # 🔴 빈 DB 로는 부족하다 — 게이트가 TEMPORARY 표로 가리지 않는 실제 표(collections 등)를 읽는다.
        #    출하 DDL(hitpan_db_clean.sql)이 신규설치 단일 진실원이므로(헌법 #36) 그대로 적재한다.
        #    ⚠️ --default-character-set=utf8mb4 필수 — 없으면 한글이 CP949 로 재져 길이가 틀리게 나온다.
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pdbgate_ci --default-character-set=utf8mb4 \
            -e "CREATE DATABASE IF NOT EXISTS hitpan_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -P 3306 -u root -pdbgate_ci --default-character-set=utf8mb4 \
            hitpan_e2e < installer/hitpan_db_clean.sql
          echo "적재된 표 개수:"
          mysql -h 127.0.0.1 -P 3306 -u root -pdbgate_ci --default-character-set=utf8mb4 \
            -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='hitpan_e2e';"

      - name: Restore & Build
        run: |
          dotnet restore src/HitPan.sln
          dotnet build src/HitPan.Tests/HitPan.Tests.csproj --configuration Release --no-restore --nologo

      - name: Run Integrity gates (실제 DB)
        # 🔴 이 잡의 존재 이유: 게이트가 "돌았는가" 를 잰다.
        #    DbGateEnvironment.IsCi 가 true 이므로 SKIP 경로가 막힌다 — 못 붙으면 실패로 드러난다.
        env:
          CI: 'true'
          HITPAN_REQUIRE_DB: 'true'
          HITPAN_MYSQL: 'mysql'
          HITPAN_DB_HOST: '127.0.0.1'
          HITPAN_DB_PORT: '3306'
          HITPAN_DB_USER: 'root'
          HITPAN_DB_PASS: 'dbgate_ci'
          HITPAN_TEST_DB: 'hitpan_e2e'
        #
        # 🔴 범위를 밝힌다 (조용한 축소 금지) — 이번에 무는 것은 **업무 로직 게이트 12종**이다.
        #    기기·승인 계열(DeviceAndKey·DeviceSlotSeed·ApproverCandidate 등)은 시험마다
        #    `CREATE DATABASE` 로 임시 DB 를 만들어 쓴다. 그 권한 축은 이번 봉합 범위 밖이라
        #    여기 안 넣는다. **안 넣었다는 사실을 로그에 남긴다** — 넣은 척하면 이번에 봉합한
        #    "안 돈 게이트를 통과로 세는" 사고를 형태만 바꿔 반복하는 것이다.
        run: |
          set -o pipefail
          GATES="SalesRemainingQtyGate|TrialBalanceGate|MoneyFlowJournalGate|ChainIntegrityCheckGate"
          GATES="$GATES|SalesChainNoDuplicateGate|SalesChainDupGuardGate|SalesChainLinkGate"
          GATES="$GATES|StockAlertIdempotencyGate|PurchaseReturnListParityGate"
          GATES="$GATES|PurchaseReturnLinkDisplayGate|AutoChainPolicyGate|BomLevelProducibleGate"
          GATES="$GATES|SalesStatusVocabularyGate"
          # 20260903작18 — 재고 정합성 검사식 창고축. 봉합 완료분이라 지금 문다.
          GATES="$GATES|StockWarehouseIntegrityGate"
          # 🔴 20260903작19 WarehousePickingGate — 20260904작1 에서 등록했다.
          #    종전 주석: "G-P1 이 의도적으로 빨간불(배분 로직 W4 미착수 — 배분규칙 결재 대기).
          #                W4 완료 시 주석을 풀어 등록한다. 등록이 곧 완료 판정이다."
          #
          #    🔴 그 조건은 **다른 방식으로** 해소됐다 — 배분(C안)을 만든 게 아니라 **폐기**됐다.
          #    사장님 지시 2번: "분산은 재고이송으로 수동변경" ⇒ 자동배분은 만들지 않는다.
          #    출고는 한 창고에서 나가고, 시스템은 "어느 창고냐" 만 정한다(WarehouseResolver 3단).
          #    ⇒ G-P1 이 재는 대상이 "배분"이 아니라 "창고결정"으로 바뀌었고, 작19 로 봉합됐다.
          #
          #    🔴 등록 근거는 "초록불이라서" 가 아니라 **무력화 시험**이다 (20260904 실측):
          #      WarehouseResolver 의 ②단(상품마스터 기본창고)을 죽이면
          #      → G-P1 이 'WH-MAIN' 을 뱉으며 FAIL (= 테스트1창고 −15 를 만든 그 경로 재현).
          #      → 봉합을 되돌리면 빨간불이 된다는 것을 실제로 확인한 뒤 등록한다.
          GATES="$GATES|WarehousePickingGate"
          # 🔴 20260904작20 BomWarehouseResolutionGate — BOM 생산·해체의 창고결정.
          #    매출(작19)·매입은 상품마스터 기본창고를 보는데 BOM 만 안 봐서,
          #    A창고에 자재가 있어도 MAIN 에서 빼려다 생산이 통째로 막혔다(G-B1 실측).
          #    G-B4 는 별개 축이다 — 자재 조회가 창고별로 부풀어 2창고면 10개 생산에 20개가 빠졌다.
          #    등록 근거는 무력화 시험이다: 창고결정을 죽이면 G-B1·G-B2 가, 창고합산을 죽이면
          #    G-B4 가 각각 빨간불이 된다(두 축이 독립적으로 걸린다는 것까지 확인).
          GATES="$GATES|BomWarehouseResolutionGate"
          # 🔴 20260910작1 A1 MdbOverwriteReseedGate — 「모두 지우고 새로 가져오기」 + 회사 뼈대 재시드.
          #    초기화가 표준 계정과목 27·대표 사원·직급 6·근로기준 16·기본창고를 지우는데
          #    되살리는 코드가 0건이었다(선행검증 20260909검1 §2-1). 사장님 결재 2026-09-10 로 재시드를 넣었다.
          #
          #    등록 근거는 "초록불이라서" 가 아니라 **무력화 시험**이다 (20260910 실측):
          #      · 재시드에서 계정과목 시드를 빼면 → G-OW1(27→0)·G-OW2·G-OW3 이 빨간불
          #      · 확인문구·비번 검사를 죽이면 → G-OW5 가 "지우기가 불렸다" 로 빨간불
          #      · continue/동기 경로의 덮어쓰기 차단을 빼면 → G-OW6 빨간불
          #    G-OW4 는 **대조군**이다 — 재시드를 안 한 회사는 같은 자리가 0 이어야 한다.
          #    (재시드 없이도 27 이 나오면 이 게이트들은 다른 것을 재고 있는 것이다.)
          GATES="$GATES|MdbOverwriteReseedGate"
          # 🔴 20260911작5 BackupCredentialGate — 백업 비밀번호 결함 핫픽스(1.3.40).
          #    열린 연결의 ConnectionString 에서 비번이 빠져 덤프가 "-p" 빈 값으로 떠 숨은 콘솔에서 멈췄다
          #    (선행검증 20260911 격리재현). G-BK1 실제 덤프 · G-BK2 빈 비번 즉시 실패 · G-BK3 취소 시 덤프 종료+failed
          #    (+대조군) · G-BK4 기본 폴더 · G-BK5 덤프 실행파일 · G-BK6 복원 잠시 막기(C-11 사장님 결정).
          #
          #    등록 근거는 "초록불이라서" 가 아니라 **무력화 시험**이다 (20260911 Windows 격리 MariaDB 11.4 실측):
          #      · 수정 전 코드(2bee68f0)          → 7/7 FAIL (덤프 60초 멈춤 · 취소 뒤 mysqldump 생존 · 이력 running)
          #      · 자격증명을 다시 ConnectionString → G-BK1 빨간불 (1045 using password: NO)
          #      · 빈 비번 사전 차단 제거          → G-BK2 · 기본 폴더 결정 되돌림 → G-BK4 · 복원 차단 제거 → G-BK6 (나머지 초록)
          #      · 취소 시 프로세스 종료 제거      → G-BK3 만 빨간불 (덤프 생존)
          #      · 실패 UPDATE 를 다시 ct 로       → G-BK3 만 빨간불 (running)
          #      · 실행파일 순서 되돌림            → G-BK5 빨간불 (+ PATH 에 MySQL 8.4 가 있는 PC 는 G-BK1·3 도 COLUMN_STATISTICS 로)
          #    G-BK3 대조군 — 잠금을 걸지 않으면 같은 덤프가 끝나 success 여야 한다.
          #    9d389cc7 추가 (C-12 교차점·허용목록 · C-16 보관 0B) — 무력화는 **검증자 손으로** 분리 worktree 에서 재현:
          #      · 재분석 지점(교차점) 검사 제거   → G-BK4 만 빨간불 (Backup 교차점 · 상위 교차점 수락)
          #      · 보관 계산의 0바이트 제외 제거   → G-BK7 만 빨간불 (이전 성공 백업 삭제)
          #      · (구현자 추가) 실패 파일 삭제 끔 · 개별 사용자 허용 끔 · 실제 위치 확인 끔 → 해당 단언 빨간불
          #    G-BK7 대조 — 가장 오래된 성공 백업 1개는 지워진다(보관정책 자체는 돈다).
          #    ⚠️ G-BK4 의 교차점·권한 단언은 Windows 전용 — 리눅스는 건너뛴 단언 목록을 출력한다.
          #    ✅ C-17: Windows 빌드 잡 러너 계정 = 기본 Administrator(RID 500) 확인(run 34601851691 · ⓔ 「재지 못했다」 실패)
          #       → G-BK4 ⓔ 는 같은 계정 도메인의 RID 501(Guest)/503(DefaultAccount) 중 사용자로 판정되는 계정으로 대조 ·
          #       고른 RID 를 표준오류 한 줄(「G-BK4 ⓔ 대조 계정 RID …」)로 남긴다 · 못 고르면 실패(건너뛰기 없음).
          #    근거: docs/검증/erp/20260911_작업리뷰서_백업비번결함_핫픽스.md §9 재확인
          #    ⚠️ 리눅스 한계(조용한 축소 금지): 숨은 콘솔 입력 대기 · System32 경로 · 폴더 권한(C-8)은 이 러너에서 재현되지 않는다.
          #       원인 대조는 Windows 격리 실측이 근거다 — docs/개발/erp/20260911_개발명세서_백업비번결함_핫픽스.md
          GATES="$GATES|BackupCredentialGate"
          # 🔴 20260913작2 MainPcRestartMarkGate — 메인PC 표식 2줄 봉합
          #    (축1 재기동 되올림 차단 · 축2 DB-120 ①단 정리 · 축3 UNIQUE 방어선 + 출하 DDL 본문).
          #    사장님 실측 2026-09-13 "수정안됨. 반려" — 실물에 is_main_pc=1 이 2줄이었다.
          #
          #    🔴 이 잡이 기기 계열을 처음으로 문다 — 근거는 임시 DB 권한 **실측**이다(PM 조건 C-3):
          #      MariaDB 11.4.10 root 로 `SHOW GRANTS` = "GRANT ALL PRIVILEGES ON *.* … WITH GRANT OPTION",
          #      `CREATE DATABASE` exit=0 · `DROP DATABASE` exit=0 (격리 인스턴스 실측).
          #      ⚠️ 이 실측은 **같은 판(MariaDB 11.4 root)에서 잰 것**이고 이 잡의 서비스 컨테이너
          #        안에서 직접 잰 것이 아니다 — 첫 CI 실행이 최종 확인이다(개발명세서 §4 에 명시).
          #
          #    등록 근거는 "초록불이라서" 가 아니라 **무력화 시험**이다 (20260913 Windows 격리 MariaDB 11.4.10 · 포트 33306):
          #      · 봉합 전(원본 코드 + DB-120 파일 없음)        → 12개 중 **11 FAIL**.
          #        G-M1 이 「폐기된 서버줄이 되올려져 표식 2줄」을 **실제로 재현**했다(= 실물 증상 모양).
          #      · 되올림 (A) status='approved' 제거            → **G-M1a** 빨간불
          #      · 되올림 (B) 「회사에 표식 0줄」 제거            → **G-M1b** 빨간불
          #        🔴 G-M1 은 (A)(B) 가 **겹쳐 막는** 모양이라 하나만 지워도 초록이다(실측).
          #           그래서 조건 하나만이 유일한 방어선인 모양을 G-M1a·G-M1b 로 **따로** 뒀다.
          #           — 무력화 시험을 안 돌렸으면 "G-M1 초록"을 보고 조건이 산다고 착각했을 자리다.
          #      · DB-120 ①단(정리) 제거                        → G-M3 · V1 · V2 · V3   (1차 기록 「G-M3 · G-M4」 → (가) 뒤 재실측)
          #      · DB-120 ③단(UNIQUE) 제거                      → G-M5 · G-M3
          #      · 출하 DDL 본문 되돌림(시드만 = DB-89 와 같은 모양) → G-M6
          #      · DB-89 꼬리 UPDATE(부활)를 ①단 **앞**에 넣음   → G-M3 · G-M7(요금 4→5)
          #        (맨 **뒤**에 넣으면 ①단이 먼저 표식을 내려 매칭 0건 = 무영향 — 순서가 판정을 가른다)
          #    대조군 2개는 전 무력화에서 초록 유지 — G-M2(정당한 목적 생존) · G-M7(요금 무이동 4→4).
          #
          #    🔴 (1차 기록) V4 빨간불 — `approved` 표식 0줄 회사에서 ③단 무조건 UNIQUE 가 `Duplicate entry` 로 실패
          #      (MigrationRunner.cs:143-162 실패 시 return = 이후 마이그 전부 중단). 필터로 빼지 않고 결재에 올렸다.
