# 자동업데이트 영구 CD — deploy-update.yml (20260723작1)
# ══════════════════════════════════════════════════════════════════════════
# ⚠️ 이 파일은 `.disabled` 확장자로 비활성 상태다. 아래 착수 게이트 전부 통과 전
#    활성화(파일명에서 .disabled 제거) 절대 금지 — PRD §2, 작4 B-4 정신.
#
#   [G-A] publish-update.sh + sign-manifest.sh 를 NCP /opt/hitpan/installer/updates/ 에
#         동일 디렉토리 상주 배치 (사장님 sudo 1회). publish 가 sign 을 source 하므로 함께.
#         + publish-run.sh(B-4 래퍼)·deploy-web.sh 를 /opt/hitpan/deploy/ 에 상주 배치.
#   [G-B] sudoers 화이트리스트 — publish-run.sh·deploy-web.sh 두 래퍼만 NOPASSWD.
#         ★ publish-update.sh·sign-manifest.sh 는 sudoers 에서 제외(래퍼 경유로만 호출).
#         래퍼가 오버라이드(--webroot/--private/--feed-url/--allow-republish)를 절대 전달 안 함(B-2). (사장님 sudo 1회)
#         ★ 검증팀 M-2 필수(안 하면 B-4 무음 스킵): sudo 는 env_reset 이라 HITPAN_* 를 스트립한다.
#           publish-run.sh 는 명령줄 인라인 할당(sudo HITPAN_...=... /경로/publish-run.sh)으로 받는데,
#           이게 자식에 도달하려면 sudoers 에 `SETENV:` 태그가 있어야 한다. 없으면 HITPAN_GH_* 가 사라져
#           래퍼의 B-4 가 "메타 없음 → 거부"로 fail-closed 된다(무음 통과가 아니라 거부라 안전측이나,
#           정상 게시도 막히므로 SETENV 필수). 단 HITPAN_B4_ALLOW_UNVERIFIED 는 SETENV 목록에서 '제외'해
#           러너가 명령줄로 우회 스위치를 못 켜게 한다. deploy-web.sh 도 RELEASE_VERSION 위해 SETENV 필요.
#   [G-C] publish-update.sh:41 webroot 기본값 → /var/www/updates 정정. ✅ 완료(197c534).
#   [G-D] manifest.json no-cache 헤더 확인 — Cloudflare 엣지 경유. ✅ 이미 no-cache 걸림(소멸).
#   [G-E] environment: production/beta required reviewer(사장님 폰 1탭) + .github/CODEOWNERS.
#   [G-F] (B-4 트랙2) NCP 에 git 미러(/opt/hitpan/repo) + GitHub 토큰(HITPAN_GH_TOKEN) 배치 →
#         래퍼 독립재조회 fail-closed 활성. 미배치 시 HITPAN_B4_ALLOW_UNVERIFIED 없어 게시 거부.
#
#   G-A·B·C 는 사장님 NCP sudo 1회 세션으로 묶는다. 이후 CD 사람 손 0.
# ══════════════════════════════════════════════════════════════════════════
#
# 헌법 정합: #22(개인키 NCP)·#29(인프라 사전승인=게이트)·#34(영구 CD 정식완성도).
#
# 보안 불변식 (PRD §5 — 구현/수정 시 절대 위반 금지):
#   1. 개인키 GHA 반입 0 (서명은 NCP publish-update.sh 안에서만)
#   2. 실행 스크립트(.sh) rsync 0 — 데이터(zip·unsigned manifest)만 /tmp
#   3. sudo 대상 = publish-run.sh 래퍼 1개, 인자 = --zip/--manifest 만 (래퍼가 B-4 재조회 후 publish 호출)
#   4. CI 는 /tmp 스테이징만, update-keys(700 root) 읽기조차 불가
#   5. 서명 규격 3벌 무변경
#   6. 버전 SSOT 단조증가 (다운그레이드 방어가 여기 의존)
#   7. cloudflared·DNS·방화벽·systemctl 미접촉 (CD 런타임)
#   ★ SSH 페이로드 = publish-run.sh 단일 호출. 임의 셸 블록 0 (CTO 권고3)
#   ★ B-4: NCP 가 러너발 commit·run_id·sha 를 GitHub API/git 으로 독립 재조회 후에만 서명(관통결함 급소)

name: Deploy Auto-Update (자동업데이트 영구 CD)

# ── 20260723작2 I-3 (검사2 구멍③): 품질게이트 규율 ──
#   ⚠️ 이 워크플로는 workflow_dispatch 라 임의 커밋/브랜치에서 게시할 수 있다.
#   그런데 build 잡에 test·warnaserror 품질게이트가 없다(자동업데이트 zip 산출만).
#   → dispatch 하기 전, 게시할 그 커밋이 build-and-test.yml 초록(빌드 0/0 + ddl-smoke +
#     migsmoke)을 통과했는지 운영자가 반드시 확인한다(헌법 #19 우회 방지).
#   자동 강제(needs로 build-and-test 승계)는 별건. 지금은 이 규율을 명문화한다.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (3자, 예: 1.2.40). 직전 게시본보다 높아야 함(다운그레이드 게이트). dispatch 전 이 커밋이 build-and-test 초록인지 확인(I-3).'
        required: true
        type: string
      # 🔴 채널 고정 (2026-08-09, 사장님 지시) — 선택지를 없앤다
      #   ■ 무엇을 겪고서
      #     2026-08-09 PM 이 N-10 실측 편의로 Emergency 를 골라 게시했다. Emergency 는 팝업이
      #     없는 채널이라 고객 동의 없이 즉시 적용됐고, **이 시스템의 존재 이유인 팝업 경로를
      #     통째로 건너뛴 배포**가 됐다.
      #   ■ 사장님 지시
      #     "팝업 띄워서 팝업에 Y/N 선택시 업데이트 정상진행 안정적으로 되도록 해놔"
      #     "test1 뿐 아니라 모든 히트판 배포는 이렇게 진행되는걸로 통일해야지"
      #   ■ 왜 default 로는 부족한가
      #     종전에도 default 는 Major 였다. 그런데 **사람이 고를 수 있으면 고른다.** 오늘이 그 증거다.
      #     기본값은 규율이 아니다. 선택지를 없애야 규율이다.
      #   ■ 히트판 업데이트의 정본 흐름 (이것만 있다)
      #     Major 발견 → local_update_status 적재 → ERP 로그인 시 Y/N 팝업
      #       [예]     → 즉시 적용(백업 → 교체 → 재기동 → 검증 → 실패 시 롤백)
      #       [나중에] → 적용 안 함. 다음 로그인에 다시 물어본다
      #   ⚠️ Normal·Emergency 가 정말 필요한 상황이 생기면 **사장님 결재 후 이 파일을 고친다.**
      #     워크플로 입력으로 열어두지 않는다 — 열려 있으면 또 골라 쓴다.
      channel:
        description: '고정: Major(팝업 Y/N). 선택 불가 — 사유는 위 주석. 변경은 사장님 결재 + 코드 수정.'
        required: true
        default: Major
        type: choice
        options: [Major]
      environment:
        description: '배포 대상 피드. production 만 실동작(beta 는 피드 물리생성 별건 전엔 nginx 403).'
        required: true
        default: production
        type: choice
        options: [production, beta]
      # 🔴 스키마 변경 릴리스 표식 (20260811 PI-02 봉합)
      #   ■ 무엇을 겪고서
      #     1.2.63 에 새 테이블(device_register_tokens)을 실었는데 이 값이 늘 false 로 나갔다.
      #     워크플로가 build-manifest.ps1 에 -RequiresMigration 을 **아예 안 넘기고 있었다.**
      #     그 결과 고객 DB 에 테이블이 안 생겨 QR 생성이 500 으로 죽었다(사장님 실측 적발).
      #   ■ 왜 자동 판정이 아니라 사람이 고르나
      #     build-manifest.ps1 §24 에 "requiresMigration 자동 산출은 아직 못박지 않았다
      #     (사장님·CTO 결재 대기)" 라고 남아 있다. 결재 전까지는 게시자가 고른다.
      #   ■ 어떻게 고르나 — 한 문장
      #     이번 릴리스에 `src/HitPan.API/Migrations/SQL/DB-NN_*.sql` 을 **새로 추가했다면 true**.
      #   ■ 잘못 고르면
      #     true 인데 SQL 이 없으면 → 워치독이 무시(무해).
      #     **false 인데 SQL 이 있으면 → 워치독 교차검증 게이트가 업데이트를 강제 중단한다.**
      #     안전측은 true 다.
      requiresMigration:
        description: '이번 릴리스에 새 마이그레이션(Migrations/SQL/DB-NN)이 있으면 true. 애매하면 true(안전측).'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

# ── B-11: 동시 게시 직렬화 (Secret 전환 TOCTOU·mv 경합 차단) ──
#   같은 그룹의 이전 게시를 취소하지 않고(cancel-in-progress:false) 순서대로 흘린다.
#   두 dispatch 가 겹쳐 NCP publish 의 mv·백업이 경합하는 창을 없앤다.
concurrency:
  group: deploy-update
  cancel-in-progress: false

jobs:
  # ── build 잡: 재빌드 방식 (아티팩트 승계 아님) ──
  #   근거 = "게시할 커밋 = 빌드한 커밋" SSOT 불변식. build-manifest.ps1 이 api EXE
  #   FileVersion 을 단방향으로 읽어 manifest 를 만든다. 다른 커밋 아티팩트 승계 = 불변식 파괴.
  #   ⚠️ build-installer.yml 의 EXE 컴파일(ISCC)·Create Release 스텝은 가져오지 말 것(G2 별건).
  build:
    name: Build update package (재빌드 · SSOT)
    runs-on: windows-latest
    # 20260730작3: 기존 zip 만 만들 땐 4분이면 됐으나, 설치 EXE 동반(번들 5종 다운로드 수백MB +
    #   Inno Setup 설치 + ISCC 컴파일)이 붙어 실측 기준 약 11~15분으로 늘어난다. 여유 포함 45분.
    timeout-minutes: 45
    steps:
      # ── 20260723작2 I-2 (검사2 구멍②): beta 실행 차단 가드 (fail-fast) ──
      #   beta 는 §3.3 인자분기가 배선돼 있으나, deploy 잡의 sudoers 화이트리스트는
      #   `--zip`/`--manifest` 2인자만 허용(G-B)이라 beta 의 --webroot/--feed-url 을 못 넘긴다.
      #   또 nginx `/beta/` location 은 현재 403(별건 결재 전 물리 미생성).
      #   → beta 로 dispatch 하면 build 성공 후 deploy 에서 실패하는 혼란 경로가 생긴다.
      #   배선(§3.3)은 미래 위해 보존하되, 실행만 여기서 fail-fast 로 막는다(choice 제거 아님).
      #   beta 실동작은 별건 결재(nginx /beta/ + sudoers beta 라인) 후 이 가드를 해제한다.
      - name: Guard — beta not yet operational (별건 결재 전 차단)
        if: ${{ inputs.environment == 'beta' }}
        run: |
          echo "::error::environment=beta 는 아직 실동작 불가. nginx /beta/ location + sudoers beta 라인 별건 결재 전엔 production 만 게시 가능(PRD §3.3). 배선은 보존됨."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # N-1 fail-closed: version input == 산출 FileVersion == zip/manifest 파일명 3자 정합.
      # 불일치 시 build 진입 즉시 중단 (오타를 게시 전에 세운다).
      - name: Verify version input (fail-closed)
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "::error::version input '$v' 이 3자 SemVer 아님. 게시 전 중단."
            exit 1
          }
          Write-Host "[VersionGate] version=$v"

      - name: Restore
        run: dotnet restore src/HitPan.sln

      # ── publish 3종 — build-installer.yml:76-135 와 동일 구성(자동업데이트 zip 재료만) ──
      #   ⚠️ EXE(ISCC)·번들 다운로드·Create Release 는 자동업데이트와 무관 → 가져오지 않음(G2 별건).
      #   -p:HitPanVersion 단일 주입 = SSOT 정합(W4-0). 빠지면 워치독이 자기를 1.0.0 으로 알고
      #   모든 manifest 를 "새 버전"으로 받아 다운그레이드 방어까지 무력화된다.
      - name: Publish ERP API (single-file)
        shell: pwsh
        run: |
          dotnet publish src/HitPan.API/HitPan.API.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:HitPanVersion=${{ inputs.version }} `
            -o installer/payload/api

      - name: Publish ERP Web (Blazor WASM)
        shell: pwsh
        run: |
          dotnet publish src/HitPan.Web/HitPan.Web.csproj `
            -c Release `
            -p:HitPanVersion=${{ inputs.version }} `
            -o installer/payload/web

      # ★ 7/22 작3 봉합 필수(터널 404 진범): Blazor 정적자산을 api/wwwroot 로 복사해야
      #   API 가 터널(test1.hitpan.kr→5257)에서 Blazor 를 서빙한다. 이게 자동업데이트 zip 에도 실려야 함.
      - name: Copy Blazor static assets into api/wwwroot (tunnel serving)
        shell: pwsh
        run: |
          $src = 'installer/payload/web/wwwroot'
          $dst = 'installer/payload/api/wwwroot'
          if (-not (Test-Path $src)) { throw "web/wwwroot 없음 — Web publish 실패" }
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Copy-Item $src $dst -Recurse -Force
          $n = (Get-ChildItem $dst -Recurse -File).Count
          Write-Host "api/wwwroot 복사 완료: $n files"
          if (-not (Test-Path "$dst/index.html")) { throw "api/wwwroot/index.html 없음 — 복사 실패" }
          if ($n -lt 100) { throw "api/wwwroot 파일 수 비정상($n) — Blazor 산출물 확인" }

      # self-contained(단일파일 아님) — build-manifest.ps1 이 HitPan.Watchdog.dll 의 FileVersion 을
      #   읽어 api 와 갈라짐을 차단하므로 dll 이 산출물에 있어야 한다.
      - name: Publish Watchdog (self-contained)
        shell: pwsh
        run: |
          dotnet publish src/HitPan.Watchdog/HitPan.Watchdog.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:HitPanVersion=${{ inputs.version }} `
            -o installer/payload/watchdog --nologo

      # ── 시크릿 파일 산출물 제거 (첫 실측 P0 봉합 2026-07-28 · 검증팀 SoD 과제2 확장) ──────
      #   dotnet publish 는 리포에 커밋된 환경별 appsettings(appsettings.<환경>.json)를 산출물에
      #   그대로 복사한다. 이게 update zip 에 실리면 NCP "Scan secrets" 게이트가 파일명 규칙
      #   (환경별 설정=위험)으로 배포를 정상 차단한다(첫 실측 1.2.40 실패 진범 = Production·Local 2종).
      #   ★ 게이트는 그대로 유지(느슨하게 안 함). 미래에 진짜 시크릿이 든 환경파일이 섞여도
      #     게이트가 막아야 하므로 "산출물에서 뺀다"로 근본 봉합(헌법 #22 정합, 우회 아님).
      #   ★ 검증팀 SoD CONFIRMED(과제2): strip 3개 하드코딩 < 게이트 regex(모든 환경접미사)라
      #     향후 appsettings.Staging.json 등 추가 시 재발. → 게이트와 동형으로 "환경접미사 전부"
      #     제거하도록 확장(appsettings.<임의영문접미사>.json). 접미사 없는 일반 appsettings.json 은
      #     코드 동봉 정상이라 보존(게이트도 파일명만으론 안 막고 내용 스캔).
      #   ⚠️ 순서 의존: 이 스텝은 반드시 "Copy Blazor static assets" 뒤에 있어야 한다 —
      #     Copy 가 web/wwwroot 를 api/wwwroot 로 통째 복사하므로, 그 복사본까지 여기서 제거해야 한다.
      #     이 스텝을 Copy 앞으로 옮기면 api/wwwroot 복사본이 안 잡혀 게이트가 재차단(첫 실측 재발).
      - name: Strip env-specific appsettings from payload (secret-gate 정합)
        shell: pwsh
        run: |
          # 게이트 regex 와 동형: appsettings.<영문접미사>.json + 백업접미사(.bak/.old/.orig/.save)
          #   접미사 없는 일반 appsettings.json 은 제외(코드 동봉 정상).
          # ── 20260729작3 봉합 (병렬이슈 01 · 사장님 직권 결재) ──────────────────────────
          #   종전 $rx 에 백업접미사 절이 없어 게이트와 비대칭이었다.
          #   appsettings.Production.json.bak → strip 미제거 / 게이트 차단 = 배포 fail.
          #   ★ 게이트를 느슨하게 하지 않고 strip 을 게이트 수준으로 올린다(헌법 #22).
          #   ★ -Filter 도 함께 고친다: 'appsettings.*.json' 은 .bak 을 열거조차 못 해
          #     regex 만 고치면 봉합이 성립하지 않는다(실측 확인). → 'appsettings.*'
          $rx = '^appsettings\.[A-Za-z]+\.json(\.(bak|old|orig|save))?$'
          $removed = 0
          Get-ChildItem -Path installer/payload -Recurse -File -Filter 'appsettings.*' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match $rx } |
            ForEach-Object {
              Write-Host "[strip] 제거: $($_.FullName)"
              Remove-Item $_.FullName -Force
              $removed++
            }
          Write-Host "[strip] 환경별 appsettings $removed 개 제거 완료 (게이트 regex 동형 · 접미사 없는 일반 appsettings.json 보존)"

      # ── 출하본 ApiBaseUrl 중립화 (20260730작8 P0-2 · 사장님 결재) ─────────────────────
      #   ■ 무엇이 문제였나 (실측 확정)
      #     리포 appsettings.json 에 "ApiBaseUrl": "https://api-demo.hitpan.kr" 가 있다.
      #     이건 2026-04-30 `867f636`("demo.hitpan.kr 통신 인프라 완전 봉합") 에서 넣은 값으로,
      #     당시 고객이 demo 한 대뿐이라 **정답이었다**. 그런데 그 값이 출하본에 그대로 남아
      #     고객이 늘어난 지금 **모든 고객사 브라우저가 demo 회사 API 를 호출**한다.
      #       실측(test2, 2026-07-30): api-demo.hitpan.kr/api/auth/login → CORS 차단
      #                              → 화면 "서버에 연결할 수 없습니다" (로그인 불가)
      #     ⇒ 회귀가 아니라 **임시값이 정본으로 굳은 것**이다.
      #
      #   ■ 왜 리포 파일을 고치지 않고 여기서 하나 (급소)
      #     `src/HitPan.Web/wwwroot/appsettings.json` 은 **헌법 #21 변경 금지 파일**이고
      #     pre-commit 훅이 실제로 차단한다(실측). 훅은 WASM 부트 파괴를 막는 방어선이라
      #     --no-verify 로 뚫지 않는다(사장님 지시: *"1회만 이라는 방법은 없어"*).
      #     ⇒ **리포는 무손상. 출하 payload 의 값만 중립화**한다 — 훅·#21 을 지키면서 봉합.
      #     (이 스텝 위 strip 도 같은 정신 — 리포는 두고 산출물만 정정한다.)
      #
      #   ■ 왜 "빈 값"이면 되나
      #     src/HitPan.Web/Program.cs 는 :14 Configuration → :17·:22 환경변수 → :35 폴백 순서다.
      #     :35 = `builder.HostEnvironment.BaseAddress` (= 지금 접속한 자기 도메인).
      #     :34 주석이 오늘을 예언했다 — *"명시값(api-demo 등)이 있으면 위에서 채택되므로"*.
      #     값을 비우면 IsNullOrWhiteSpace 를 타고 :35 가 살아나 **각 고객이 자기 도메인**을 부른다.
      #     같은 출처라 CORS 자체가 없다. 특정 주소가 필요하면 환경변수(:17)로 주입한다.
      #     ⇒ 고객사가 몇이 되든 **같은 사고가 구조적으로 재발 불가**.
      #
      #   ⚠️ 순서 의존: 위 "Copy Blazor static assets"(api/wwwroot 통째 복사) **뒤**여야 한다.
      #     api/wwwroot 복사본까지 함께 정정해야 한다 — 터널이 서빙하는 실체가 그쪽이다.
      #   ⚠️ fail-closed: 대상 파일이 0개면 실패시킨다. 조용히 넘어가면 이 사고가 그대로 재발한다.
      - name: Neutralize ApiBaseUrl in payload (작8 P0-2 · 리포 무손상)
        shell: pwsh
        run: |
          $targets = @(
            'installer/payload/web/wwwroot/appsettings.json',
            'installer/payload/api/wwwroot/appsettings.json'
          )
          # ★ 봉합 20260804 (인코딩) — 종전 구현은 대상 파일을 두 번 망가뜨렸다.
          #   ① `Get-Content $t -Raw` 에 -Encoding 이 없어 **콘솔 코드페이지**로 읽었다.
          #      대상은 한글 주석이 든 UTF-8 이다 → 읽는 순간 깨진다.
          #      실측: '이 값은 반드시' → '??媛믪? 諛섎뱶' (UTF-8 을 CP949 로 읽은 전형적 흔적)
          #   ② `ConvertTo-Json` + `Set-Content -Encoding utf8` 은 비ASCII 를 \uXXXX 로
          #      이스케이프하고 **BOM 을 붙인다** → 원본 서식·주석이 원형을 잃는다.
          #      실측: 954자 주석 → 1119자, '🔴' 소실.
          #   ⇒ installer/HitPan-Universal.iss 의 P0-E 와 **같은 계통**(인코딩 가정 오류)이
          #     CI 에도 있었다. 격리 값 자체는 살아남지만 재발방지 주석이 파괴된다.
          #
          #   ■ 채택: JSON 재직렬화를 하지 않는다. UTF-8 로 읽고, **값만** 정규식 치환하고,
          #     BOM 없는 UTF-8 로 되쓴다(= .iss 봉합과 동일 기법, 실측 검증됨).
          #     (?<!\w) 로 _comment_ApiBaseUrl · BackofficeApiBaseUrl 오매칭을 차단한다.
          $enc = New-Object System.Text.UTF8Encoding($false)
          $re  = '(?<!\w)("ApiBaseUrl"\s*:\s*")[^"]*(")'
          $done = 0
          foreach ($t in $targets) {
            if (-not (Test-Path $t)) { Write-Host "[apibase] 건너뜀(없음): $t"; continue }
            $full   = (Resolve-Path $t).Path
            $raw    = [System.IO.File]::ReadAllText($full, $enc)
            # 삼항연산자(PS7+)를 쓰지 않는다 — P0 경로에 셸 버전 의존을 만들지 않기 위해서다.
            if (([regex]::Match($raw, $re)).Success) { $before = ($raw | ConvertFrom-Json).ApiBaseUrl }
            else { $before = '(키없음)' }
            $new    = [regex]::Replace($raw, $re, '${1}${2}')
            if ($new -ne $raw) { [System.IO.File]::WriteAllText($full, $new, $enc) }
            Write-Host "[apibase] 중립화: $t  ('$before' -> '')"
            $done++
          }
          if ($done -eq 0) {
            Write-Error "::error::ApiBaseUrl 중립화 대상이 0개 — Web publish 경로 확인. 이대로 게시하면 전 고객 로그인 불가(작8 P0-2 재발)."
            exit 1
          }
          # 검증: 중립화가 실제로 먹었는지 확인한다.
          #
          # ★ 봉합 20260804 (1.2.52 게시 실패 실측):
          #   종전 이 검증은 `$raw -match 'api-demo'` — **파일 원문 문자열 검색**이었다.
          #   그래서 20260803 격리 P0 봉합이 심은 **재발방지 주석**(그 사고를 설명하려면
          #   'api-demo' 라는 단어를 쓸 수밖에 없다)에 걸려 FAIL 했다.
          #   실측 로그: ApiBaseUrl 은 '' -> '' 로 이미 정답인데도 배포가 중단됐다.
          #
          #   ⇒ 이 게이트는 "값이 안전한가"를 물어야 하는데 "글자가 없는가"를 물었다.
          #     같은 계통의 결함이 smoke-test.ps1 에도 있었다(거기선 반대로 api-demo 가
          #     **있어야** PASS 였다). 문자열 검사는 봉합을 설명하는 문서를 적으로 만든다.
          #
          #   ■ 채택: 파싱한 **값**만 본다(화이트리스트).
          #     ApiBaseUrl 은 반드시 빈 값이어야 한다 — 고객 PC 에서 Program.cs 의
          #     HostEnvironment.BaseAddress 폴백이 발동해 '자기 회사 API' 로 가야 하기 때문.
          #     값이 비어있지 않으면 그게 무슨 주소든(api-demo 든 남의 고객사든) 격리 붕괴다.
          #     ⇒ 'api-demo 인가'가 아니라 '비어있는가'가 올바른 질문이다.
          #   ■ 주석·다른 키는 검사 대상이 아니다. 주석은 다음 사고 조사자에게 남기는 자산이다.
          foreach ($t in $targets) {
            if (Test-Path $t) {
              # -Encoding 없는 Get-Content 는 콘솔 코드페이지로 읽어 한글을 깨뜨린다(위 ① 참조).
              #   여기서 보는 값은 ASCII URL 이라 실피해는 없지만, 같은 파일 안에 틀린 관용구를
              #   남기지 않는다 — 다음 사람이 이 줄을 복사한다.
              $v = ([System.IO.File]::ReadAllText((Resolve-Path $t).Path, $enc) | ConvertFrom-Json).ApiBaseUrl
              if (-not [string]::IsNullOrWhiteSpace($v)) {
                Write-Error "::error::$t 의 ApiBaseUrl 이 비어있지 않다('$v') — 중립화 실패. 이대로 게시하면 전 고객이 이 주소 한 곳을 본다(테넌트 격리 붕괴). 배포 중단."
                exit 1
              }
            }
          }
          Write-Host "[apibase] 확인: 출하본 $done 개 중립화 완료 · ApiBaseUrl 전부 빈 값(자기 출처 폴백)"

      # ── environment 분기(보강3/G7): download-url-base 를 production/beta 로 가른다. PRD §3.3 인자표 ──
      #   production = updates.hitpan.kr/packages / beta = updates.hitpan.kr/beta/packages
      #   ⚠️ beta 는 배선만 — nginx /beta/ location 물리생성 별건 전엔 실동작 불가(403).
      - name: Resolve download-url-base by environment
        id: urlbase
        shell: pwsh
        run: |
          $envName = '${{ inputs.environment }}'
          if ($envName -eq 'beta') {
            $base = 'https://updates.hitpan.kr/beta/packages'
          } else {
            $base = 'https://updates.hitpan.kr/packages'
          }
          "base=$base" >> $env:GITHUB_OUTPUT
          Write-Host "[urlbase] environment=$envName -> $base"

      # ── build-manifest.ps1 → hitpan-<ver>.zip + manifest(unsigned) — build-installer.yml:207-236 ──
      #   -Channel = channel input(게시함정3-③ 상류 주입) / -DownloadUrlBase = environment 분기.
      #   ★ 서명은 여기서 안 함 — 개인키 NCP 전용(C-1). CI 는 unsigned 까지만.
      #   ★ HITPAN_RELEASED_AT 주입 필수(재현가능빌드, build-manifest.ps1:231 없으면 실패).
      - name: Build update package (zip + unsigned manifest)
        shell: pwsh
        run: |
          $payload = (Resolve-Path installer/payload).Path
          $outDir  = Join-Path (Get-Location).Path 'dist/updates'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $env:HITPAN_RELEASED_AT = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          Write-Host "[update] releasedAt = $env:HITPAN_RELEASED_AT"
          $ver = '${{ inputs.version }}'
          # 🔴 PI-02 봉합 (2026-08-11): 종전에는 이 스위치를 안 넘겨 항상 false 로 나갔다.
          #   그래서 1.2.63 이 새 테이블을 싣고도 고객 DB 에 반영이 안 됐다(QR 500).
          $mig = '${{ inputs.requiresMigration }}' -eq 'true'
          Write-Host "[update] requiresMigration = $mig"
          & pwsh -File installer/updates/build-manifest.ps1 `
            -PayloadDir $payload `
            -OutDir $outDir `
            -Channel '${{ inputs.channel }}' `
            -RequiresMigration:$mig `
            -DownloadUrlBase '${{ steps.urlbase.outputs.base }}' `
            -ReleaseNotes "히트판 ERP $ver 업데이트" `
            -ConsentMessage "새 버전($ver)이 준비되었습니다. [예] 를 누르면 자료를 자동으로 백업한 뒤 업데이트가 진행되며, 그 사이 히트판이 잠시 꺼졌다가 다시 켜집니다. 저장하지 않은 입력이 있으면 [나중에] 를 눌러 저장을 마친 뒤 다시 진행해 주세요."
          if ($LASTEXITCODE -ne 0) { throw "build-manifest 실패 (exit $LASTEXITCODE)" }
          Get-ChildItem $outDir | ForEach-Object { Write-Host "[update] 산출: $($_.Name)" }

      # ── 설치 EXE 빌드 (20260730작3 ①안 — 랜딩 다운로드 404 봉합) ─────────────────
      #   ■ 왜 여기서 같이 만드나 (급소)
      #     랜딩 DownloadPage 는 manifest 버전으로 {packages}/HitPan-ERP-Setup-{V}.exe 를 만든다.
      #     그런데 EXE 를 그 경로에 올리는 워크플로가 없어 1.2.29~1.2.41 전부 404 였다
      #     — 랜딩 다운로드가 한 번도 작동한 적이 없다(2026-07-30 실측).
      #     zip 만 게시하면 "자동업데이트는 되는데 신규 고객은 설치조차 못 하는" 상태가 유지된다.
      #     ⇒ 같은 잡에서 같은 버전으로 만들어 한 단위로 게시한다(사장님 ①안 결재).
      #   ■ payload 재사용: 위 publish 3종 + strip 이 이미 끝난 installer/payload 를 그대로 쓴다.
      #     번들 5종(dotnet-hosting·mariadb.msi·vc_redist·cloudflared·hitpan_db.sql)만 추가로 받는다.
      #   ⚠️ 코드 서명(Authenticode)은 여기서 안 한다 — build-installer.yml 과 동일하게 별건(결재 2).
      - name: Download dependency bundle (for installer EXE)
        shell: pwsh
        run: |
          & pwsh -File installer/download-bundle.ps1 -BundleDir installer/payload
          if ($LASTEXITCODE -ne 0) { throw "번들 다운로드 실패 (exit $LASTEXITCODE)" }
          Copy-Item installer/hitpan_db_clean.sql installer/payload/hitpan_db.sql -Force
          # .iss 가 요구하는 8개 사전 확인 — 없으면 ISCC 가 모호한 오류를 내므로 여기서 명확히 세운다.
          $required = @('dotnet-hosting.exe','mariadb.msi','vc_redist.x64.exe','cloudflared.exe','hitpan_db.sql','api','web','watchdog')
          $missing = $required | Where-Object { -not (Test-Path "installer/payload/$_") }
          if ($missing) { throw "payload 누락: $($missing -join ', ')" }

      # ── EXE 전용 동봉물 시크릿 게이트 (검증팀 [3-V] D3 봉합 2026-07-30) ──────────────
      #   ■ 왜 필요한가 (급소)
      #     아래 "Scan update package for leaked secrets"(deploy 잡)는 **update zip 만** 스캔한다.
      #     그런데 설치 EXE 는 zip 과 같은 payload 에 더해 hitpan_db.sql(DDL)·헬퍼 스크립트 4종
      #     (AntivirusExceptions/FirewallRules/InstallWatchdog/web-server)을 **추가로** 담는다(.iss [Files]).
      #     즉 EXE 전용 동봉물은 어떤 게이트도 안 거치고 고객 PC 로 간다 — 헌법 #22 방어선의 구멍.
      #   ■ EXE 는 LZMA 압축이라 산출물을 열어볼 수 없다 → **컴파일 전에 소스 쪽을 스캔**한다.
      - name: Scan installer-only payload for secrets (EXE 전용 동봉물)
        shell: pwsh
        run: |
          $targets = @(
            'installer/payload/hitpan_db.sql',
            'installer/hitpan-start.bat',
            'installer/web-server.ps1',
            'installer/scripts/AntivirusExceptions.ps1',
            'installer/scripts/FirewallRules.ps1',
            'installer/scripts/InstallWatchdog.ps1'
          )
          # ■ 패턴 (검증팀 N2 봉합): 최초 4종은 DB/PEM 계열에 편중돼 API키·토큰을 0건 적발했다.
          #   헬퍼 .ps1 은 성격상 토큰·webhook 이 들어갈 자리라 그쪽이 비어 있었다. 계열별로 확장한다.
          $patterns = @(
            # DB·커넥션 계열
            'Password\s*=\s*["'']?[A-Za-z0-9!@#$%^&*]{6,}',
            'Server=.*;.*(Pwd|Password)=',
            'IDENTIFIED BY\s+["''][A-Za-z0-9!@#$%^&*]{6,}["'']',
            '(?i)\b(DBPASS|DB_PASSWORD|MYSQL_PWD|ROOT_PASSWORD)\s*=\s*\S{6,}',
            # 키·인증서 계열
            'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY',
            # API 키·토큰 계열 (N2 — 최초 게이트가 통째로 놓쳤다)
            'sk-ant-[A-Za-z0-9_\-]{20,}',
            'gh[pousr]_[A-Za-z0-9]{30,}',
            'AKIA[0-9A-Z]{16}',
            'eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.',
            '(?i)\b(api[_\-]?key|access[_\-]?token|secret[_\-]?key|bearer)\s*[:=]\s*["'']?[A-Za-z0-9_\-]{20,}',
            'https://hooks\.slack\.com/\S+',
            '(?i)xox[baprs]-[A-Za-z0-9\-]{10,}'
          )
          # ■ 제외 규칙 (검증팀 B3 봉합): 최초 구현은 '줄 단위' 제외라
          #   `IDENTIFIED BY 'Hitpan2025!'; -- MariaRootPw` 처럼 같은 줄에 안전 토큰이 하나만 있어도
          #   진짜 시크릿이 통째로 억제됐다. → **매치된 문자열 자체**가 플레이스홀더일 때만 제외한다.
          $bad = @()
          foreach ($t in $targets) {
            if (-not (Test-Path $t)) { throw "EXE 동봉 대상 누락: $t — .iss 가 요구하는 파일이다." }
            foreach ($p in $patterns) {
              $hits = Select-String -Path $t -Pattern $p -AllMatches -ErrorAction SilentlyContinue
              foreach ($h in $hits) {
                foreach ($m in $h.Matches) {
                  $v = $m.Value
                  # 매치 안에 치환 자리표가 있으면 실값이 아니다(런타임 생성).
                  if ($v -match '%[A-Za-z_]+%|\{#|\$env:|\$\(|ExpandConstant|GenerateAlphanumericKey|\{\d+\}|<[A-Za-z_]+>|CHANGEME|xxxx|\*\*\*') { continue }
                  $bad += "$($h.Path):$($h.LineNumber): $($v.Trim())"
                }
              }
            }
          }
          if ($bad.Count -gt 0) {
            Write-Host "::error::설치 EXE 동봉물에 시크릿 의심 — 배포 중단:"
            $bad | ForEach-Object { Write-Host "  $_" }
            throw "EXE 동봉물 시크릿 게이트 실패"
          }
          Write-Host "[SecretGate/EXE] 동봉물 $($targets.Count)종 시크릿 미포함 확인"

      # ⚠️ ISCC 는 러너에 기본 설치돼 있지 않다. 이 스텝이 없으면 아래 ISCC 호출이
      #    "명령을 찾을 수 없음"으로 실패한다(build-installer.yml:156 과 동일 구성).
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            throw "Inno Setup 설치 후에도 ISCC.exe 를 찾을 수 없습니다."
          }
          Write-Host "Inno Setup installed"

      - name: Build installer EXE (ISCC)
        shell: pwsh
        run: |
          $ver = '${{ inputs.version }}'
          # DB 비번(/DHitPanDbPassword)은 주입하지 않는다 — .iss 의 #define 이 단일 출처다.
          #   전 고객사 통일값이고 제품 설정값 성격이라 Secret 이 아니다
          #   (docs/CS/20260731_DB비밀번호_CS안내기준.md §4-1, 사장님 결재).
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DAppVersion=$ver" `
            "/DBundleDir=payload" `
            "/DOutputDir=output" `
            installer/HitPan-Universal.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed (exit $LASTEXITCODE)" }

      # 파일명 3자 정합 — 랜딩이 만드는 이름과 정확히 같아야 404 가 안 난다(N-1 정신).
      #   ISCC 산출명이 규칙과 다르면 여기서 세운다. 게시 후에 발견하면 이미 고객이 404 를 본다.
      - name: Verify installer EXE name + compute sha (fail-closed)
        shell: pwsh
        run: |
          $ver = '${{ inputs.version }}'
          $expect = "HitPan-ERP-Setup-$ver.exe"
          $path = "installer/output/$expect"
          if (-not (Test-Path $path)) {
            Write-Host "[installer] output 내용:"
            Get-ChildItem installer/output | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "설치 EXE 파일명이 기대와 다릅니다. 기대=$expect — 랜딩이 이 이름으로 링크를 만든다."
          }
          $size = (Get-Item $path).Length
          if ($size -lt 50MB) { throw "설치 EXE 크기 비정상($size bytes) — 빌드 산출물 확인." }
          $sha = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          New-Item -ItemType Directory -Path dist/installer -Force | Out-Null
          Copy-Item $path "dist/installer/$expect" -Force
          # 래퍼가 NCP 에서 대조할 sha 동반 파일(전송 손상 검출).
          [IO.File]::WriteAllText("dist/installer/$expect.sha256", $sha)
          Write-Host "[installer] $expect ($size bytes) sha256=$sha"

      - name: Upload update artifact
        uses: actions/upload-artifact@v5
        with:
          name: update-pkg-${{ inputs.version }}
          path: dist/updates/
          retention-days: 7

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: installer-exe-${{ inputs.version }}
          path: dist/installer/
          retention-days: 7

  # ── deploy 잡: 데이터만 /tmp → NCP 상주본 sudo 2인자 호출 ──
  #   ★ 웹 CD(deploy-ncp.yml)에서 복붙 금지 3구간:
  #     - rsync 위치이동(→/opt)  : 여기선 데이터만 /tmp (B-1)
  #     - 광역 sudo(임의 셸)     : 여기선 publish-update.sh 단일 호출만
  #     - GHA 롤백 스텝          : 롤백 주체는 publish-update.sh 자기검증. 이중경합 금지.
  deploy:
    name: Sign & publish on NCP (상주본 호출)
    needs: build
    runs-on: ubuntu-latest
    # G-E: required reviewer 등록 대상(사장님). 방아쇠 1회만 사람.
    #   inputs.environment(production/beta) 를 GitHub environment 에 그대로 매핑 → PRD §3.3.
    #   두 environment 모두 required reviewer 를 걸어야 전 고객 코드교체 방아쇠에 승인 게이트가 선다.
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - name: Download update artifact
        uses: actions/download-artifact@v5
        with:
          name: update-pkg-${{ inputs.version }}
          path: dist/updates/

      # 설치 EXE 동반 (20260730작3 ①안) — zip 과 한 단위로 게시하기 위해 여기서도 받는다.
      - name: Download installer artifact
        uses: actions/download-artifact@v5
        with:
          name: installer-exe-${{ inputs.version }}
          path: dist/installer/

      # ── B-8: deploy 잡 진입 시 version 재검증 (fail-closed) ──
      #   build 잡에서 검증했더라도 deploy 잡은 별도 실행 컨텍스트다. 여기서 다시 못박아
      #   아래 모든 스텝이 신뢰하는 $VER 이 3자 SemVer 임을 보장한다(오염된 input 차단).
      - name: Re-verify version (fail-closed)
        env:
          VER: ${{ inputs.version }}
        run: |
          case "$VER" in
            *[!0-9.]*) echo "::error::version '$VER' 에 허용 안 된 문자 — 3자 SemVer 만."; exit 1 ;;
          esac
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version '$VER' 3자 SemVer 아님."; exit 1; }
          echo "[VersionGate/deploy] $VER"

      # ── B-12: 운영 시크릿이 update zip 에 섞였는지 게이트 (다운로드 후, 전송 전) ──
      #   update zip 에 appsettings.Production/Development·.pem·.pfx·db.conf·keys.conf 가 실리면
      #   전 고객 PC 로 시크릿이 퍼진다. 발견 시 전송 전에 배포를 세운다.
      - name: Scan update package for leaked secrets
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # F-2(검증팀): unzip 존재 강제 — 없으면 게이트가 조용히 통과(거짓봉합). 헌법 #15.
          command -v unzip >/dev/null 2>&1 || { echo "::error::unzip 미설치 — 시크릿 게이트 실행 불가. 배포 중단."; exit 1; }
          ZIP="dist/updates/hitpan-$VER.zip"
          [ -f "$ZIP" ] || { echo "::error::update zip 없음: $ZIP"; exit 1; }
          LIST="$(unzip -Z1 "$ZIP")"
          # F-3(검증팀): 패턴 확장 — .key/.p12/.crt/.env, Staging 등 환경접미사, .bak/.old 백업접미사까지.
          #   $ 앵커 대신 백업접미사 허용(\.(bak|old|orig|save))? 로 db.conf.bak 등도 잡는다.
          BAD="$(printf '%s\n' "$LIST" | grep -iE 'appsettings\.[A-Za-z]+\.json(\.(bak|old|orig|save))?$|\.(pem|pfx|p12|key|crt)$|(^|/)db\.conf(\.(bak|old|orig|save))?$|hitpan-keys\.conf(\.(bak|old|orig|save))?$|(^|/)\.env$|(^|/)secrets\.json$' || true)"
          # appsettings.json(환경접미사 없는 일반)은 코드 동봉이 정상이라 위 패턴서 제외했고, 아래서 내용 스캔.
          if [ -n "$BAD" ]; then
            echo "::error::update zip 에 운영 시크릿으로 의심되는 파일 포함 — 배포 중단:"
            printf '%s\n' "$BAD"
            exit 1
          fi
          # appsettings.json(일반) 안에 실 커넥션스트링/비번이 박혔는지 얕은 스캔
          if printf '%s\n' "$LIST" | grep -qi 'appsettings\.json$'; then
            TMPD="$(mktemp -d)"
            unzip -qq "$ZIP" '*appsettings.json' -d "$TMPD" || { echo "::error::appsettings.json 추출 실패 — 스캔 불가로 배포 중단."; rm -rf "$TMPD"; exit 1; }
            if grep -rqiE '"(Password|Pwd)"[[:space:]]*[:=]|Server=.*;.*Password=' "$TMPD"; then
              echo "::error::appsettings.json 에 실 비밀번호/커넥션스트링 흔적 — 배포 중단."; rm -rf "$TMPD"; exit 1
            fi
            rm -rf "$TMPD"
          fi
          echo "[SecretGate] update zip 시크릿 미포함 확인"

      # ── 러너 실측 sha 계산 (B-4 대조용 — NCP 가 독립 재검증할 기준값) ──
      - name: Compute package sha (for NCP independent recheck)
        id: pkgsha
        env:
          VER: ${{ inputs.version }}
        run: |
          SHA="$(sha256sum dist/updates/hitpan-$VER.zip | awk '{print $1}')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "[pkgsha] $SHA"

      # SSH 키 셋업 — deploy-ncp.yml:85-92 복붙 (동일 Secrets 3종, 재사용 OK)
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.NCP_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ncp_key
          chmod 600 ~/.ssh/ncp_key
          ssh-keyscan -H ${{ secrets.NCP_HOST }} >> ~/.ssh/known_hosts

      # 【데이터만 전송】 zip·unsigned manifest → NCP /tmp. 실행 스크립트(.sh) 절대 금지(B-1).
      #   게시함정3-①: manifest 목적지 파일명을 publish 가 받는 이름으로 rename.
      #   B-8: $VER 은 위에서 3자 SemVer 로 재검증됐으므로 파일명 보간이 안전하다.
      - name: Rsync data only (zip + unsigned manifest + installer EXE)
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          rsync -avz -e "ssh -i ~/.ssh/ncp_key" \
            "dist/updates/hitpan-$VER.zip" \
            "$NCP_USER@$NCP_HOST:/tmp/hitpan-$VER.zip"
          rsync -avz -e "ssh -i ~/.ssh/ncp_key" \
            dist/updates/manifest.json \
            "$NCP_USER@$NCP_HOST:/tmp/manifest-$VER-unsigned.json"

          # ── 설치 EXE + sha 동반 전송 (20260730작3 ①안) ─────────────────────────
          #   래퍼는 --zip/--manifest 2인자만 받는다(B-2 오버라이드 차단 유지). EXE 는 인자로 안 넘기고
          #   래퍼가 zip 파일명의 버전에서 /tmp/HitPan-ERP-Setup-<VER>.exe 를 '유도'해 찾는다.
          #   ⇒ 여기 파일명이 그 규칙과 다르면 래퍼가 fail-closed 로 게시를 세운다.
          #   -z(압축) 제거: EXE 는 이미 압축된 260MB 라 재압축이 CPU 만 먹고 이득이 없다.
          EXE="HitPan-ERP-Setup-$VER.exe"
          [ -f "dist/installer/$EXE" ] || { echo "::error::설치 EXE 없음: dist/installer/$EXE"; exit 1; }
          [ -f "dist/installer/$EXE.sha256" ] || { echo "::error::EXE sha 파일 없음"; exit 1; }
          rsync -av --progress -e "ssh -i ~/.ssh/ncp_key" \
            "dist/installer/$EXE" \
            "$NCP_USER@$NCP_HOST:/tmp/$EXE"
          rsync -av -e "ssh -i ~/.ssh/ncp_key" \
            "dist/installer/$EXE.sha256" \
            "$NCP_USER@$NCP_HOST:/tmp/$EXE.sha256"
          echo "[rsync] 설치 EXE 전송 완료: /tmp/$EXE ($(stat -c%s "dist/installer/$EXE") bytes)"

      # 【래퍼 호출 — B-1·B-2·B-4】 SSH 페이로드 = publish-run.sh 단일 호출, 2인자만.
      #   ★ 기존: publish-update.sh 직접 호출 → NCP 가 러너발 값 그대로 신뢰(B-4 관통결함).
      #   ★ 변경: publish-run.sh(래퍼)가 서명 전 NCP 안에서 commit·run_id·sha 를 독립 재조회 후 통과 시에만 publish.
      #   B-4 대조용 메타를 env 로 넘긴다(러너 '주장'일 뿐 — NCP 가 GitHub API/git 으로 직접 재확인).
      #   HITPAN_B4_ALLOW_UNVERIFIED 는 넘기지 않는다(git 미러·GitHub 토큰 트랙2 배치 후 fail-closed 로 동작).
      #   production 은 오버라이드 인자 0 = sudoers 2인자 화이트리스트 정합(G-B).
      - name: Invoke resident publish-run.sh wrapper (B-4 independent recheck)
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
          VER: ${{ inputs.version }}
          PKG_SHA: ${{ steps.pkgsha.outputs.sha }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          # ★ 검증팀 2차 BLOCKER: `sudo ... bash <스크립트>` 는 sudo 대상이 /usr/bin/bash 라
          #   sudoers(NOPASSWD: /opt/hitpan/deploy/publish-run.sh) 정확매칭 실패 → 게시 100% 실패.
          #   → bash 제거, 직접 실행(shebang·+x). deploy-ncp.yml 봉합과 대칭.
          #   HITPAN_* 는 sudo 명령줄 인라인 할당(sudoers SETENV 필수, G-B). ALLOW_UNVERIFIED 는 안 넘김.
          ssh -i ~/.ssh/ncp_key "$NCP_USER@$NCP_HOST" \
            "sudo HITPAN_EXPECT_SHA=$PKG_SHA HITPAN_GH_SHA=$GH_SHA HITPAN_GH_RUN_ID=$GH_RUN_ID HITPAN_GH_REPO=$GH_REPO \
             /opt/hitpan/deploy/publish-run.sh --zip /tmp/hitpan-$VER.zip --manifest /tmp/manifest-$VER-unsigned.json"

      # 【이중 확인】 서빙본 최신 확인 (N-3 이중 안전망일 뿐).
      #   실패해도 publish-update.sh 자기검증이 이미 롤백함 — GHA 롤백 스텝 신설 금지(§4).
      #   ★ jq 로 파싱(ubuntu-latest 기본 제공). python3 인라인은 실패를 삼켜 오탐 위험(검증팀장 권고).
      #   ★ Cloudflare 엣지 캐시 우회: 캐시버스터 쿼리 + no-cache 헤더로 옛 manifest 오판 방지.
      - name: Verify served manifest (double-check, no rollback here)
        env:
          VER: ${{ inputs.version }}
          FEED_ENV: ${{ inputs.environment }}
        run: |
          if [ "$FEED_ENV" = "beta" ]; then
            FEED="https://updates.hitpan.kr/beta/manifest.json"
          else
            FEED="https://updates.hitpan.kr/manifest.json"
          fi
          SERVED=$(curl -fsS -H "Cache-Control: no-cache" -H "Pragma: no-cache" "$FEED?_=$RANDOM$$" | jq -r '.version // ""')
          echo "feed: $FEED / served version: '$SERVED' / expected: '$VER'"
          if [ "$SERVED" != "$VER" ]; then
            echo "::error::서빙 버전 불일치. publish-update.sh 자기검증이 이미 롤백했을 수 있음(정상 안전망 동작). NCP 로그 확인. GHA 에서 롤백하지 않음(이중경합 금지)."
            exit 1
          fi
          echo "[VerifyGate] $FEED_ENV 피드 최신화 확인 — $VER"

      # ── /tmp 스테이징 정리 (20260730작9 P0-B · 사장님 지시 "후속조치 즉시해") ──────
      #   ■ 왜 필요한가 — 이 스텝이 없어서 2026-07-30 NCP 가 사망했다
      #     위 rsync 는 zip·EXE·manifest 를 /tmp 에 올린다. publish-run.sh 가 그것을
      #     packages/ 로 배치한 뒤에도 **/tmp 사본이 그대로 남았다.**
      #     실측 채증(2026-07-30 18:30):
      #       /tmp 1.6G = EXE 4개(1.2.42~45) + ZIP 4개  ← 전부 packages/ 와 중복인 순수 잔재
      #       → 디스크 9.8G 가 100% (여유 0) → MySQL 기동 불가(mysql.service failed)
      #       → 랜딩 가입이 500 (LandingSignupController.Signup:69 · DB 연결 실패)
      #     즉 **게시 파이프라인이 자기 DB 를 죽였다.** 게시 1회당 /tmp 에만 357MB 누적.
      #   ■ 왜 여기인가
      #     서빙 검증(위 스텝) 통과 후. 검증 전에 지우면 실패 시 원인 분석 자료가 사라진다.
      #   ■ 왜 와일드카드를 쓰지 않나
      #     `rm -f /tmp/hitpan-*.zip` 은 동시 실행 중인 다른 게시의 중간산물을 지울 수 있다.
      #     **이번 런의 버전만 명시 삭제**한다(멱등 · 남의 파일 무해).
      #   ■ 보안 불변식 정합 (PRD §5)
      #     #2 실행 스크립트 rsync 0 → 인라인 rm 뿐, 스크립트 전송 0
      #     #3 sudo = 래퍼 1개      → **sudo 미사용**. hitpan-deployer 자기 소유 파일만 지운다
      #                              (신규 sudoers 항목 불필요 = 사장님 sudo 세션 불필요)
      #     #4 CI 는 /tmp 스테이징만 → /tmp 만 만진다. packages/ 는 건드리지 않는다
      #                              (packages/ 는 www-data 소유라 애초에 권한도 없다)
      #     #7 인프라 미접촉        → 파일 삭제뿐. 서비스·DNS·방화벽 0
      #   ■ always() 인 이유
      #     검증 실패로 롤백된 경우에도 /tmp 사본은 롤백에 쓰이지 않으므로 지운다.
      #     packages/ 롤백은 publish-update.sh 가 이미 수행했다.
      #     ⚠️ 게시 실패 원인을 /tmp 파일로 파헤쳐야 할 때는 이 스텝을 일시 비활성화할 것.
      #   ■ 남은 구멍 (정직하게 — 이 스텝만으로 재발이 막히지 않는다)
      #     packages/ 누적(게시 1회당 372MB)은 여기서 못 막는다. www-data 소유 + sudo 화이트리스트
      #     밖이라 CI 권한으로는 삭제 불가다. 그건 작9 P0-A(publish-update.sh 패키지 회전 —
      #     NCP 상주본 수정이라 헌법 #29 로 사장님 결재)에서 봉합한다.
      #     ⇒ 이 스텝은 누적의 **약 절반(357/729MB)** 을 막는다. 나머지 절반은 P0-A 가 막는다.
      - name: Clean /tmp staging artifacts (작9 P0-B)
        if: always()
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
          VER: ${{ inputs.version }}
        run: |
          ssh -i ~/.ssh/ncp_key "$NCP_USER@$NCP_HOST" \
            "rm -f /tmp/hitpan-$VER.zip \
                   /tmp/manifest-$VER-unsigned.json \
                   /tmp/HitPan-ERP-Setup-$VER.exe \
                   /tmp/HitPan-ERP-Setup-$VER.exe.sha256 || true; \
             echo \"[cleanup] /tmp 스테이징 삭제 완료(버전 $VER)\"; \
             echo '[cleanup] 디스크 현황:'; df -h / | tail -1; \
             echo '[cleanup] /tmp 잔여 게시물:'; \
             ls -la /tmp/hitpan-*.zip /tmp/HitPan-ERP-Setup-*.exe 2>/dev/null || echo '  (없음 — 정상)'"

      # ── 디스크 여유 경보 (20260730작9 P1-C 러너측 · 사장님 보고용) ─────────────────
      #   P1-C 의 정식 게이트는 publish-update.sh 시작부(게시 전 차단)에 들어간다 —
      #   그건 NCP 상주본이라 사장님 결재 대상이다(작9 §4-3).
      #   여기서는 **게시 후 현황을 로그로 남겨** 사장님이 다음 게시 전에 판단할 수 있게 한다.
      #   게시 1회 소요 ≈ 730MB(ZIP 102 + EXE 270 + /tmp 사본 357) 기준으로 남은 횟수를 계산한다.
      - name: Report disk headroom (작9 P1-C 경보)
        if: always()
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
        run: |
          AVAIL_MB=$(ssh -i ~/.ssh/ncp_key "$NCP_USER@$NCP_HOST" "df -Pm / | awk 'NR==2{print \$4}'")
          echo "NCP 루트 여유: ${AVAIL_MB}MB"
          # 730MB/회 기준 잔여 게시 횟수(정수 나눗셈)
          LEFT=$(( AVAIL_MB / 730 ))
          echo "게시 1회 ≈ 730MB → 남은 게시 여유: 약 ${LEFT}회"
          if [ "$AVAIL_MB" -lt 1200 ]; then
            echo "::error::디스크 여유 ${AVAIL_MB}MB — 다음 게시가 실패하거나 DB 를 죽일 수 있다(2026-07-30 실측 사고). packages/ 구버전 회수 필요(작9 P0-A)."
          elif [ "$AVAIL_MB" -lt 2500 ]; then
            echo "::warning::디스크 여유 ${AVAIL_MB}MB — 게시 2~3회분뿐. 작9 P0-A(패키지 회전) 적용을 권고한다."
          else
            echo "[DiskGate] 여유 충분 — ${AVAIL_MB}MB"
          fi
