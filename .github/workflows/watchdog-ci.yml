name: Watchdog CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'src/HitPan.Watchdog/**'
      - 'src/HitPan.Watchdog.Tests/**'
      - 'installer/**'
      - 'tests/scenarios/**'
      - '.github/workflows/watchdog-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'src/HitPan.Watchdog/**'
      - 'src/HitPan.Watchdog.Tests/**'
      - 'installer/**'
      - 'tests/scenarios/**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Watchdog Build + xUnit (errors 0 warnings 0)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # 검증용 명시 버전 (2026-07-16, 작1 W4-0). Directory.Build.props 폴백과 반드시 다른 값을 쓴다 —
      # 같으면 "주입이 먹혔는지"를 구분할 수 없어 스탬핑이 깨져도 CI 가 초록이 된다.
      # 릴리스 버전이 아니다(릴리스는 build-installer-universal.ps1 -Version).
      CI_TEST_VERSION: '9.9.9'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # 봉합 (2026-07-16, 작1 W4-0 — 검증팀 재검증 Q3 적발): 종전엔 -p:HitPanVersion 주입이 없어
      #   이 CI 가 Directory.Build.props 폴백 버전으로 워치독을 굽고 --health 스모크를 "정상"이라 보고했다.
      #   즉 버전 스탬핑 회귀를 잡으라고 만든 보호막이 정작 CI 에서는 폴백값을 검증하고 있었다.
      #   여기는 릴리스가 아니라 PR 스모크이므로, 실제 배포 버전이 아닌 '검증용 명시 버전'을 주입한다.
      #   폴백과 다른 값을 써야 "주입이 실제로 먹히는지"까지 함께 검증된다.
      - name: Build Watchdog (TreatWarningsAsErrors)
        run: dotnet build src/HitPan.Watchdog/HitPan.Watchdog.csproj -c Release -p:HitPanVersion=$env:CI_TEST_VERSION --nologo

      - name: Build Watchdog.Tests
        run: dotnet build src/HitPan.Watchdog.Tests/HitPan.Watchdog.Tests.csproj -c Release -p:HitPanVersion=$env:CI_TEST_VERSION --nologo

      - name: Run xUnit (expect all PASS)
        run: dotnet test src/HitPan.Watchdog.Tests/HitPan.Watchdog.Tests.csproj -c Release --no-build --nologo --verbosity normal

      - name: Publish single-file EXE (smoke)
        run: |
          dotnet publish src/HitPan.Watchdog/HitPan.Watchdog.csproj `
            -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true `
            -p:HitPanVersion=$env:CI_TEST_VERSION `
            -o ./publish-watchdog
          if (-not (Test-Path ./publish-watchdog/HitPan.Watchdog.exe)) {
            throw "Publish output missing"
          }
          # 버전 스탬핑이 실제로 걸렸는지 산출물로 확인 — 주입이 무시되면 여기서 CI 를 세운다.
          $actual = (Get-Item ./publish-watchdog/HitPan.Watchdog.exe).VersionInfo.FileVersion
          if ($actual -ne "$env:CI_TEST_VERSION.0") {
            throw "버전 스탬핑 실패: 기대 $env:CI_TEST_VERSION.0 / 실제 $actual — Directory.Build.props 상속 또는 -p:HitPanVersion 주입이 깨졌습니다."
          }
          Write-Output "Version stamped: $actual"
          $size = (Get-Item ./publish-watchdog/HitPan.Watchdog.exe).Length / 1MB
          Write-Output "Publish size: $([int]$size) MB"

      # ★ 봉합 (2026-07-21, CI 2주 마비 2단계 — 실측 확인):
      #   이 스텝은 구조적으로 CI 에서 통과할 수 없었다.
      #   HealthProbe.cs:89 는 `OverallStatus == "healthy" ? 0 : 1` 로 종료코드를 낸다.
      #   그런데 L97 이 "cloudflared 서비스가 없으면 recovering" 으로 판정하고,
      #   GitHub Actions 러너에는 당연히 cloudflared 가 없다(고객 PC 가 아니다).
      #   → 항상 recovering → exit 1 → PowerShell 이 네이티브 실패를 스텝 실패로 전파.
      #   출력에는 "OverallStatus" 가 정상적으로 찍히는데도 throw 에 도달하기 전에 죽었다.
      #
      #   이 스모크의 목적은 "진단 JSON 을 뱉는가"(= 기동·직렬화·버전 스탬핑 확인)이지
      #   "이 러너가 건강한가"가 아니다. 러너 환경 건강은 검사 대상이 아니므로
      #   종료코드를 의도적으로 흡수하고, 출력 내용으로만 판정한다.
      #   (헌법 #15 정합: 침묵시키지 않고 실제 종료코드를 로그에 남긴다.)
      - name: Health probe smoke (--health)
        run: |
          $env:HITPAN_TENANT_ID = "ci-runner"
          $out = & ./publish-watchdog/HitPan.Watchdog.exe --health 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          Write-Output "[smoke] health probe exit code = $code (러너에 cloudflared 부재 → recovering=1 이 정상)"
          if ($out -notmatch '"OverallStatus"') {
            throw "Health probe did not emit OverallStatus"
          }
          # 버전 스탬핑이 진단 출력까지 전달되는지 확인(W4-0 단일출처 정합).
          if ($out -notmatch [regex]::Escape($env:CI_TEST_VERSION)) {
            throw "진단 JSON 에 버전 $env:CI_TEST_VERSION 이 없습니다 — VersionInfo 단일출처가 깨졌습니다."
          }
          exit 0
        shell: pwsh

      - name: Upload publish artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: hitpan-watchdog-${{ github.sha }}
          path: ./publish-watchdog/HitPan.Watchdog.exe
          retention-days: 7

  installer-validate:
    name: Installer Inno Setup Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ★ 봉합 (2026-07-21, CI 2주 마비 진범 ② — 사장님 지시로 실측 확인):
      #   이 단계가 2026-06-12 부터 계속 실패하며 Watchdog CI 를 빨간불로 고정시켰다.
      #   실패 로그: "Missing script: installer/scripts/InstallCloudflared.ps1"
      #
      #   ■ 무엇이 어긋났나 (둘 다 '코드는 앞서갔는데 CI 는 과거에 멈춤')
      #     ① 검사 대상 .iss 가 옛 파일이었다.
      #        HitPanSetup.iss 는 현재 릴리스 경로가 아니다 — 실제 출하는 HitPan-Universal.iss 다
      #        (CI build-installer.yml·build-installer-universal.ps1 모두 Universal 을 컴파일한다).
      #     ② 폐기된 스크립트 3종을 계속 필수로 요구했다.
      #        InstallCloudflared.ps1 · SelfCheck.ps1 · BootstrapInstall.ps1 은 사장님 결재
      #        (WS-20260612-01 Q1=A, 2026-06-12)로 폐기되어 installer/_deprecated_20260612/ 로 옮겼고,
      #        그 기능은 .iss CurStepChanged 에 통합됐다. 파일은 옮겼는데 이 목록만 안 고쳤다.
      #
      #   ■ 왜 위험했나 — 빨간불이 일상이 되면 아무도 안 본다.
      #     이 잡음 때문에 같은 워크플로의 진짜 실패(Worker DI 누락)도 2주간 묻혔다.
      #     파일을 폐기할 때 CI 검사 목록을 함께 고치는 것이 체크리스트에 없었다는 신호다.
      - name: Validate ISS file syntax
        run: |
          if [ ! -f installer/HitPan-Universal.iss ]; then
            echo "ISS file missing: installer/HitPan-Universal.iss"; exit 1
          fi
          # 필수 섹션 확인
          for section in '\[Setup\]' '\[Files\]' '\[Run\]' '\[Code\]'; do
            if ! grep -qE "$section" installer/HitPan-Universal.iss; then
              echo "Missing section: $section"; exit 1
            fi
          done
          # 필수 PowerShell 스크립트 확인 (폐기 3종 제외 — 2026-06-12 사장님 결재)
          for ps in AntivirusExceptions FirewallRules InstallWatchdog; do
            if [ ! -f "installer/scripts/$ps.ps1" ]; then
              echo "Missing script: installer/scripts/$ps.ps1"; exit 1
            fi
          done
          echo "Installer artifacts validated"

  scenario-lint:
    name: Scenario PowerShell Syntax Check
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ★ 봉합 (2026-07-21, CI 점검 중 선제 적발 — 아직 터지지 않았으나 오탐·미탐 둘 다 낸다):
      #   ① $errs 를 루프 밖에서 한 번만 초기화해 Tokenize 결과가 파일 간 누적됐다.
      #      첫 파일에 에러가 하나라도 나오면 이후 멀쩡한 파일이 전부 범인으로 지목된다(오탐).
      #   ② ForEach-Object 블록 안의 `exit 1` 은 파이프라인 스크립트블록만 끝낼 뿐
      #      스텝을 실패시키지 못한다 — 파싱 에러가 있어도 CI 가 초록이 될 수 있었다(미탐).
      #   ③ 대상 폴더(tests/scenarios)가 없거나 .ps1 이 0건이어도 조용히 통과했다.
      #   → 파일마다 $errs 를 새로 만들고, 결과를 모아 마지막에 한 번 판정한다.
      - name: Parse PowerShell scripts (Pester-free syntax check)
        run: |
          if (-not (Test-Path tests/scenarios)) {
            Write-Output "tests/scenarios 없음 — 검사 대상 0건 (스킵)"
            exit 0
          }
          $files = @(Get-ChildItem tests/scenarios -Filter *.ps1 -Recurse)
          Write-Output "검사 대상 .ps1 = $($files.Count)건"
          $bad = @()
          foreach ($f in $files) {
            $errs = @()   # 파일마다 새로 — 누적 금지(오탐 차단)
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $f.FullName), [ref]$errs)
            if ($errs.Count -gt 0) {
              Write-Host "::error file=$($f.FullName)::Parse errors: $($errs.Count) — $($errs[0].Message)"
              $bad += $f.FullName
            }
          }
          if ($bad.Count -gt 0) {
            throw "PowerShell 구문 오류 $($bad.Count)건: $($bad -join ', ')"
          }
          Write-Output "All scenario scripts parsed OK ($($files.Count)건)"
        shell: pwsh
