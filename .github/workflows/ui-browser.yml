# 화면 실측 CI — K35 알림·메신저 팝업 게이트 G1~G5 (작업지시서 docs/운영기록/20261028작G1-3_CI브라우저실측_K35_작업지시서.md)
#
# 🔴 build-and-test.yml 과 **따로** 띄운다(§2-3 · 대표 확인 §0-2 둘째 줄) — 게시 전 「빌드·시험 초록」 규율의 뜻을 안 바꾼다.
# 🔴 GitHub 시험 서버의 빈 DB 에서만 잰다 — 이 PC·운영·demo 무접촉(§0-2 첫째 줄 · #39).
# 🔴 새 비밀값(Secrets) 0 — 전부 런 안에서 난수로 만들고 가린다(S0). 본사로 가는 길은 닫힌 로컬 포트(#18·#22).
# 🔴 CI 로 못 재는 것: 터널 경로 · 실제 크롬 팝업 차단 강도 → HQA 실측팀 몫(§2-4 · §0-10). 「CI 초록 = 실제 크롬에서 안 막힘」 아님.
#
# 트리거(개발명세서 §1-1 · §0-9 ② B안 순서 함정):
#   ⬛ [낡은 줄 · F-PR] pull_request + workflow_dispatch 를 두되 **잡 단위 if** 로 「이 갈래(H) 브랜치의 PR 이거나 수동 실행」일 때만 돈다.
#   ⬛ [낡은 줄 · F-PR] 그 밖의 PR 에서는 잡이 **건너뛰어진다** → main 머지 뒤 다른 PR 이 「돈 시험 0건 = 빨강」에 걸리지 않는다.
#   ⬛ [낡은 줄 · F-PR] 갈래 K(#691) 가 들어올 때 그 PR 에서 if 를 넓힌다(K 시험 본문과 같은 PR).
#   🔴 K 연결(11/6 · 작업지시서 20261106작 #691 재기반 §5-4 · 대표 Q1 「화면·API 바뀐 PR만」 · PM A3 ㉯ · C3 · C4):
#     거르기 잡(ui-changes)이 PR 합침 커밋의 첫 부모와 비교해 바뀐 파일을 범주로 센다(외부 액션 0 · 읽기 권한만 · 비밀값 0).
#     ⬛ [낡은 줄 · 갈래 A 첫 꼴] 화면 · API(와 참조 프로젝트) · 출하 DDL · 장치 · 이 워크플로가 바뀐 PR 이면 ui-k35 가 돈다 — 머지 뒤에도.
#     ⬛ [낡은 줄 · 3V-1] 🔴 PM 결정 3V-1 — 문서(docs/ 아래 · .md) 밖 파일이 하나라도 바뀐 PR 이면 ui-k35 가 돈다 — 머지 뒤에도(경로 허용 목록 0).
#     🔴 PM 결정 4V-1 ① — 문서 = docs/ 아래만(.md 라도 docs/ 밖이면 돈다 · 제어 글자 든 이름 = 돈다). docs/ 밖 파일이 하나라도 바뀐 PR 이면 ui-k35 가 돈다 — 머지 뒤에도.
#     잔여 한계: 이 워크플로 파일 자체도 PR 쪽 사본이다 — PR 이 이 파일을 바꾸면 거르기도 바뀐다(고정 「돈다」 가 걸리는 자리 · 리뷰로 본다).
#     문서만 바꾼 PR 은 ui-k35 가 건너뛰어진다(런 결론은 success 로 보인다 · 「건너뜀 ≠ 초록」 = 읽는 규칙 · 머지 상신 잡별 결과표).
#     거르기 오류 · 빈 출력 · 거르기 잡 실패 · 수동 실행 = 「돈다」(닫힌 쪽 = 도는 쪽).
#   경로 거르기(paths)는 안 쓴다(§3-1). 필수 검사 지정 = 지금 안 함 · 조건 뒤 따로 결재(§0-10).
#   🔴 F-PR(11/6 · PM 판단 C5): 자체시험 잡(ui-selftest)은 조건 없음 — 대상 PR 마다 · 수동 실행에서 돈다(짧은 잡 · 읽기 권한만).
#
# 실패 구분(§5): 단계 이름 머리 [장치] / [시험]. 🔴 [시험] 빨강 → 재실행 금지. [장치] 빨강 → 같은 커밋 재실행 1회까지.
# 측정 커밋: scripts/playwright-audit/ci/plant.flags 에 `red`(심은 빨강 §4-3 ⓒ) · `leak`(누출 검사 3꼴 §0-9 ⑪). 머지 금지.
#   2차(10/29): 두 낱말은 **한 측정 커밋에 함께**(`red leak`) — S8·S9 는 H-PLANT 로 빨강 · S10 은 꼴 3개 잡음으로 빨강(따로 읽힌다).
name: UI Browser (K35)

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 🔴 K 연결 — 거르기 잡. 바뀐 파일 이름은 파일로만 넘긴다(식 · 셸 글자로 run 줄에 들어가는 자리 0).
  #   체크아웃은 아래 잡들과 같은 꼴 + 비교에 필요한 깊이 2 만 더함(자격증명 보존 기본값은 별건 전수 · 이 잡 1칸 기록).
  #   합침 커밋 첫 부모 = 기준 가지 머리 · 이름이 옮겨져도 옛 자리 · 새 자리 둘 다 센다(옮김 짝 맞추기 끔).
  ui-changes:
    name: ui-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.pick.outputs.run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # ⬛ [낡은 단계 · 갈래 A 첫 꼴] "[장치] 거르기 — 화면 · API · 장치 · 워크플로 바뀜"
      #   git diff --no-renames --name-only -z → 규칙 스크립트(경로 허용 목록) → run 줄 grep → 출력 칸
      # 🔴 PM 결정 3V-1(11/6) — 닫힌 쪽: 전부 문서일 때만 안 돈다 · 장치·워크플로 폴더가 바뀌면 스크립트 전에 고정 「돈다」
      #   (스크립트는 PR 쪽 사본이라 그 판단만 믿지 않는다) · 출력 칸은 끝에 한 번만 · 예외 · 빈 목록 · 해석 못 함 = 돈다.
      #   파일 이름은 로그에 찍지 않는다(범주별 수만).
      - name: "[장치] 거르기 — 문서만 바뀐 PR 만 안 돈다"
        id: pick
        run: |
          lst="$RUNNER_TEMP/ui-changed.lst"
          out="$RUNNER_TEMP/ui-changes.out"
          run="true"
          if git -c core.quotePath=false diff -z --no-renames --name-only HEAD^1 HEAD > "$lst"; then
            if grep -qzE '^(scripts/playwright-audit/ci/|\.github/workflows/)' "$lst"; then
              echo "거르기: 장치 · 워크플로 폴더 바뀜 → 돈다(스크립트 판단 전 고정)"
            elif node scripts/playwright-audit/ci/ui-changes.js < "$lst" > "$out"; then
              grep -m1 -E '^거르기: ' "$out" || echo "거르기: 이유 줄 없음"
              if [ "$(grep -c -x 'run=false' "$out")" = "1" ] && [ "$(grep -c '^run=' "$out")" = "1" ]; then run="false"; fi
            else
              echo "거르기: 규칙 스크립트 실패 → 돈다"
            fi
          else
            echo "거르기: 바뀐 파일 목록 못 구함(비교 실패) → 돈다"
          fi
          echo "거르기 결론: run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  ui-k35:
    name: ui-k35
    # ⬛ [낡은 줄 · F-PR] if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feat/20261029-G1-3-H-')
    # 🔴 K 연결 — 취소 아님 그리고 (수동 실행 · H 머리 가지 · 거르기 출력이 「안 돈다」가 아님). 빈 출력 · 거르기 잡 실패 = 돈다.
    needs: ui-changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feat/20261029-G1-3-H-') || needs.ui-changes.outputs.run != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "[장치] S0 난수 만들기 · 가림"
        # 값은 만든 즉시 ::add-mask:: → $GITHUB_ENV 로만 넘긴다. 화면·파일 출력 0. set -x 금지(값이 찍힌다).
        # 16진 난수 — JWT_SECRET 의 약한 표지 낱말 검사(AuthExtensions.cs:17~41)에 안 걸리고, 암호화 키는 64자 = 32바이트.
        run: |
          set -euo pipefail
          put() { echo "::add-mask::$2"; echo "$1=$2" >> "$GITHUB_ENV"; }
          put UI_DB_PASSWORD "$(openssl rand -hex 24)"
          put UI_JWT_SECRET  "$(openssl rand -hex 32)"
          put UI_ENC_KEY     "$(openssl rand -hex 32)"
          put UI_BOOT_KEY    "$(openssl rand -hex 32)"
          put UI_PW_PARENT   "Ui#$(openssl rand -hex 16)"
          put UI_PW_GA       "Ui#$(openssl rand -hex 16)"
          put UI_PW_NA       "Ui#$(openssl rand -hex 16)"
          {
            echo "UI_OUT=$RUNNER_TEMP/ui-out"
            echo "UI_API_DIR=$RUNNER_TEMP/ui-api"
            echo "UI_API_EXE=$RUNNER_TEMP/ui-api/HitPan.API"
            echo "UI_BASE=http://127.0.0.1:18080"
            echo "UI_LOGIN_PARENT=ci-parent"
            echo "UI_LOGIN_GA=ci-ga"
            echo "UI_LOGIN_NA=ci-na"
            echo "HITPAN_LOG_DIR=$RUNNER_TEMP/ui-out/main/api-logs"
          } >> "$GITHUB_ENV"
          # 2차(10/29) ①: trace 는 기록·업로드 안 함 → trace 폴더를 만들지 않는다.
          mkdir -p "$RUNNER_TEMP/ui-out/main"
          node scripts/playwright-audit/ci/mask-probe.js

      - name: "[장치] S0 API 설정값 (환경변수 폴백 · appsettings 무접촉 #21)"
        # TenantConfigReader 는 db.conf 후보가 비면 환경변수를 읽는다(TenantConfigReader.cs:24·47~51).
        # 게시 폴더는 RUNNER_TEMP 아래 — 레포 안 db.conf 후보 경로와 겹치지 않는다.
        run: |
          set -euo pipefail
          {
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=13306"
            echo "DB_NAME=hitpan_ui"
            echo "DB_USER=root"
            echo "DB_PASSWORD=$UI_DB_PASSWORD"
            echo "JWT_SECRET=$UI_JWT_SECRET"
            echo "ERP_ENCRYPTION_KEY=$UI_ENC_KEY"
            echo "HITPAN_BOOTSTRAP_TOKEN_KEY=$UI_BOOT_KEY"
            echo "TENANT_CODE=CIUI"
            echo "HITPAN_HQ_API_URL=http://127.0.0.1:9"
            echo "ASPNETCORE_ENVIRONMENT=Production"
            echo "ASPNETCORE_URLS=http://127.0.0.1:18080"
          } >> "$GITHUB_ENV"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: "[장치] S1 컨테이너 DB (mariadb:11.4 · 127.0.0.1 만)"
        # services: 로 두면 단계보다 먼저 떠서 S0 난수를 못 받는다 — 그래서 단계 안 docker run(§3-2 S1).
        # 비번은 docker 인자에 값을 쓰지 않고 이름만 넘긴다(-e 이름 = 환경에서 읽음).
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.UI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          docker run -d --name ui-mariadb -p 127.0.0.1:13306:3306 \
            -e MARIADB_ROOT_PASSWORD \
            --health-cmd="healthcheck.sh --connect --innodb_initialized" \
            --health-interval=5s --health-timeout=5s --health-retries=30 \
            mariadb:11.4 >/dev/null
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' ui-mariadb)
            if [ "$st" = "healthy" ]; then echo "MariaDB healthy"; exit 0; fi
            sleep 2
          done
          echo "::error::[장치] MariaDB 컨테이너 헬스체크 시간초과"; exit 1

      - name: "[장치] S2 클라이언트 설치 · 대기 (db-gate 그대로)"
        env:
          MYSQL_PWD: ${{ env.UI_DB_PASSWORD }}
        run: |
          ok=0
          for i in 1 2 3; do
            if sudo timeout 240 apt-get update && sudo timeout 240 apt-get install -y mariadb-client; then ok=1; break; fi
            echo "::warning::apt 시도 $i 실패 — 재시도"
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "::error::[장치] mariadb-client 설치 3회 실패 (apt 미러)"; exit 1; fi
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 13306 -u root -e "SELECT 1" >/dev/null 2>&1; then echo "MariaDB ready"; exit 0; fi
            echo "waiting for mariadb ($i)"; sleep 2
          done
          echo "::error::[장치] MariaDB 접속 대기 시간초과"; exit 1

      - name: "[장치] S3 출하 DDL 적재 (#36)"
        env:
          MYSQL_PWD: ${{ env.UI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -P 13306 -u root --default-character-set=utf8mb4 \
            -e "CREATE DATABASE IF NOT EXISTS hitpan_ui CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -P 13306 -u root --default-character-set=utf8mb4 hitpan_ui < installer/hitpan_db_clean.sql
          n=$(mysql -h 127.0.0.1 -P 13306 -u root -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='hitpan_ui';")
          echo "적재된 표 개수: $n"
          if [ "${n:-0}" -eq 0 ]; then echo "::error::[장치] 출하 DDL 적재 표 0개"; exit 1; fi

      - name: "[장치] S4 빌드·게시 (API linux-x64 · Web → api/wwwroot)"
        # 경고 0 확인은 build 잡 몫(중복 안 함 · §3-2 S4). 실행은 반드시 앱호스트(HitPan.API) —
        # `dotnet HitPan.API.dll` 로 띄우면 ProcessPath 가 dotnet 이라 wwwroot·설정 후보 경로가 엇나간다(Program.cs:58~65).
        run: |
          set -euo pipefail
          dotnet publish src/HitPan.API/HitPan.API.csproj -c Release -r linux-x64 --self-contained false -o "$UI_API_DIR" -v q
          dotnet publish src/HitPan.Web/HitPan.Web.csproj -c Release -o "$RUNNER_TEMP/ui-web" -v q
          mkdir -p "$UI_API_DIR/wwwroot"
          cp -r "$RUNNER_TEMP/ui-web/wwwroot/." "$UI_API_DIR/wwwroot/"
          test -f "$UI_API_DIR/wwwroot/index.html" || { echo "::error::[장치] api/wwwroot/index.html 없음"; exit 1; }
          test -x "$UI_API_EXE" || { echo "::error::[장치] 앱호스트 HitPan.API 없음"; exit 1; }

      - name: "[장치] S5 시드 ① 부모계정 (1안 · seed-parent 실물 길)"
        run: node scripts/playwright-audit/ci/seed-parent.js

      - name: "[장치] S6 API 기동 (Production · 본사 길 닫힌 포트)"
        run: |
          set -uo pipefail
          # H 런 1(40722840211) 장치 빨강: API 는 떴으나 Content root = 체크아웃 폴더 · 「WebRootPath was not found」 → index.html 이 200 이 안 됐다.
          # ⬛ [낡은 줄 · 사실과 다름 — 리뷰서 §재확인 Q-5] 고객 PC 는 서비스가 설치 폴더를 Content root 로 쓴다 → 여기서도 앱 폴더에서 띄운다(PM 장치 고침 · 제품 코드 0 · [4] 확인 대상).
          # 고객 PC 는 작업 스케줄러(HitPan-Universal.iss:2990)·폴백 배치(hitpan-start.bat:78)가 api 폴더에서 띄운다 → 여기서도 앱 폴더에서 띄운다(PM 장치 고침 · 제품 코드 0).
          ls -la "$UI_API_DIR/wwwroot" | head -5
          cd "$UI_API_DIR"
          nohup "$UI_API_EXE" > "$UI_OUT/main/api-stdout.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ui-api.pid"
          pid=$(cat "$RUNNER_TEMP/ui-api.pid")
          code=000
          for i in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then echo "::error::[장치] API 프로세스가 기동 중 끝났다"; exit 1; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' "$UI_BASE/index.html" || echo 000)
            if [ "$code" = "200" ]; then echo "API·화면 ready (${i}s)"; exit 0; fi
            sleep 1
          done
          echo "::error::[장치] API 기동 90초 시간초과 · 마지막 index.html 응답=$code"; exit 1

      - name: "[장치] S5 시드 ② 자식 2 · 대화방 2 (API 기동 뒤)"
        run: node scripts/playwright-audit/ci/seed-children.js

      - name: "[장치] S7 브라우저 설치 (playwright 판 고정 1.60.0 · 3회 제한)"
        working-directory: scripts/playwright-audit
        run: |
          ok=0
          for i in 1 2 3; do
            if timeout 300 npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.60.0; then ok=1; break; fi
            echo "::warning::npm 시도 $i 실패"; sleep 10
          done
          if [ "$ok" != "1" ]; then echo "::error::[장치] playwright 설치 3회 실패"; exit 1; fi
          ok=0
          for i in 1 2 3; do
            if timeout 600 npx playwright install --with-deps chromium webkit; then ok=1; break; fi
            echo "::warning::브라우저 내려받기 시도 $i 실패"; sleep 10
          done
          if [ "$ok" != "1" ]; then echo "::error::[장치] 브라우저 설치 3회 실패"; exit 1; fi
          node -e "console.log('playwright', require('playwright/package.json').version)"

      - name: "[시험] S8 K35 시험 (H 단계 = 장치 점검 + 대조 단언 · K 본문은 k35-*.js)"
        # 🔴 시험 러너를 끼우지 않는다 — 일반 node 가 표준출력에 가림 줄을 그대로 쓴다(§0-9 ⑫ⓐ).
        # 🔴 표준출력을 업로드 폴더에 tee 하지 않는다(⑫ⓑ).
        # 🔴 K 연결 3차(PM 결정 4V-2 P2-a) — 단계 시간 상한(잡 30분 안). K 본문 자체 상한(전체 12분 · 경우 150초 · 화면 평가 10초)이 먼저 걸리게 둔다.
        #   이 상한에 걸리면 단계 결론 = 실패(취소 아님 · 공개 문서 기준 · 실물 미측정) → 아래 S9·S10 은 `always()` 라 돈다 ·
        #   S11 은 누출 검사 통과 + 표지 없음일 때만 — 표지가 없어도 업로드 자리엔 대조 지난 그림만 있다(K 가 임시 자리에서 찍고 옮김).
        timeout-minutes: 20
        run: |
          set -uo pipefail
          rc=0
          node scripts/playwright-audit/ci/device-check.js || rc=1
          # ⬛ [낡은 줄 · F-PR] shopt -s nullglob
          # ⬛ [낡은 줄 · F-PR] for f in scripts/playwright-audit/ci/k35-*.js; do
          # ⬛ [낡은 줄 · F-PR]   echo "── $f"; node "$f" || rc=1
          # ⬛ [낡은 줄 · F-PR] done
          # 🔴 F-PR N1 — 셸 글롭 대신 판정기와 같은 함수로 고르는 실행기(이상한 이름 = 아무것도 안 돌리고 실패)
          node scripts/playwright-audit/ci/run-k-bodies.js || rc=1
          exit $rc

      - name: "[시험] S9 판정"
        if: always()
        run: node scripts/playwright-audit/ci/judge.js

      - name: "[장치] API 멈춤 (로그 마무리)"
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ui-api.pid" ]; then kill "$(cat "$RUNNER_TEMP/ui-api.pid")" 2>/dev/null || echo "API 이미 멈춤"; sleep 2; fi
          c=$(grep -r -c -I "hitpan.kr" "$UI_OUT/main" 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
          echo "API·화면 로그 안 hitpan.kr 언급 ${c}줄 (기록용 · 요청 증거 아님 · §3-4)"

      - name: "[장치] S10 누출 검사 (3꼴 · zip 풀어서)"
        id: leak
        if: always()
        run: node scripts/playwright-audit/ci/leak-scan.js "$UI_OUT"

      - name: "[장치] S11 업로드 — 결과표·스크린샷·로그 (S10 통과분만 · 7일)"
        # ⬛ [낡은 줄 · F-PR] if: always() && steps.leak.outcome == 'success'
        # 🔴 K 연결 2차(보안상무 [3-V] P1-07 · PM 결정 3V-1) — K 의 N4 줄이 거짓이면(kit35 가 S8 에서 표지를 넘김) 올리지 않는다.
        # 🔴 3차(PM 결정 3V-2) — 표지에만 기대지 않는다: K 그림은 업로드 자리 밖 임시 자리에서 찍고 직후 대조를 지난 것만 옮긴다.
        #   그래서 K 가 죽거나 S8 이 시간 상한 · 취소로 끊겨 표지가 안 써져도 업로드 자리의 K 그림은 대조 지난 것뿐. 이 조건 줄은 자체시험 K-C24h 넷째 칸이 잠근다.
        if: always() && steps.leak.outcome == 'success' && env.UI_N4_HIT != '1'
        uses: actions/upload-artifact@v5
        with:
          name: ui-k35-main
          path: ${{ env.UI_OUT }}/main
          retention-days: 7
          if-no-files-found: warn

      # ⬛ [뺀 단계 · 1차] "[장치] S11 업로드 — 실패 시 trace (S10 통과분만 · 포크 PR 런 제외 · 7일)" (ui-k35-trace)
      # 🔴 2차(10/29 · 작업지시서 §0-9 항목 5 · 보안상무 안 ⓐ): trace 는 기록도 업로드도 안 한다.
      #   로그인 칸 입력(비번 원문)·인증 헤더가 trace 에 남아 실패 런마다 S10 빨강 → main/ 까지 업로드 0 이 되기 때문.
      #   실패 증거 = 결과표 · 스크린샷 · API 로그 · 단언 메시지(위 ui-k35-main · 모두 S10 통과분).

  # 🔴 F-PR(11/6 · 작업지시서 20261106작 F-PR §4 C5 · 상신-L16) — 장치 자체시험 별도 잡.
  #   조건 없음(대상 PR 전부 + 수동 실행) · 권한 읽기만 · 비밀값·환경 등록 0 · 브라우저·DB·네트워크 0 · 필수 검사 지정 안 함.
  #   체크아웃은 위 잡과 같은 꼴(자격증명 보존 기본값은 별건 전수에서 다룬다 · 이 잡 1칸 기록).
  #   레포 위치 그대로 실행한다(사본 실행이면 워크플로 셈 칸이 대상을 못 찾는다).
  ui-selftest:
    name: ui-selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "[장치] 자체시험 작업 폴더"
        run: mkdir -p "$RUNNER_TEMP/selftest-work"

      - name: "[장치] 장치 자체시험 (누출 검사 · 기록 함수 · 판정기 · 실행기)"
        run: node scripts/playwright-audit/ci/leak-scan.selftest.js "$RUNNER_TEMP/selftest-work"

      # 🔴 W-G1-51 갈래 Z(11/19 · 개발명세서 docs/개발/erp/20261118작_WG1-51_갈래Z_측정장치_개발명세서.md §3 ⑥) — 인쇄 측정 장치 자체시험 한 단계.
      #   판정기 · 차림 정의 · 그림 만들기 · 런 계획 · ui-print 지킴 글자(브라우저 · DB · 네트워크 0 · node 만).
      - name: "[장치] 인쇄 측정 장치 자체시험 (판정기 · 차림 · 계획)"
        run: node scripts/playwright-audit/ci/print/print.selftest.js

  # 🔴 W-G1-51 인쇄 작3 갈래 Z(11/19 · 개발명세서 §3 ⑥ · 작업지시서 20261118작_WG1-51 §4-1) — 인쇄 측정 잡.
  #   이 가지 머리 · 수동 실행만(PR · 머지에서 안 돈다) · 런 = 이 워크플로 수동 실행 1회 · 상한 Z 4 · 고침 6.
  #   matrix = print/plan.json 의 이번 런(계획 잡이 읽어 넘김) — 런마다 yml 을 고치지 않고 plan.json 만 바꾼다.
  #   변형 = 잡마다 패치 1(git apply 실패 = 그 잡 전 칸 「차림 불가」) · qpdf = ⑨ 를 재는 잡에만(PM §6-a 3).
  #   비밀값 · 환경 등록 0 — S0 난수는 ui-k35 와 같은 꼴(런 안 무작위 · 가림) · 업로드 = S10 누출 검사 통과분만.
  #   제품 코드 · 설치본 무접촉 — 판독기 PrintProbe 는 솔루션 밖 시험 쪽 도구.
  ui-print-plan:
    name: ui-print-plan
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/feat/20261118-WG1-51-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "[장치] 런 계획 읽기 (print/plan.json → matrix)"
        id: plan
        run: node scripts/playwright-audit/ci/print/plan.js "$GITHUB_OUTPUT"

  ui-print:
    name: ui-print (${{ matrix.id }})
    needs: ui-print-plan
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/feat/20261118-WG1-51-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.ui-print-plan.outputs.matrix) }}
    env:
      PRINT_JOB: ${{ matrix.id }}
      PRINT_RUN: ${{ matrix.run }}
      PRINT_BOARD: ${{ matrix.board }}
      PRINT_PATCH: ${{ matrix.patch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 3차(11/19 · [3-V] A5) — 패치가 건드리는 파일을 적용 전(plan.js --check-patch) · 적용 뒤(--check-paths) 두 번 본다.
      #   측정 장치(scripts/) · 워크플로(.github/) 를 건드리면 적용 0 · 이미 바뀌었으면 되돌림 → 이 잡 전 칸 차림 불가.
      - name: "[장치] 변형 패치 적용 (없으면 건너뜀 · 실패 = 전 칸 차림 불가)"
        run: |
          set -uo pipefail
          if [ -z "$PRINT_PATCH" ]; then echo "패치 없음 — 대조판 그대로"; exit 0; fi
          if node scripts/playwright-audit/ci/print/plan.js --check-patch "$PRINT_PATCH" && git apply --check "$PRINT_PATCH" && git apply "$PRINT_PATCH"; then
            if { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | node scripts/playwright-audit/ci/print/plan.js --check-paths; then
              echo "패치 적용 끝"
            else
              git checkout HEAD -- scripts .github
              git clean -fdq -- scripts .github
              echo "PRINT_PATCH_FAIL=1" >> "$GITHUB_ENV"
              echo "::warning::[장치] 패치가 측정 장치 · 워크플로를 바꿈 — 되돌림 · 이 잡 전 칸 차림 불가"
            fi
          else
            echo "PRINT_PATCH_FAIL=1" >> "$GITHUB_ENV"
            echo "::warning::[장치] 패치 적용 실패 또는 거절 — 이 잡 전 칸 차림 불가"
          fi

      - name: "[장치] S0 난수 만들기 · 가림"
        run: |
          set -euo pipefail
          put() { echo "::add-mask::$2"; echo "$1=$2" >> "$GITHUB_ENV"; }
          put UI_DB_PASSWORD "$(openssl rand -hex 24)"
          put UI_JWT_SECRET  "$(openssl rand -hex 32)"
          put UI_ENC_KEY     "$(openssl rand -hex 32)"
          put UI_BOOT_KEY    "$(openssl rand -hex 32)"
          put UI_PW_PARENT   "Ui#$(openssl rand -hex 16)"
          put UI_PW_GA       "Ui#$(openssl rand -hex 16)"
          put UI_PW_NA       "Ui#$(openssl rand -hex 16)"
          {
            echo "UI_OUT=$RUNNER_TEMP/print-out"
            echo "PRINT_OUT=$RUNNER_TEMP/print-out/main"
            echo "UI_API_DIR=$RUNNER_TEMP/ui-api"
            echo "UI_API_EXE=$RUNNER_TEMP/ui-api/HitPan.API"
            echo "UI_BASE=http://127.0.0.1:18080"
            echo "UI_LOGIN_PARENT=ci-parent"
            echo "HITPAN_LOG_DIR=$RUNNER_TEMP/print-out/main/api-logs"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/print-out/main/pdfs"
          node scripts/playwright-audit/ci/mask-probe.js

      - name: "[장치] S0 API 설정값 (환경변수 폴백 · appsettings 무접촉 #21)"
        run: |
          set -euo pipefail
          {
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=13306"
            echo "DB_NAME=hitpan_ui"
            echo "DB_USER=root"
            echo "DB_PASSWORD=$UI_DB_PASSWORD"
            echo "JWT_SECRET=$UI_JWT_SECRET"
            echo "ERP_ENCRYPTION_KEY=$UI_ENC_KEY"
            echo "HITPAN_BOOTSTRAP_TOKEN_KEY=$UI_BOOT_KEY"
            echo "TENANT_CODE=CIPR"
            echo "HITPAN_HQ_API_URL=http://127.0.0.1:9"
            echo "ASPNETCORE_ENVIRONMENT=Production"
            echo "ASPNETCORE_URLS=http://127.0.0.1:18080"
          } >> "$GITHUB_ENV"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: "[장치] S1 컨테이너 DB (mariadb:11.4 · 127.0.0.1 만)"
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.UI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          docker run -d --name ui-mariadb -p 127.0.0.1:13306:3306 \
            -e MARIADB_ROOT_PASSWORD \
            --health-cmd="healthcheck.sh --connect --innodb_initialized" \
            --health-interval=5s --health-timeout=5s --health-retries=30 \
            mariadb:11.4 >/dev/null
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' ui-mariadb)
            if [ "$st" = "healthy" ]; then echo "MariaDB healthy"; exit 0; fi
            sleep 2
          done
          echo "::error::[장치] MariaDB 컨테이너 헬스체크 시간초과"; exit 1

      - name: "[장치] S2 클라이언트 설치 · 대기"
        env:
          MYSQL_PWD: ${{ env.UI_DB_PASSWORD }}
        run: |
          ok=0
          for i in 1 2 3; do
            if sudo timeout 240 apt-get update && sudo timeout 240 apt-get install -y mariadb-client; then ok=1; break; fi
            echo "::warning::apt 시도 $i 실패 — 재시도"
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "::error::[장치] mariadb-client 설치 3회 실패 (apt 미러)"; exit 1; fi
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 13306 -u root -e "SELECT 1" >/dev/null 2>&1; then echo "MariaDB ready"; exit 0; fi
            echo "waiting for mariadb ($i)"; sleep 2
          done
          echo "::error::[장치] MariaDB 접속 대기 시간초과"; exit 1

      - name: "[장치] S3 출하 DDL 적재 (#36)"
        env:
          MYSQL_PWD: ${{ env.UI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -P 13306 -u root --default-character-set=utf8mb4 \
            -e "CREATE DATABASE IF NOT EXISTS hitpan_ui CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -P 13306 -u root --default-character-set=utf8mb4 hitpan_ui < installer/hitpan_db_clean.sql
          n=$(mysql -h 127.0.0.1 -P 13306 -u root -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='hitpan_ui';")
          echo "적재된 표 개수: $n"
          if [ "${n:-0}" -eq 0 ]; then echo "::error::[장치] 출하 DDL 적재 표 0개"; exit 1; fi

      - name: "[장치] S4 빌드·게시 (API linux-x64 · Web → api/wwwroot)"
        run: |
          set -euo pipefail
          dotnet publish src/HitPan.API/HitPan.API.csproj -c Release -r linux-x64 --self-contained false -o "$UI_API_DIR" -v q
          dotnet publish src/HitPan.Web/HitPan.Web.csproj -c Release -o "$RUNNER_TEMP/ui-web" -v q
          mkdir -p "$UI_API_DIR/wwwroot"
          cp -r "$RUNNER_TEMP/ui-web/wwwroot/." "$UI_API_DIR/wwwroot/"
          test -f "$UI_API_DIR/wwwroot/index.html" || { echo "::error::[장치] api/wwwroot/index.html 없음"; exit 1; }
          test -x "$UI_API_EXE" || { echo "::error::[장치] 앱호스트 HitPan.API 없음"; exit 1; }

      - name: "[장치] S5 시드 부모계정 (seed-parent 실물 길 · 테넌트 A)"
        run: node scripts/playwright-audit/ci/seed-parent.js

      - name: "[장치] 측정 글꼴 — 이름표 고친 대체 글꼴 2개(고침 1 §8-1 · 판정 0 · 사실만 · 실패 = 이름 붙은 사유 · 칸 판정은 T8)"
        id: font
        timeout-minutes: 25
        continue-on-error: true
        run: |
          set -uo pipefail
          bad=0; fail() { bad=1; echo "PRINT_FONT_WHY=$1" >> "$GITHUB_ENV"; echo "⚫ FAIL [장치] $1 — 칸 판정은 T8 이 막음"; }
          W="$RUNNER_TEMP/font-work"; case "$W" in "$UI_OUT"*) fail "글꼴 단계 — 작업 폴더가 업로드 뿌리 안"; exit 1;; esac
          ok=0
          for i in 1 2 3; do
            if sudo timeout 240 apt-get update && sudo timeout 240 apt-get install -y --no-install-recommends fonts-nanum python3-fonttools; then ok=1; break; fi
            echo "::warning::글꼴 apt 시도 $i 실패 — 재시도"; sleep 10
          done
          if [ "$ok" != "1" ]; then fail "글꼴 단계 — 꾸러미 설치 실패"; exit 1; fi
          dpkg-query -W fonts-nanum python3-fonttools > "$PRINT_OUT/font-packages.txt"
          N=/usr/share/fonts/truetype/nanum; mkdir -p "$W"
          if ! cp "$N/NanumGothic.ttf" "$W/regular.ttf" || ! cp "$N/NanumGothicBold.ttf" "$W/bold.ttf"; then fail "글꼴 단계 — 원본 파일 없음(경로 다름)"; exit 1; fi
          if why=$(/usr/bin/python3 scripts/playwright-audit/ci/print/font-rename.py "$W" "$PRINT_OUT/font-facts.json"); then sudo cp "$W"/print-substitute-regular.ttf "$W"/print-substitute-bold.ttf /usr/share/fonts/; else fail "${why:-글꼴 단계 — 이름 고침 실패}"; fi
          rm -rf "$W"
          if find "$UI_OUT" -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.ttc' \) | grep -q .; then fail "업로드 뿌리 글꼴 파일 >0"; fi
          if ! ls -l /usr/share/fonts/print-substitute-*.ttf; then echo "⚫ [장치] 고친 글꼴 맨 위에 없음(사실 · 판정은 판정기)"; fi
          exit "$bad"

      - name: "[장치] S6 API 기동 (Production · 본사 길 닫힌 포트)"
        run: |
          set -uo pipefail
          cd "$UI_API_DIR"
          nohup "$UI_API_EXE" > "$PRINT_OUT/api-stdout.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ui-api.pid"
          pid=$(cat "$RUNNER_TEMP/ui-api.pid")
          code=000
          for i in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then echo "::error::[장치] API 프로세스가 기동 중 끝났다"; exit 1; fi
            # ⬛ [낡은 줄 · 2~6차] code 받기 줄 뒤 echo 000 대체 — 7차 C4: 같은 동작(기다림 중 값 대체 · 90초 뒤 ::error:: 로 단계 실패는 그대로)
            if ! code=$(curl -s -o /dev/null -w '%{http_code}' "$UI_BASE/index.html"); then code=000; fi
            if [ "$code" = "200" ]; then echo "API·화면 ready (${i}s)"; exit 0; fi
            sleep 1
          done
          echo "::error::[장치] API 기동 90초 시간초과 · 마지막 index.html 응답=$code"; exit 1

      - name: "[장치] S7 브라우저 설치 (playwright 판 고정 1.60.0 · chromium · 3회 제한)"
        working-directory: scripts/playwright-audit
        run: |
          ok=0
          for i in 1 2 3; do
            if timeout 300 npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.60.0; then ok=1; break; fi
            echo "::warning::npm 시도 $i 실패"; sleep 10
          done
          if [ "$ok" != "1" ]; then echo "::error::[장치] playwright 설치 3회 실패"; exit 1; fi
          ok=0
          for i in 1 2 3; do
            if timeout 600 npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "::warning::브라우저 내려받기 시도 $i 실패"; sleep 10
          done
          if [ "$ok" != "1" ]; then echo "::error::[장치] 브라우저 설치 3회 실패"; exit 1; fi

      - name: "[장치] 판독기 짓기 · 자체시험 먼저 (PrintProbe T1~T6 · 양성 대조)"
        run: |
          set -uo pipefail
          dotnet build scripts/playwright-audit/ci/print/tools/PrintProbe/PrintProbe.csproj -c Release --artifacts-path "$RUNNER_TEMP/probe-art" -o "$RUNNER_TEMP/probe" -v q
          if dotnet "$RUNNER_TEMP/probe/PrintProbe.dll" selftest "$RUNNER_TEMP/probe-selftest" > "$RUNNER_TEMP/probe-selftest.log" 2>&1; then
            echo "PRINT_PROBE_OK=1" >> "$GITHUB_ENV"
          else
            echo "::warning::[장치] 판독기 자체시험 실패 — 이 잡 음성 기준 전부 미측정"
          fi
          # ⬛ [낡은 줄 · 2~6차] grep 줄 뒤 echo 대체(「자체시험 끝 줄 없음」) — 7차 C4: 같은 동작 · 실패 기록 줄(⚫)로 바꿈 · 단계 실패로 안 바꿈(뒤 캡처 단계에 if 가 없어 런 전체가 0 이 됨 · C7)
          if ! grep -E '^(🔴 FAIL|자체시험 끝)' "$RUNNER_TEMP/probe-selftest.log"; then echo "⚫ FAIL [장치] 판독기 자체시험 끝 줄 없음(프로세스가 끝 줄 전에 멈춤)"; fi
          cp "$RUNNER_TEMP/probe-selftest.log" "$PRINT_OUT/probe-selftest.log"

      - name: "[장치] qpdf 설치 · ⑨ 표본 만들기 (⑨ 를 재는 잡만)"
        if: ${{ matrix.qpdf == true }}
        run: |
          set -uo pipefail
          if sudo timeout 240 apt-get install -y qpdf; then qpdf --version | head -1; else echo "::warning::[장치] qpdf 설치 실패 — 이 런 ⑨ 칸만 미측정(설치 실패)"; fi
          # ⬛ [낡은 줄 · 3~6차] samples 줄 뒤 echo 대체(경고만) — 7차 C4: 경고 + 실패 기록 줄(⚫) · 단계 실패로 안 바꿈(같은 까닭 · C7)
          if ! PRINT_QPDF=1 dotnet "$RUNNER_TEMP/probe/PrintProbe.dll" samples "$PRINT_OUT/nine"; then echo "::warning::[장치] ⑨ 표본 만들기 실패"; echo "⚫ FAIL [장치] ⑨ 표본 만들기 실패 — 이 잡 ⑨ 칸 미측정"; fi

      - name: "[시험] 차림 · 판독 입구 (화면 단추 응답만)"
        timeout-minutes: 70
        run: node scripts/playwright-audit/ci/print/capture.js

      - name: "[시험] PDF 사실 뽑기 (판독기 · 판정 0)"
        if: always()
        run: |
          set -uo pipefail
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/print-unread"
          # 7차 R-2(C4) — 판독기 실패를 삼키지 않는다: 파일마다 끝까지 돌고(한 장 실패로 멈추지 않음) 실패 수를 센 뒤 1 이상이면 이 단계 실패.
          #   뒤 단계(판정 · API 멈춤 · 누출 검사 · 업로드)는 모두 if: always() 라 그대로 돈다(폭발 반경 = 이 단계 빨강 + 그 칸 미측정).
          n=0
          bad=0
          for f in "$PRINT_OUT"/pdfs/*.pdf; do
            n=$((n + 1))
            # ⬛ [낡은 줄 · 3~6차] dotnet "$RUNNER_TEMP/probe/PrintProbe.dll" read "$f" "${f%.pdf}.json" (뒤에 echo 대체 = 실패 삼킴 · Z4 108/108)
            if ! dotnet "$RUNNER_TEMP/probe/PrintProbe.dll" read "$f" "${f%.pdf}.json"; then bad=$((bad + 1)); echo "⚫ FAIL [장치] 판독기 실패 $(basename "$f")"; fi
            # 3차([3-V] A12) — 못 읽은 PDF 는 압축 흐름 안을 누출 검사가 못 본다 → 올리지 않는다(사실 JSON 은 남겨 판정 = 미측정)
            if ! grep -q '^  "ok": true' "${f%.pdf}.json" 2>/dev/null; then mv "$f" "$RUNNER_TEMP/print-unread/"; echo "못 읽은 PDF 업로드 제외 $(basename "$f")"; fi
          done
          echo "사실 뽑기 끝 — PDF ${n} · 판독기 실패 ${bad}"
          if [ "$bad" -gt 0 ]; then echo "::error::[장치] 판독기 실패 ${bad}/${n} — 그 칸 미측정 · 판정 단계는 그대로 돈다"; echo "⚫ FAIL [장치] 사실 뽑기 실패 ${bad}/${n}"; exit 1; fi

      - name: "[시험] 판정 (양성 대조 먼저 · 칸별 사유)"
        if: always()
        env:
          PRINT_FONT_OUTCOME: ${{ steps.font.outcome }}
        run: node scripts/playwright-audit/ci/print/judge-print.js "$PRINT_OUT"

      - name: "[장치] API 멈춤 (로그 마무리)"
        if: always()
        run: |
          # ⬛ [낡은 줄 · 2~6차] kill 줄 뒤 echo 대체(「API 이미 멈춤」) — 7차 C4: 같은 동작(이미 멈춘 경우 = 실패 아님 · 정리 단계)
          if [ -f "$RUNNER_TEMP/ui-api.pid" ]; then if ! kill "$(cat "$RUNNER_TEMP/ui-api.pid")" 2>/dev/null; then echo "API 이미 멈춤"; fi; sleep 2; fi

      - name: "[장치] S10 누출 검사 (3꼴 · 올리기 전)"
        id: leak
        if: always()
        run: node scripts/playwright-audit/ci/leak-scan.js "$UI_OUT"

      - name: "[장치] S11 업로드 — 결과표 · PDF · 사실 · 로그 (S10 통과분만 · 7일)"
        if: always() && steps.leak.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: ui-print-${{ matrix.id }}
          path: ${{ env.UI_OUT }}/main
          retention-days: 7
          if-no-files-found: warn
