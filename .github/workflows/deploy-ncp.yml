# NCP 자동 배포 (사장님 결재 Plan 2026-06-09 — cicd-velvety-reef)
#
# 트리거: develop push (백오피스 API/랜딩 영역만)
# 대상: NCP 서버 (back.hitpan.kr + landing.hitpan.kr)
#
# 헌법 정합:
#   #22·#35 — 본사 클라우드 (백오피스 + 랜딩만 NCP 배포, ERP는 고객 PC 로컬 절대)
#   #19 — errors 0 + warnings 0 게이트 통과 후에만 배포
#
# 사장님 결재 필요 시크릿:
#   - NCP_SSH_PRIVATE_KEY  (NCP 인증키)
#   - NCP_HOST             (back.hitpan.kr 서버 IP)
#   - NCP_USER             (배포 계정)
name: Deploy to NCP

on:
  push:
    branches: [develop]
    paths:
      - 'src/HitPan.Backoffice.API/**'
      - 'src/HitPan.Landing/**'
      - '.github/workflows/deploy-ncp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build-ok: ${{ steps.build.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Backoffice API + Landing
        id: build
        # 헌법 #19 게이트: warnings = errors
        run: |
          dotnet build src/HitPan.Backoffice.API/HitPan.Backoffice.API.csproj -c Release /p:TreatWarningsAsErrors=true
          dotnet build src/HitPan.Landing/HitPan.Landing.csproj -c Release /p:TreatWarningsAsErrors=true

      - name: Publish Backoffice API
        run: dotnet publish src/HitPan.Backoffice.API/HitPan.Backoffice.API.csproj -c Release -o publish/backoffice-api --no-build

      - name: Publish Landing
        run: dotnet publish src/HitPan.Landing/HitPan.Landing.csproj -c Release -o publish/landing --no-build

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ncp-publish
          path: publish/
          retention-days: 7

  deploy:
    name: Deploy to NCP
    needs: build
    if: needs.build.outputs.build-ok == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Download publish artifacts
        uses: actions/download-artifact@v4
        with:
          name: ncp-publish
          path: publish/

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.NCP_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ncp_key
          chmod 600 ~/.ssh/ncp_key
          ssh-keyscan -H ${{ secrets.NCP_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync to NCP (backup first)
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
        run: |
          TS=$(date +%Y%m%d-%H%M%S)
          # 1) 기존 백업 (service 정합 경로 /opt/hitpan/*)
          ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "
            sudo cp -r /opt/hitpan/backoffice-api /opt/hitpan/backoffice-api-bak-$TS || true
            sudo cp -r /opt/hitpan/landing /opt/hitpan/landing-bak-$TS || true
          "
          # 2) 새 빌드 전송
          rsync -avz --delete -e "ssh -i ~/.ssh/ncp_key" publish/backoffice-api/ $NCP_USER@$NCP_HOST:/tmp/backoffice-api/
          rsync -avz --delete -e "ssh -i ~/.ssh/ncp_key" publish/landing/ $NCP_USER@$NCP_HOST:/tmp/landing/
          # 3) 권한 봉합 + 위치 이동 (service WorkingDirectory 정합) + 재기동
          # appsettings.Production.json 은 NCP 운영 시크릿(DB·SMTP) 박혀있어 절대 덮어쓰기 금지
          # (--exclude 영역 박아서 보존, NCP에 박힌 영역 그대로 유지)
          ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "
            sudo rsync -a --delete --exclude='appsettings.Production.json' --exclude='appsettings.Development.json' /tmp/backoffice-api/ /opt/hitpan/backoffice-api/
            sudo rsync -a --delete --exclude='appsettings.Production.json' --exclude='appsettings.Development.json' /tmp/landing/ /opt/hitpan/landing/
            sudo systemctl restart hitpan-backoffice-api
            sudo systemctl restart hitpan-landing
          "

      - name: Healthcheck
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
        run: |
          sleep 8
          # back.hitpan.kr root 응답 (백오피스 Web 로그인 페이지)
          BACK_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" https://back.hitpan.kr/) || true
          echo "back / → $BACK_CODE"
          echo "$BACK_CODE" | grep -E '^(200|301|302)$' || (echo "Backoffice root failed"; exit 1)
          # landing.hitpan.kr root
          LAND_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" https://landing.hitpan.kr/) || true
          echo "landing / → $LAND_CODE"
          echo "$LAND_CODE" | grep -E '^(200|301|302)$' || (echo "Landing root failed"; exit 1)
          # API 라우트 직접 5258 — 실제 라우트 /api/backoffice/credentials/status (CredentialsStatusController)
          # 인증 필요하므로 200/401/403 모두 정상 통과
          API_CODE=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5258/api/backoffice/credentials/status") || true
          echo "API direct (credentials/status) → $API_CODE"
          echo "$API_CODE" | grep -E '^(200|401|403)$' || (echo "API route 미적용 — 빌드 재진단"; exit 1)
          # 외부 nginx 경유 healthz (인증 불요) 추가 점검
          EXT_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" https://back.hitpan.kr/api/backoffice/credentials/healthz) || true
          echo "API external (healthz) → $EXT_CODE"
          echo "$EXT_CODE" | grep -E '^(200|401|403)$' || (echo "nginx 경유 라우트 실패"; exit 1)
          # biz-no 라우트 등재 점검 — BizNoVerifyController는 Backoffice.API 영역(back.hitpan.kr)에 존재
          # POST 라우트라 GET은 405/400/415 정상
          LAND_API=$(curl -fsS -o /dev/null -w "%{http_code}" https://back.hitpan.kr/api/landing/biz-no/verify) || true
          echo "back biz-no GET → $LAND_API (405/400/415 정상)"
          echo "$LAND_API" | grep -E '^(405|400|401|415)$' || (echo "biz-no 라우트 미등재"; exit 1)

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::NCP 배포 실패. SSH 진단 후 수동 롤백 검토."
