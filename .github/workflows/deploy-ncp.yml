# NCP 자동 배포 (사장님 결재 Plan 2026-06-09 — cicd-velvety-reef)
#
# 트리거: develop push (백오피스 API/랜딩 영역만)
# 대상: NCP 서버 (back.hitpan.kr + landing.hitpan.kr)
#
# 헌법 정합:
#   #22·#35 — 본사 클라우드 (백오피스 + 랜딩만 NCP 배포, ERP는 고객 PC 로컬 절대)
#   #19 — errors 0 + warnings 0 게이트 통과 후에만 배포
#
# 사장님 결재 필요 시크릿:
#   - NCP_SSH_PRIVATE_KEY  (NCP 인증키)
#   - NCP_HOST             (back.hitpan.kr 서버 IP)
#   - NCP_USER             (배포 계정)
name: Deploy to NCP

on:
  push:
    branches: [develop]
    paths:
      - 'src/HitPan.Backoffice.API/**'
      - 'src/HitPan.Backoffice/**'
      - 'src/HitPan.Landing/**'
      - '.github/workflows/deploy-ncp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build-ok: ${{ steps.build.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build Backoffice API + Web + Landing
        id: build
        # 헌법 #19 게이트: warnings = errors
        run: |
          dotnet build src/HitPan.Backoffice.API/HitPan.Backoffice.API.csproj -c Release /p:TreatWarningsAsErrors=true
          dotnet build src/HitPan.Backoffice/HitPan.Backoffice.csproj -c Release /p:TreatWarningsAsErrors=true
          dotnet build src/HitPan.Landing/HitPan.Landing.csproj -c Release /p:TreatWarningsAsErrors=true

      - name: Publish Backoffice API
        run: dotnet publish src/HitPan.Backoffice.API/HitPan.Backoffice.API.csproj -c Release -o publish/backoffice-api --no-build

      - name: Publish Backoffice Web
        run: dotnet publish src/HitPan.Backoffice/HitPan.Backoffice.csproj -c Release -o publish/backoffice-web --no-build

      - name: Publish Landing
        run: dotnet publish src/HitPan.Landing/HitPan.Landing.csproj -c Release -o publish/landing --no-build

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ncp-publish
          path: publish/
          retention-days: 7

  deploy:
    name: Deploy to NCP
    needs: build
    if: needs.build.outputs.build-ok == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Download publish artifacts
        uses: actions/download-artifact@v5
        with:
          name: ncp-publish
          path: publish/

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.NCP_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ncp_key
          chmod 600 ~/.ssh/ncp_key
          ssh-keyscan -H ${{ secrets.NCP_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync to NCP (backup first)
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
        run: |
          TS=$(date +%Y%m%d-%H%M%S)
          # 1) 기존 백업 (service 정합 경로 /opt/hitpan/*)
          ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "
            sudo cp -r /opt/hitpan/backoffice-api /opt/hitpan/backoffice-api-bak-$TS || true
            sudo cp -r /opt/hitpan/backoffice-web /opt/hitpan/backoffice-web-bak-$TS || true
            sudo cp -r /opt/hitpan/landing /opt/hitpan/landing-bak-$TS || true
          "
          # 2) 새 빌드 전송
          rsync -avz --delete -e "ssh -i ~/.ssh/ncp_key" publish/backoffice-api/ $NCP_USER@$NCP_HOST:/tmp/backoffice-api/
          rsync -avz --delete -e "ssh -i ~/.ssh/ncp_key" publish/backoffice-web/ $NCP_USER@$NCP_HOST:/tmp/backoffice-web/
          rsync -avz --delete -e "ssh -i ~/.ssh/ncp_key" publish/landing/ $NCP_USER@$NCP_HOST:/tmp/landing/
          # 3) 권한 봉합 + 위치 이동 (service WorkingDirectory 정합) + 재기동
          # appsettings.Production.json 은 NCP 운영 시크릿(DB·SMTP) 담겨있어 절대 덮어쓰기 금지
          # (--exclude 영역 추가하여 보존, NCP에 저장된 영역 그대로 유지)
          ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "
            sudo rsync -a --delete --exclude='appsettings.Production.json' --exclude='appsettings.Development.json' /tmp/backoffice-api/ /opt/hitpan/backoffice-api/
            sudo rsync -a --delete --exclude='appsettings.Production.json' --exclude='appsettings.Development.json' /tmp/backoffice-web/ /opt/hitpan/backoffice-web/
            sudo rsync -a --delete --exclude='appsettings.Production.json' --exclude='appsettings.Development.json' /tmp/landing/ /opt/hitpan/landing/
            sudo systemctl restart hitpan-backoffice-api
            sudo systemctl restart hitpan-backoffice-web
            sudo systemctl restart hitpan-landing
          "

      # ── 출하 버전 정합 (2026-07-16, 작1 W4-0 — 사장님 결재 "배포가 둘을 같이 넣게") ──
      #   왜 필요한가: 고객에게 설치 파일을 안내하는 경로가 둘이다(랜딩 다운로드 페이지 / 가입 승인 메일).
      #   각자 appsettings 를 읽는데, 사람이 두 파일을 따로 고치다 갈라지면
      #   "같은 회사가 두 경로에서 다른 EXE 를 주는" 사고가 난다 — 실제로 랜딩 1.2.33 / 메일 1.2.28 로
      #   갈라져 메일 고객이 로그인 안 되는 옛 EXE 를 받았다(검증팀 F-5 적발).
      #   그래서 배포가 두 곳에 같은 값을 한 번에 넣고, 다르면 배포를 세운다.
      #
      #   값의 출처 = Repository variable RELEASE_INSTALLER_VERSION (Settings > Variables).
      #   미설정 시 배포를 진행하되 경고 — 기존 서버 값이 남아 있어 즉시 사고는 아니나, 갱신이 안 된 상태다.
      #
      #   방식 = systemd drop-in 환경변수. appsettings.Production.json(운영 시크릿) 을 편집하지 않는다:
      #     · JSON 편집은 서버에 jq 가 있어야 하고(설치 여부 미확인 — 확인 자체가 헌법 #29 결재 대상),
      #       파싱 실패 시 운영 시크릿 파일이 깨질 위험이 있다.
      #     · .NET 은 환경변수가 appsettings 보다 우선하므로(Release__InstallerVersion), 시크릿 파일을
      #       건드리지 않고 값만 덮어쓸 수 있다. 되돌리기도 drop-in 파일 삭제 한 번이다.
      - name: Sync release installer version (landing + backoffice)
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
          RELEASE_VERSION: ${{ vars.RELEASE_INSTALLER_VERSION }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::warning::RELEASE_INSTALLER_VERSION 미설정 — 고객 안내 버전을 갱신하지 않았습니다. 새 EXE 를 올렸다면 Settings > Variables 에서 설정하세요."
            exit 0
          fi
          echo "고객 안내 설치 파일 버전 → $RELEASE_VERSION (랜딩·백오피스 동시 적용)"
          ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "
            set -e
            for SVC in hitpan-landing hitpan-backoffice-api; do
              sudo mkdir -p /etc/systemd/system/\$SVC.service.d
              printf '[Service]\nEnvironment=\"Release__InstallerVersion=$RELEASE_VERSION\"\n' | sudo tee /etc/systemd/system/\$SVC.service.d/release-version.conf > /dev/null
            done
            sudo systemctl daemon-reload
            sudo systemctl restart hitpan-landing
            sudo systemctl restart hitpan-backoffice-api
          "
          # 정합 게이트 — 두 서비스가 같은 값을 들고 떴는지 확인. 다르면 배포 실패(주석 아닌 코드가 막는다).
          LAND_V=$(ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "systemctl show hitpan-landing -p Environment --value | tr ' ' '\n' | sed -n 's/^Release__InstallerVersion=//p'") || true
          BACK_V=$(ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "systemctl show hitpan-backoffice-api -p Environment --value | tr ' ' '\n' | sed -n 's/^Release__InstallerVersion=//p'") || true
          echo "랜딩=$LAND_V / 백오피스=$BACK_V"
          if [ "$LAND_V" != "$RELEASE_VERSION" ] || [ "$BACK_V" != "$RELEASE_VERSION" ]; then
            echo "::error::출하 버전 불일치 — 랜딩=$LAND_V, 백오피스=$BACK_V, 기대=$RELEASE_VERSION. 두 경로가 다른 EXE 를 안내하게 됩니다."
            exit 1
          fi

      - name: Healthcheck
        id: healthcheck
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
        run: |
          sleep 8
          # back.hitpan.kr root 응답 (백오피스 Web 로그인 페이지)
          BACK_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" https://back.hitpan.kr/) || true
          echo "back / → $BACK_CODE"
          echo "$BACK_CODE" | grep -E '^(200|301|302)$' || (echo "Backoffice root failed"; exit 1)
          # landing.hitpan.kr root
          LAND_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" https://landing.hitpan.kr/) || true
          echo "landing / → $LAND_CODE"
          echo "$LAND_CODE" | grep -E '^(200|301|302)$' || (echo "Landing root failed"; exit 1)
          # API 라우트 직접 5258 — 실제 라우트 /api/backoffice/credentials/status (CredentialsStatusController)
          # 인증 필요하므로 200/401/403 모두 정상 통과
          API_CODE=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5258/api/backoffice/credentials/status") || true
          echo "API direct (credentials/status) → $API_CODE"
          echo "$API_CODE" | grep -E '^(200|401|403)$' || (echo "API route 미적용 — 빌드 재진단"; exit 1)
          # 외부 nginx 경유 healthz (인증 불요) 추가 점검
          EXT_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" https://back.hitpan.kr/api/backoffice/credentials/healthz) || true
          echo "API external (healthz) → $EXT_CODE"
          echo "$EXT_CODE" | grep -E '^(200|401|403)$' || (echo "nginx 경유 라우트 실패"; exit 1)
          # biz-no 라우트 등재 점검 — BizNoVerifyController는 Backoffice.API 영역(back.hitpan.kr)에 존재
          # POST 라우트라 GET은 405/400/415 정상
          LAND_API=$(curl -fsS -o /dev/null -w "%{http_code}" https://back.hitpan.kr/api/landing/biz-no/verify) || true
          echo "back biz-no GET → $LAND_API (405/400/415 정상)"
          echo "$LAND_API" | grep -E '^(405|400|401|415)$' || (echo "biz-no 라우트 미등재"; exit 1)

      - name: Rollback on failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
        run: |
          echo "::warning::Healthcheck 실패 — 자동 롤백 진행"
          LATEST_API_BAK=$(ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "ls -td /opt/hitpan/backoffice-api-bak-* 2>/dev/null | head -1")
          LATEST_WEB_BAK=$(ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "ls -td /opt/hitpan/backoffice-web-bak-* 2>/dev/null | head -1")
          LATEST_LAND_BAK=$(ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "ls -td /opt/hitpan/landing-bak-* 2>/dev/null | head -1")
          ssh -i ~/.ssh/ncp_key $NCP_USER@$NCP_HOST "
            [ -n \"$LATEST_API_BAK\" ] && sudo rsync -a --delete --exclude='appsettings.Production.json' --exclude='appsettings.Development.json' $LATEST_API_BAK/ /opt/hitpan/backoffice-api/
            [ -n \"$LATEST_WEB_BAK\" ] && sudo rsync -a --delete --exclude='appsettings.Production.json' --exclude='appsettings.Development.json' $LATEST_WEB_BAK/ /opt/hitpan/backoffice-web/
            [ -n \"$LATEST_LAND_BAK\" ] && sudo rsync -a --delete --exclude='appsettings.Production.json' --exclude='appsettings.Development.json' $LATEST_LAND_BAK/ /opt/hitpan/landing/
            sudo systemctl restart hitpan-backoffice-api hitpan-backoffice-web hitpan-landing
          "
          echo "::error::자동 롤백 완료. 진범 진단 후 재배포 필요."

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::NCP 배포 실패. SSH 진단 후 수동 점검 검토."
