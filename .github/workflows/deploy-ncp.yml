# NCP 자동 배포 (사장님 결재 Plan 2026-06-09 — cicd-velvety-reef)
#
# 트리거: main·develop push (백오피스 API/랜딩 영역만)
# 대상: NCP 서버 (back.hitpan.kr + landing.hitpan.kr)
#
# ■ 봉합 (2026-08-09, 병렬이슈 07 · 사장님 결재) — main 이 빠져 있었다
#   종전 트리거는 `branches: [develop]` 뿐이었는데, 우리 작업은 전부 `main` 으로 머지된다.
#   그래서 자동 배포가 **한 번도 걸리지 않았고** workflow_dispatch(수동)로만 돌았다.
#   실측: 마지막 배포 2026-08-02(전부 수동) / 업데이트기록 수신부 작성 2026-08-06
#         → 그 사이 자동 배포 0회. 8/06 에 아무도 안 눌렀다.
#   결과: main 에 있는 P0 4건이 서버에 없었다. 특히 f934d34
#         "국세청 무응답 시 가입 전면차단 해소" 가 미배포라, 국세청 API 가 흔들리면
#         신규 가입이 통째로 막히는 상태로 남아 있었다.
#   ⇒ 사람 기억에 의존하는 배포는 이미 한 번 실패했다. main 을 트리거에 넣는다.
#
# 헌법 정합:
#   #22·#35 — 본사 클라우드 (백오피스 + 랜딩만 NCP 배포, ERP는 고객 PC 로컬 절대)
#   #19 — errors 0 + warnings 0 게이트 통과 후에만 배포
#
# 사장님 결재 필요 시크릿:
#   - NCP_SSH_PRIVATE_KEY  (NCP 인증키)
#   - NCP_HOST             (back.hitpan.kr 서버 IP)
#   - NCP_USER             (배포 계정)
name: Deploy to NCP

on:
  push:
    # 🔴 main 이 먼저다 — 우리 작업의 머지 대상이 main 이다(병렬이슈 07).
    #   develop 은 종전 동작 유지를 위해 존치한다(헌법 #1 — 수정은 OK, 덮어쓰기 금지).
    branches: [main, develop]
    paths:
      - 'src/HitPan.Backoffice.API/**'
      - 'src/HitPan.Backoffice/**'
      - 'src/HitPan.Landing/**'
      - '.github/workflows/deploy-ncp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build-ok: ${{ steps.build.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build Backoffice API + Web + Landing
        id: build
        # 헌법 #19 게이트: warnings = errors
        run: |
          dotnet build src/HitPan.Backoffice.API/HitPan.Backoffice.API.csproj -c Release /p:TreatWarningsAsErrors=true
          dotnet build src/HitPan.Backoffice/HitPan.Backoffice.csproj -c Release /p:TreatWarningsAsErrors=true
          dotnet build src/HitPan.Landing/HitPan.Landing.csproj -c Release /p:TreatWarningsAsErrors=true

      - name: Publish Backoffice API
        run: dotnet publish src/HitPan.Backoffice.API/HitPan.Backoffice.API.csproj -c Release -o publish/backoffice-api --no-build

      - name: Publish Backoffice Web
        run: dotnet publish src/HitPan.Backoffice/HitPan.Backoffice.csproj -c Release -o publish/backoffice-web --no-build

      - name: Publish Landing
        run: dotnet publish src/HitPan.Landing/HitPan.Landing.csproj -c Release -o publish/landing --no-build

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ncp-publish
          path: publish/
          retention-days: 7

  deploy:
    name: Deploy to NCP
    needs: build
    if: needs.build.outputs.build-ok == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Download publish artifacts
        uses: actions/download-artifact@v5
        with:
          name: ncp-publish
          path: publish/

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.NCP_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ncp_key
          chmod 600 ~/.ssh/ncp_key
          ssh-keyscan -H ${{ secrets.NCP_HOST }} >> ~/.ssh/known_hosts

      # ── B-1 봉합: 광역 sudo(rsync·systemctl·cp) 를 deploy-web.sh 래퍼 하나로 흡수 ──
      #   ★ 기존: 러너가 SSH 로 sudo rsync·sudo systemctl 을 직접 실행 → SSH 키만으로 NCP root RCE.
      #     그 통로로 update-keys 개인키까지 읽혀 UPDATE CD 의 좁힌 권한이 무의미했다(관통결함 B-1).
      #   ★ 변경: 러너는 데이터(publish 산출물)만 staging 에 올리고, 백업·배치·재기동·롤백은
      #     전부 NCP 상주 deploy-web.sh 안에서. sudoers 는 이 래퍼 1개(인자 0개)만 NOPASSWD.
      #   RELEASE_INSTALLER_VERSION 은 래퍼에 env 로 전달(래퍼가 형식검증 후 drop-in 반영, B-8).
      #   ⚠️ 활성 전제(트랙2): NCP 에 deploy-web.sh 상주(/opt/hitpan/deploy/) + sudoers 화이트리스트 배치.
      - name: Stage data + invoke deploy-web.sh wrapper (B-1)
        env:
          NCP_USER: ${{ secrets.NCP_USER }}
          NCP_HOST: ${{ secrets.NCP_HOST }}
          RELEASE_VERSION: ${{ vars.RELEASE_INSTALLER_VERSION }}
        run: |
          # 1) 데이터만 staging 으로 전송 (실행 로직 0, 경계 A)
          ssh -i ~/.ssh/ncp_key "$NCP_USER@$NCP_HOST" "mkdir -p /var/hitpan/staging/web/api /var/hitpan/staging/web/web /var/hitpan/staging/web/landing"
          rsync -avz --delete -e "ssh -i ~/.ssh/ncp_key" publish/backoffice-api/ "$NCP_USER@$NCP_HOST:/var/hitpan/staging/web/api/"
          rsync -avz --delete -e "ssh -i ~/.ssh/ncp_key" publish/backoffice-web/ "$NCP_USER@$NCP_HOST:/var/hitpan/staging/web/web/"
          rsync -avz --delete -e "ssh -i ~/.ssh/ncp_key" publish/landing/        "$NCP_USER@$NCP_HOST:/var/hitpan/staging/web/landing/"
          # 2) 래퍼 호출 (인자 0개, 광역 sudo 흡수) — 백업·배치·drop-in·재기동·헬스체크·롤백 전부 여기
          #    RELEASE_VERSION 형식은 래퍼가 ^[A-Za-z0-9._-]+$ 로 재검증(B-8).
          #    ★ sudoers 정합(검증팀 BLOCKER): sudo 는 실행파일 경로를 정확 매칭한다.
          #      `sudo bash <스크립트>` 로 부르면 sudo 대상이 /usr/bin/bash 라 화이트리스트
          #      (NOPASSWD: /opt/hitpan/deploy/deploy-web.sh)와 불일치 → NOPASSWD 미적용 → 실패.
          #      또 bash 를 화이트리스트에 넣으면 임의 스크립트 root 실행이 열려 B-1 봉합이 무너진다.
          #      → 스크립트를 직접 실행(shebang·+x)한다. env 는 sudo 명령줄 인라인 할당으로 전달.
          #      (트랙2 sudoers 는 SETENV: 로 이 인라인 env 를 허용해야 함 — G-B 라인에 명시.)
          ssh -i ~/.ssh/ncp_key "$NCP_USER@$NCP_HOST" \
            "sudo RELEASE_VERSION='${RELEASE_VERSION:-}' /opt/hitpan/deploy/deploy-web.sh"

      # ── 출하 버전 정합·헬스체크·롤백은 deploy-web.sh 래퍼가 전담 (B-1 봉합) ──
      #   이전 별도 스텝 3개(Sync release version / Healthcheck / Rollback)는
      #   전부 광역 sudo(sudo tee·sudo systemctl·sudo rsync)를 다시 써서 B-1 봉합을 무력화했다.
      #   → 그 로직을 deploy-web.sh 안으로 흡수(drop-in 버전 + 정합게이트 + 헬스체크 + 실패 시 롤백).
      #   래퍼가 헬스체크 실패 시 exit 비영점 → 이 잡이 실패로 떨어지고 아래 Notify 가 뜬다.
      #   ⚠️ 랜딩 1.2.33/메일 1.2.28 갈라짐(F-5) 방지 정합게이트도 래퍼 §7 에 이관됨.

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::NCP 배포 실패(래퍼 deploy-web.sh 헬스체크·정합게이트 포함). SSH 진단 후 수동 점검 검토."
