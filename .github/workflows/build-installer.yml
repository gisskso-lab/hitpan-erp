# 설치마법사 EXE 빌드 (사장님 결재 Plan 2026-06-09 — cicd-velvety-reef)
#
# 트리거: 태그 push (v1.x.x 형식)
# 산출물: HitPanInstaller-{version}.exe
# 헌법 정합:
#   #28·#30 — 고객 손 0번 (사일런트 설치 + 자동 시작)
#   #31 — 백신 5종 호환 (코드 서명 필수, 사장님 결재 2번 후 활성화)
#   #34 — 설치마법사는 베타부터 정식 완성도
#
# 사장님 결재 필요:
#   - [[project_exe_build_hold]] ERP 보충 1회 + GO 결재 후에만 실제 배포
#   - 결재 2 (코드 서명) OK 후 SIGN_CERT_PASSWORD secret 등록
name: Build Installer EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-installer:
    name: Build HitPan Installer EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v',''
          } else {
            $v = '${{ inputs.version }}'
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version resolved: $v"

      - name: Publish ERP API (single-file)
        run: |
          dotnet publish src/HitPan.API/HitPan.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o installer/payload/api
        shell: pwsh

      - name: Publish ERP Web (Blazor WASM)
        run: |
          dotnet publish src/HitPan.Web/HitPan.Web.csproj `
            -c Release `
            -o installer/payload/web
        shell: pwsh

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Write-Host "Inno Setup installed"

      - name: Compile installer
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $iss = 'installer/HitPan-Universal.iss'
          if (-not (Test-Path $iss)) {
            Write-Error "Installer script not found: $iss"
            exit 1
          }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DAppVersion=$env:INSTALLER_VERSION" `
            $iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compile failed"
            exit 1
          }

      # 결재 2 (코드 서명) OK 후 활성화:
      # - name: Sign EXE
      #   shell: pwsh
      #   env:
      #     SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
      #   run: |
      #     signtool sign /f cert/hitpan.pfx /p $env:SIGN_CERT_PASSWORD /tr http://timestamp.sectigo.com /td sha256 /fd sha256 installer/output/*.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HitPanInstaller-${{ steps.ver.outputs.version }}
          path: installer/output/*.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
          name: HitPan Installer ${{ steps.ver.outputs.version }}
          body: |
            # 히트판 ERP 설치마법사 ${{ steps.ver.outputs.version }}

            ## 사용 방법
            1. EXE 다운로드 → 더블클릭 실행
            2. 시리얼 키 입력 (가입 시 이메일로 받은 시리얼)
            3. 자동 설치 진행 (MariaDB + .NET + cloudflared)
            4. 설치 완료 후 ERP 자동 시작

            ## 헌법 정합
            - #28·#30 — 고객 손 0번
            - #31 — 백신 5종 호환
            - #34 — 베타부터 정식 완성도
