# 축 6-2 (2026-05-14): TruffleHog 자체 시크릿 룰셋
# 사장님 헌법 #23 5중 검증 ③ SAST — OSS detectors가 못 잡는 히트판 내부 시크릿 패턴 보강.
# TruffleHog --config 옵션으로 로드. 정규식 매칭 시 verified=false라도 alert.
detectors:
  - name: hitpan-db-password
    keywords:
      - Hitpan2025
    regex:
      password: 'Hitpan2025!'

  - name: hitpan-aes-key
    keywords:
      - ERP_ENCRYPTION_KEY
      - HITPAN_KEK
    regex:
      key: '[A-Za-z0-9+/]{43}='

  - name: hitpan-jwt-secret
    keywords:
      - JwtSettings
      - JWT_SECRET
    regex:
      secret: '(?i)(jwt[_-]?secret|jwtkey)["'']?\s*[:=]\s*["''][A-Za-z0-9+/=]{32,}["'']'

  # 20260723작1 보강5 — 자동업데이트 서명 개인키 오커밋 최종 안전망.
  # NCP 전용 EC 개인키(update_private.pem)가 실수로 레포에 커밋되는 걸 CI 가 잡는다.
  # 헌법 #22·#29: 개인키는 NCP `/var/hitpan/update-keys/` 밖으로 절대 나오면 안 됨.
  - name: hitpan-ec-private-key
    keywords:
      - BEGIN EC PRIVATE KEY
      - BEGIN PRIVATE KEY
    regex:
      key: '-----BEGIN (EC )?PRIVATE KEY-----'

  # 20260724작3 B-17 — NCP 배포용 SSH 개인키(NCP_SSH_PRIVATE_KEY) 오커밋 안전망.
  # 이 키가 레포에 새면 NCP root 접근이 노출된다(B-1 배포계정·개인키 통로).
  # OpenSSH 포맷(-----BEGIN OPENSSH PRIVATE KEY-----)과 RSA 포맷 모두 잡는다.
  - name: hitpan-ssh-private-key
    keywords:
      - BEGIN OPENSSH PRIVATE KEY
      - BEGIN RSA PRIVATE KEY
    regex:
      key: '-----BEGIN (OPENSSH|RSA) PRIVATE KEY-----'
